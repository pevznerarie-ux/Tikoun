<script>/* Apparence choisie par chacun : clair, sombre, ou automatique (sombre de 20 h à 7 h) */
window.themePref = () => { try { return localStorage.getItem("mastery.theme") || "clair"; } catch(e){ return "clair"; } };
window.applyTheme = () => { const p = themePref(), h = new Date().getHours(), dark = p === "sombre" || (p === "auto" && (h >= 20 || h < 7));
  document.documentElement.dataset.theme = dark ? "dark" : "light"; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? "#14110F" : "#FFFFFF"; };
applyTheme(); setInterval(applyTheme, 60000);</script>

}

    --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
  }
}

  --pen:#FF7A6E; --pen-soft:#3A1E1D; --blue:#E6D3A8; --blue-soft:#2A2A22; --gold:#D9AE58; --gold-soft:#3A3120; --on-blue:#10141D;

*{box-sizing:border-box}

/* ===== Premium layer ===== */
:root{--r:16px;--gold-2:#E2B865;--shadow:0 1px 2px rgba(21,35,63,.04),0 10px 30px -14px rgba(21,35,63,.16);--hero:#13203B}
body{font-size:15px;letter-spacing:-.003em}
.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{padding-block:16px 6px}
.logo small{font-size:12.5px;letter-spacing:.02em}
.tab{font-weight:500;font-size:14.5px;padding:12px 13px 11px;border-bottom-width:2px;color:var(--muted);transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{font-weight:600}
.view{padding-top:32px;gap:22px}

.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{filter:brightness(1.06)}
.btn.on-dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#F4EFE4}

.chip{border-radius:6px;padding:3px 8px;font-size:11.5px;letter-spacing:.01em}
.label{font-size:11px;letter-spacing:.14em;color:var(--gold)}

/* Onglets de classe repliables */

#jobs-pill .btn{flex:none;background:#fff;color:#15233F;border-color:transparent}#jobs-pill .btn.ghost{background:transparent;color:#fff}#jobs-pill.done{background:#1E5C3E}

.qchips .chip.cur{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.qchips .chip.ok:not(.cur){background:var(--ok-soft,#E6F4EA);color:var(--ok,#1E7B45)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;scroll-margin-top:120px}
.score .qs{min-width:40px;min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono);font-weight:700;cursor:pointer;color:var(--ink)}

@media (max-width:760px){.score input{width:58px;font-size:16px;min-height:36px}.qcard .row.between{flex-wrap:wrap}.seg{display:flex}.seg button{flex:1;padding:8px 6px;font-size:14px}.q{padding:12px}.copy-h{flex-wrap:wrap}}
/* iPhone : un champ en dessous de 16 px fait zoomer tout l'écran au toucher */
@media (max-width:760px){input,select,textarea{font-size:16px!important}.btn.sm{min-height:38px}.tags .btn.sm{min-width:30px;min-height:30px}}
/* Cohérence des boutons : un lien-bouton a la couleur d'un bouton, un bouton discret n'a pas d'ombre, une suppression est en rouge */
.btn{color:var(--ink)}
.btn.ghost{box-shadow:none}.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--bad-soft);border-color:transparent}
.btn.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* Une zone de message vide ne laisse pas de blanc en bas des cadres */
.grid>.status:empty,.panel>.status:empty{display:none}
/* Champs : jamais plus larges que leur colonne (dates sur téléphone) ; placeholder lisible */
input,select,textarea{min-width:0;max-width:100%}

/* Case à cocher et son texte restent sur la même ligne */
label.row:has(>input[type=checkbox]),label.row:has(>input[type=radio]){flex-wrap:nowrap;align-items:flex-start}

.view a:not([class]),.view .small a,.view p a{color:var(--ink);text-underline-offset:2px;text-decoration-color:var(--gold)}
/* Le titre de section garde la police des titres */
.head h3 .num{font-family:var(--body);font-size:15px}
/* La pastille de correction ne cache pas les derniers boutons de la page */
body:has(#jobs-pill) .wrap{padding-bottom:120px}
.dev-form{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
@media (max-width:600px){.q-top{flex-direction:column;align-items:stretch}.q-top .score{flex-wrap:wrap}.dev-form{grid-template-columns:1fr}.dev-form>.btn{justify-self:start}}

/* ================= Design « moderne lumineux » : une seule police, un bleu vif, des cartes blanches ================= */
:root{
  --paper:#F6F7FB; --surface:#FFFFFF; --surface-2:#F1F3F9; --ink:#101828; --muted:#667085; --line:#E4E7EE;
  --blue:#C8643B; --blue-2:#A94F2A; --blue-soft:#FAEEE8; --on-blue:#FFFFFF; --gold:#C8643B; --gold-2:#F3D9CC; --gold-soft:#F6E3D9;
  --pen:#D92D20; --pen-soft:#FEECEB; --ok:#067647; --ok-soft:#E3F6EC; --warn:#A15C07; --warn-soft:#FEF7C3; --bad:#D92D20; --bad-soft:#FEECEB;
  --display:"Inter","Noto Sans Hebrew",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px -8px rgba(16,24,40,.08); --hero:#C8643B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14110F; --surface:#1C1815; --surface-2:#26201B; --ink:#F2ECE6; --muted:#A99D92; --line:#352C26;
  --blue:#E08A63; --blue-2:#EBA07E; --blue-soft:#3A2219; --on-blue:#14110F; --gold:#E08A63; --gold-soft:#3A2219;
  --ok:#47CD89; --ok-soft:#10301F; --warn:#F5B44A; --warn-soft:#33260F; --bad:#FF7A70; --bad-soft:#3A1C1A; --pen:#FF7A70; --pen-soft:#3A1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -10px rgba(0,0,0,.6); --hero:#A94F2A}}
:root[data-theme="dark"]{
  --paper:#14110F; --surface:#1C1815; --surface-2:#26201B; --ink:#F2ECE6; --muted:#A99D92; --line:#352C26;
  --blue:#E08A63; --blue-2:#EBA07E; --blue-soft:#3A2219; --on-blue:#14110F; --gold:#E08A63; --gold-soft:#3A2219;
  --ok:#47CD89; --ok-soft:#10301F; --warn:#F5B44A; --warn-soft:#33260F; --bad:#FF7A70; --bad-soft:#3A1C1A; --pen:#FF7A70; --pen-soft:#3A1C1A; --hero:#A94F2A}
body{font-family:var(--body);font-size:15px;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3,.acc-n{font-family:var(--display);letter-spacing:-.022em}
h2{font-weight:700} h3{font-size:17px;font-weight:650;letter-spacing:-.012em}
.head h2{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.head p{font-size:15px;color:var(--muted)}
@media (max-width:760px){.head h2{font-size:25px}}
/* Barre du haut : blanche, onglets en pastilles */
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.brand{padding-block:14px 8px}
.logo small{color:var(--muted);border-left-color:var(--line)}
.who{font-size:12.5px}
.tabs{gap:4px;padding-bottom:10px}
.tab{font-size:14px;font-weight:550;padding:7px 12px;border-radius:10px;border-bottom:0;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--blue);background:var(--blue-soft);font-weight:650}
.view{padding-top:28px;gap:20px}
/* Cartes */
.panel{border-radius:var(--r);padding:22px 24px;border:1px solid var(--line);box-shadow:var(--shadow)}
@media (max-width:600px){.panel{padding:18px}}
.acc{border-radius:var(--r);box-shadow:var(--shadow)}
.acc-n{font-size:19px;font-weight:650}
.acc-c{color:var(--blue)}
.label{font-size:11px;letter-spacing:.09em;color:var(--blue);font-weight:650}
.item{padding:14px 0}
.item .t{font-weight:600}
a.item.link:hover .t{color:var(--blue)}
/* Boutons */
.btn{border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--line)}
.btn.primary,.btn.gold{background:var(--blue);border-color:var(--blue);color:var(--on-blue);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.btn.primary:hover,.btn.gold:hover{background:var(--blue-2);border-color:var(--blue-2);filter:none}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.cur{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);box-shadow:none}
.fchip{border-radius:999px;font-weight:550}
.fchip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip{border-radius:999px;padding:3px 9px;font-weight:600}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
/* Champs */
input,select,textarea{border-radius:10px;border-color:var(--line);background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--blue)}
:focus-visible{outline-color:var(--blue)}
.field>label{color:var(--ink);font-weight:550;opacity:.8}
.drop{border-radius:14px;border-color:color-mix(in srgb,var(--blue) 30%,var(--line));background:color-mix(in srgb,var(--blue-soft) 45%,transparent);color:var(--ink)}
.drop:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
/* Étapes d'un contrôle */
.st{border-radius:999px;padding:8px 14px;font-weight:550;background:var(--surface);border:1px solid var(--line)}
.st b{background:var(--surface-2)}
.st.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}.st.on b{background:rgba(255,255,255,.22);color:#fff}
.st.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step{border-radius:999px}.step.on{background:var(--blue);color:var(--on-blue)}
.stepnav{border-top:0;padding-top:4px}
.seg{border-radius:12px}.seg button[aria-pressed="true"]{color:var(--blue)}
.vtab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.stu{border-radius:10px}.stu[aria-current="true"]{background:var(--blue-soft);color:var(--blue)}
/* Accueil : carte blanche, la couleur seulement sur l'essentiel */
.hero-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero-card h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.hero-card p{color:var(--muted)}.hero-card p b{color:var(--ink)}
.hc-kicker{color:var(--blue);letter-spacing:.12em}
.hc-stats{background:transparent;gap:10px;border-radius:0}
.hc-stats div{background:var(--surface-2);border-radius:14px;border:0}
.hc-stats b{font-family:var(--display);font-weight:700;letter-spacing:-.03em;color:var(--ink);font-size:30px}
.hc-stats span{color:var(--muted)}
.hero-card [style*="--gold-2"]{color:var(--blue)!important}
.hero-card .btn.gold{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:none}
.hero-card .btn.gold:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn.on-dark{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.on-dark:hover{background:var(--surface-2)}
@media (max-width:760px){.hero-card{padding:22px}.hero-card h2{font-size:28px}}
/* Lignes de contrôle : progression + un seul bouton */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:18px;padding:14px 12px;margin:0 -12px;border-radius:12px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow:hover{background:var(--surface-2)}.crow:hover+.crow,.crow:hover{border-top-color:transparent}
.crow .t{font-weight:600}.crow .s{font-size:13px;color:var(--muted)}
.crow-prog{display:grid;gap:5px;justify-items:end;text-align:right}
.pdots{display:flex;gap:3px}.pdots i{width:16px;height:4px;border-radius:2px;background:var(--line)}.pdots i.d{background:var(--ok)}.pdots i.c{background:var(--blue)}
.crow-st{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}.crow-st.warn{color:var(--blue)}.crow-st.ok{color:var(--ok)}
.crow-go{pointer-events:none}
@media (max-width:600px){.crow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.crow-prog{grid-column:1;grid-row:2;justify-items:start;text-align:left}.crow-go{grid-column:2;grid-row:1/3}}
/* Pages vides : un message centré et l'action juste dessous */
.panel.empty{padding:44px 24px;display:grid;justify-items:center;align-content:center;gap:14px;text-align:center;color:var(--muted);font-size:15px}
/* Page de connexion : une carte centrée */
.auth{min-height:calc(100vh - 160px);display:grid;place-content:center;justify-items:center;gap:16px;padding:12px 0 40px}
.auth-card{width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 16px 40px -20px rgba(16,24,40,.18);padding:32px 28px;display:grid;gap:16px}
.auth-h{text-align:center;display:grid;gap:6px;margin-bottom:4px}.auth-h h2{font-size:26px;font-weight:700;letter-spacing:-.03em}.auth-h p{color:var(--muted);font-size:14.5px}
.auth-go{width:100%;padding:12px 16px;font-size:15px}
.auth-note{text-align:center;margin:0}
.auth-alt{display:grid;gap:8px;justify-items:center;border-top:1px solid var(--line);padding-top:16px}.auth-alt .btn{width:100%}
.auth-foot{text-align:center}.view .auth-foot a{color:var(--muted);text-decoration:none}.view .auth-foot a:hover{color:var(--ink)}
.auth-card>.status:empty{display:none}
@media (max-width:600px){.auth{min-height:auto;place-content:start center;padding-top:8px}.auth-card{padding:24px 20px}}
/* Banque : barre de recherche et lignes compactes */
.bk{padding-top:14px}
.bk-bar{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bk-bar input{flex:1 1 220px}.bk-bar select{flex:0 1 200px;width:auto}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.bk-bar+.bk-row{border-top:0}
.bk-main{min-width:0}.bk-main .t{font-weight:600}.bk-main .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-act{display:flex;gap:6px;align-items:center;flex:none}.bk-act select{width:auto;max-width:180px;padding:6px 10px}
.bk-row.open{background:var(--surface-2);margin:0 -14px;padding:13px 14px;border-radius:12px}
.bk-more{display:flex;justify-content:center;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:600px){.bk-row{flex-wrap:wrap}.bk-main .s{white-space:normal}.bk-act{width:100%;justify-content:flex-end;flex-wrap:wrap}.bk-act select{flex:1 1 100%;max-width:none}}
/* Forfait : compteur du mois et paliers */
.quota{display:grid;gap:6px}
.qbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.qbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}.qbar i.half{background:var(--warn)}.qbar i.full{background:var(--bad)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

.tier>.btn:first-of-type{margin-top:auto}
.tier.best,.tier.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tier-p{font-size:22px;font-weight:700;letter-spacing:-.02em}
/* Menu du compte */
.brand{position:relative}
.umenu{position:relative}
.ubtn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;font-weight:600;max-width:52vw}
.ubtn:hover,.ubtn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--line)}

.uchev{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);flex:none}
.ubtn.dot .uav{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
.upop{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:6px;display:grid;gap:2px;z-index:30}
.upop[hidden]{display:none}
.upop .tab{display:block;border-radius:9px;padding:9px 12px;color:var(--ink);font-weight:550}
.upop .tab[hidden]{display:none}
.upop .tab:hover{background:var(--surface-2)}
.upop .tab[aria-selected="true"]{background:var(--blue-soft);color:var(--blue)}
.upop-st{font-size:12.5px;color:var(--muted);padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px}
.upop-st:empty{display:none}.upop-st .warn{color:var(--warn);margin-top:2px}
@media (max-width:600px){.ubtn .who,.ubtn .uchev{display:none}.ubtn{padding:4px}.uav[hidden]{display:grid}.uav:empty::before{content:"";width:12px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}}
/* Tableaux, barres, liens */
th{font-size:11px;letter-spacing:.06em;font-weight:650}
.bar .track{border-radius:99px}.bar .fill{border-radius:99px}
.view a:not([class]),.view .small a,.view p a{color:var(--blue);text-decoration-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.banner{border-radius:12px}
.toast{border-radius:12px;background:#101828;color:#fff;box-shadow:0 12px 30px -10px rgba(16,24,40,.45)}
#jobs-pill{background:#101828}
.qchips .chip.cur{background:var(--blue);border-color:var(--blue)}
.score .qs.on{background:var(--blue);border-color:var(--blue)}
details>summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
.total{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:30px;line-height:1.1}.total small{font-size:16px;font-weight:600;opacity:.7}
@media (max-width:600px){.form-row[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
@media (max-width:600px){.item{flex-wrap:wrap}.item>.row{margin-left:auto}.hero-card .row>.btn{flex:1 1 auto}}
</style>
