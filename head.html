<style>
:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --surface-2:#F3EFE6; --ink:#15233F; --muted:#6B6758; --line:#E7E1D4;
  --pen:#C0392B; --pen-soft:#FBEAE7; --blue:#15233F; --blue-soft:#EBEEF4; --gold:#B7862B; --gold-soft:#F7EDD8; --on-blue:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A8690F; --warn-soft:#FBF0DC; --bad:#B42318; --bad-soft:#FCE8E6;
  --display:"Cormorant Garamond","Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --body:"Inter","Noto Sans Hebrew",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10141D; --surface:#171C27; --surface-2:#1F2532; --ink:#EFEADF; --muted:#A7A192; --line:#2C3342;
    --pen:#FF7A6E; --pen-soft:#3A1E1D; --blue:#E6D3A8; --blue-soft:#2A2A22; --gold:#D9AE58; --gold-soft:#3A3120; --on-blue:#10141D;
    --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10141D; --surface:#171C27; --surface-2:#1F2532; --ink:#EFEADF; --muted:#A7A192; --line:#2C3342;
  --pen:#FF7A6E; --pen-soft:#3A1E1D; --blue:#E6D3A8; --blue-soft:#2A2A22; --gold:#D9AE58; --gold-soft:#3A3120; --on-blue:#10141D;
  --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:600}
h2{font-size:22px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{height:34px;width:auto;display:block}
.logo .wm{height:22px;width:auto;display:block;margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .wm{filter:brightness(0) invert(.92)}}
:root[data-theme="dark"] .logo .wm{filter:brightness(0) invert(.92)}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo small{border-left:1px solid var(--line);padding-left:10px}
.logo small{color:var(--muted);font-size:13px}
.who{font-size:12px;color:var(--muted);text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 11px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
a.tab{text-decoration:none;display:inline-block}
.crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--blue)}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stepper::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);background:var(--surface-2);white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.st b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:12px}
.st.done{color:var(--ok);background:var(--ok-soft)} .st.done b{background:var(--ok);color:var(--surface)}
.st.on{color:var(--paper);background:var(--ink)} .st.on b{background:var(--gold);color:#fff}
.stepnav{display:flex;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
a.item.link{text-decoration:none;color:inherit} a.item.link:hover .t{color:var(--blue)}
.view{padding-top:18px;display:grid;gap:16px}
.view>*,.grid>*,.split>*{min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.head p{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.split{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}.split>aside{max-height:260px;overflow-y:auto}.logo small{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.field{display:grid;gap:4px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600} .item .s{font-size:13px;color:var(--muted)}
.clickable{cursor:pointer} .clickable:hover .t{color:var(--blue)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.on{background:var(--ink);color:var(--paper)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.status{font-size:13px;min-height:1.4em}
.thinking{color:var(--muted);font-style:italic}
.err{color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.qed{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.vtab{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:40px;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-weight:700;text-align:center}
.cell.ok{background:var(--ok-soft);color:var(--ok)} .cell.warn{background:var(--warn-soft);color:var(--warn)}
.cell.bad{background:var(--bad-soft);color:var(--bad)} .cell.none{background:var(--surface-2);color:var(--muted)}
.stu{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;gap:8px;border:0;background:none;width:100%;text-align:left}
.stu:hover{background:var(--surface-2)} .stu[aria-current="true"]{background:var(--blue-soft)}
.copy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.copy-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.q:first-of-type{border-top:0}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.answer{background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:15px;white-space:pre-wrap;line-height:26px;
  background-image:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px)}
.answer mark{background:var(--pen-soft);color:var(--pen);text-decoration:underline wavy var(--pen);text-underline-offset:4px;padding:0 2px;border-radius:3px}
.illisible{color:var(--warn);font-weight:600}
.note{font-family:var(--hand);color:var(--pen);font-size:21px;line-height:1.2}
.comment{border-left:2px solid var(--pen);padding-left:12px;display:grid;gap:6px}
.score{display:flex;align-items:center;gap:6px}
.score input{width:66px;text-align:center;font-family:var(--mono);font-weight:700;color:var(--pen)}
.score .den{font-family:var(--mono);color:var(--muted)}
.total{font-family:var(--hand);font-size:34px;color:var(--pen);line-height:1}
.total small{font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.scans{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.scans img{height:140px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.zoom{position:fixed;inset:0;background:rgba(10,14,22,.85);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;display:flex;justify-content:center;align-items:flex-start}
.zoom img{max-width:min(100%,900px);background:#fff;border-radius:6px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:40px 1fr 56px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.queue{display:grid;gap:0}
.qi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.qi img{width:52px;height:68px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff}
.preview-wrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.lvl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.lvl.socle{background:var(--warn-soft);color:var(--warn)} .lvl.standard{background:var(--blue-soft);color:var(--blue)} .lvl.approfondi{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Printable sheet — fixed light look, paper is paper */
#sheetStage{position:absolute;left:-12000px;top:0}
.sheet{width:794px;height:1123px;background:#fff;color:#111;font-family:"Inter","Noto Sans Hebrew",Arial,sans-serif;padding:108px 60px 84px;position:relative;overflow:hidden}
.sheet *{color:#111}
.sh-head{display:grid;grid-template-columns:1fr;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.sh-school{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#444}
.sh-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:800;line-height:1.15;margin:2px 0 4px}
.sh-meta{font-size:13px;color:#333}
.sh-name{margin-top:8px;font-size:15px}
.sh-name b{font-size:17px}
.sh-qr{text-align:center;font-size:9px;color:#555;font-family:"JetBrains Mono",monospace}
.sh-qr img{width:96px;height:96px;image-rendering:pixelated;display:block}
.sh-mini{position:absolute;top:44px;left:120px;right:100px;display:flex;align-items:center;gap:8px;font-size:11px;color:#555}
.sh-mini img{width:72px;height:72px;image-rendering:pixelated}
.sh-cons{font-size:13px;border:1px solid #999;border-radius:6px;padding:6px 10px;margin-bottom:12px}
.sh-q{margin-bottom:14px}
.sh-qh{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.sh-qt{margin:3px 0 6px;white-space:pre-wrap}
.sh-box{border:1.5px solid #222;border-radius:6px;background-image:repeating-linear-gradient(transparent 0 var(--lh,30px),#c9cdd6 var(--lh,30px) calc(var(--lh,30px) + 1px));position:relative}
.sh-box::before{content:attr(data-tag);position:absolute;top:2px;right:6px;font-size:9px;color:#888;font-family:"JetBrains Mono",monospace}

.sh-corner{position:absolute;image-rendering:pixelated}
.crop{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in;display:block}
.answer mjx-container{display:inline-block;margin:0 1px}
.sh-qcm{display:grid;gap:8px;margin-top:4px}
.sh-opt{display:flex;align-items:center;gap:10px}
.sh-case{width:22px;height:22px;border:2px solid #111;border-radius:3px;flex:none;background:#fff}
.doc{padding-top:60px}
.rd-note{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.rd-big{font-family:"Caveat",cursive;font-size:54px;color:#C4302B !important;line-height:1}
.rd-note>span:nth-child(2){font-family:"Caveat",cursive;font-size:30px;color:#C4302B !important}
.rd-sub{font-size:12px;color:#555 !important;width:100%}
.rd-q{font-family:"Caveat",cursive;font-size:22px;color:#C4302B !important}
.rd-crop{display:block;max-width:100%;max-height:260px;border:1px solid #ccc;border-radius:4px;margin:4px 0}
.rd-com{font-family:"Caveat",cursive;font-size:21px;line-height:1.2;color:#C4302B !important;border-left:2px solid #C4302B;padding-left:10px;margin:4px 0}
.rd-tag{font-size:12.5px;color:#333 !important}
.he{font-family:"Frank Ruhl Libre","Times New Roman",serif}

/* ===== Premium layer ===== */
:root{--r:16px;--gold-2:#E2B865;--shadow:0 1px 2px rgba(21,35,63,.04),0 10px 30px -14px rgba(21,35,63,.16);--hero:#13203B}
body{font-size:15px;letter-spacing:-.003em}
.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{padding-block:16px 6px}
.logo small{font-size:12.5px;letter-spacing:.02em}
.tab{font-weight:500;font-size:14.5px;padding:12px 13px 11px;border-bottom-width:2px;color:var(--muted);transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{font-weight:600}
.view{padding-top:32px;gap:22px}
.head{margin-bottom:2px}
.head h2{font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.head p{margin-top:6px;font-size:15px}
h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.panel{border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.btn{border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;box-shadow:0 1px 1px rgba(21,35,63,.04);transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 1px 2px rgba(21,35,63,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{filter:brightness(1.06)}
.btn.on-dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#F4EFE4}
.btn.on-dark:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.chip{border-radius:6px;padding:3px 8px;font-size:11.5px;letter-spacing:.01em}
.label{font-size:11px;letter-spacing:.14em;color:var(--gold)}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
input,select,textarea{border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.item{padding:15px 0}
.item .t{font-weight:600;font-size:15px}
.st{border-radius:999px;padding:9px 15px;font-weight:500}
.st.on{font-weight:600}
.fchip{padding:6px 14px}
.stepnav{padding-top:14px}
.hero-card{background:var(--hero);color:#F4EFE4;border-radius:20px;padding:30px 32px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;box-shadow:0 20px 50px -24px rgba(19,32,59,.55);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;left:-90px;bottom:-130px;width:220px;height:220px;border:1px solid rgba(226,184,101,.25);border-radius:50%}
.hero-card h2{font-size:36px;font-weight:500;color:#fff;letter-spacing:-.02em;margin-top:6px}
.hero-card p{color:rgba(244,239,228,.78);margin-top:8px;font-size:15.5px}
.hero-card p b{color:var(--gold-2)}
.hc-kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:600}
.hc-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden;position:relative;z-index:1}
.hc-stats div{background:var(--hero);padding:16px 18px;display:grid;gap:2px}
.hc-stats b{font-family:var(--display);font-size:30px;font-weight:500;color:#fff;letter-spacing:-.02em}
.hc-stats span{font-size:12.5px;color:rgba(244,239,228,.65)}
@media (max-width:760px){.hero-card{grid-template-columns:1fr;padding:24px}.hero-card h2{font-size:28px}.head h2{font-size:26px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#1B2436;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--hero:#1B2436}

/* Cormorant : titres un peu plus grands */
h1,h2,h3,.hc-stats b,.total,.sh-title{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.hero-card::after{display:none}
h2{font-size:26px} h3{font-size:21px;font-weight:600}
.head h2{font-size:38px;font-weight:500}
.hero-card h2{font-size:44px}
.hc-stats b{font-size:36px}
.sh-title{font-size:26px!important;font-weight:700!important}
@media (max-width:760px){.hero-card h2{font-size:34px}.head h2{font-size:30px}}

/* Onglets de classe repliables */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:16px;padding:18px 24px;background:none;border:0;cursor:pointer;text-align:left;color:var(--ink)}
.acc-h:hover{background:var(--surface-2)}
.acc-n{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.acc-s{flex:1;color:var(--muted);font-size:13.5px}
.acc-c{font-size:22px;color:var(--gold);transition:transform .2s;line-height:1}
.acc.open .acc-c{transform:rotate(90deg)}
.acc.open .acc-h{border-bottom:1px solid var(--line)}
.acc-b{padding:18px 24px 22px;display:grid;gap:16px}
.acc-b .panel{box-shadow:none}
@media (max-width:600px){.acc-h{padding:14px 16px;flex-wrap:wrap;gap:4px 12px}.acc-s{order:3;flex-basis:100%}.acc-b{padding:14px 16px}}

/* Hébreu : chaque paragraphe prend automatiquement le bon sens (droite à gauche si hébreu) */
p,li,td,label,textarea,input,.t,.s,.answer,.sh-qt,.sh-opt,.sh-cons,.sh-title,.item .t,.q-text,.bank-q,h1,h2,h3{unicode-bidi:plaintext}
textarea,input{text-align:start}
:lang(he),[dir=rtl]{font-family:"Noto Sans Hebrew","Frank Ruhl Libre",var(--body)}
#jobs-pill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;width:min(560px,calc(100vw - 32px));background:var(--ink,#15233F);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.45);font-size:13px}
#jobs-pill>div{flex:1;min-width:0;display:grid;gap:3px;position:relative}
#jobs-pill b{font-weight:600;font-size:14px}#jobs-pill span{opacity:.8;line-height:1.35}
#jobs-pill i{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden;position:relative}
#jobs-pill i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:#D9B26A;transition:width .6s}
#jobs-pill .btn{flex:none;background:#fff;color:#15233F;border-color:transparent}#jobs-pill .btn.ghost{background:transparent;color:#fff}#jobs-pill.done{background:#1E5C3E}
@media print{#jobs-pill{display:none}}
