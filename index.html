<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{
  --paper:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF1F7; --ink:#1B2440; --muted:#5A637A; --line:#DCE1EB;
  --pen:#C4302B; --pen-soft:#FBE9E7; --blue:#2447A6; --blue-soft:#E6ECFA; --on-blue:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A8690F; --warn-soft:#FBF0DC; --bad:#B42318; --bad-soft:#FCE8E6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F131C; --surface:#161B26; --surface-2:#1D2331; --ink:#E7EAF2; --muted:#9BA4B8; --line:#2A3244;
    --pen:#FF7466; --pen-soft:#3A1E1D; --blue:#8AA6FF; --blue-soft:#1E2848; --on-blue:#0F131C;
    --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F131C; --surface:#161B26; --surface-2:#1D2331; --ink:#E7EAF2; --muted:#9BA4B8; --line:#2A3244;
  --pen:#FF7466; --pen-soft:#3A1E1D; --blue:#8AA6FF; --blue-soft:#1E2848; --on-blue:#0F131C;
  --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:22px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo b span{color:var(--pen)}
.logo small{color:var(--muted);font-size:13px}
.who{font-size:12px;color:var(--muted);text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 11px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
a.tab{text-decoration:none;display:inline-block}
.crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--blue)}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stepper::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);background:var(--surface-2);white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.st b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:12px}
.st.done{color:var(--ok);background:var(--ok-soft)} .st.done b{background:var(--ok);color:var(--surface)}
.st.on{color:var(--paper);background:var(--ink)} .st.on b{background:var(--pen);color:#fff}
.stepnav{display:flex;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
a.item.link{text-decoration:none;color:inherit} a.item.link:hover .t{color:var(--blue)}
.view{padding-top:18px;display:grid;gap:16px}
.view>*,.grid>*,.split>*{min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.split{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}

.between{justify-content:space-between}

.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}

.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.field{display:grid;gap:4px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}

.item:first-child{border-top:0}
.item .t{font-weight:600} .item .s{font-size:13px;color:var(--muted)}
.clickable{cursor:pointer} .clickable:hover .t{color:var(--blue)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.on{background:var(--ink);color:var(--paper)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.status{font-size:13px;min-height:1.4em}
.thinking{color:var(--muted);font-style:italic}
.err{color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.qed{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.vtab{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:40px;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-weight:700;text-align:center}
.cell.ok{background:var(--ok-soft);color:var(--ok)} .cell.warn{background:var(--warn-soft);color:var(--warn)}
.cell.bad{background:var(--bad-soft);color:var(--bad)} .cell.none{background:var(--surface-2);color:var(--muted)}
.stu{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;gap:8px;border:0;background:none;width:100%;text-align:left}
.stu:hover{background:var(--surface-2)} .stu[aria-current="true"]{background:var(--blue-soft)}
.copy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.copy-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.q:first-of-type{border-top:0}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.answer{background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:15px;white-space:pre-wrap;line-height:26px;
  background-image:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px)}
.answer mark{background:var(--pen-soft);color:var(--pen);text-decoration:underline wavy var(--pen);text-underline-offset:4px;padding:0 2px;border-radius:3px}
.illisible{color:var(--warn);font-weight:600}
.note{font-family:var(--hand);color:var(--pen);font-size:21px;line-height:1.2}
.comment{border-left:2px solid var(--pen);padding-left:12px;display:grid;gap:6px}
.score{display:flex;align-items:center;gap:6px}
.score input{width:66px;text-align:center;font-family:var(--mono);font-weight:700;color:var(--pen)}
.score .den{font-family:var(--mono);color:var(--muted)}
.total{font-family:var(--hand);font-size:34px;color:var(--pen);line-height:1}
.total small{font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.scans{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.scans img{height:140px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.zoom{position:fixed;inset:0;background:rgba(10,14,22,.85);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;display:flex;justify-content:center;align-items:flex-start}
.zoom img{max-width:min(100%,900px);background:#fff;border-radius:6px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:40px 1fr 56px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.queue{display:grid;gap:0}
.qi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.qi img{width:52px;height:68px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff}
.preview-wrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.lvl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.lvl.socle{background:var(--warn-soft);color:var(--warn)} .lvl.standard{background:var(--blue-soft);color:var(--blue)} .lvl.approfondi{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Printable sheet — fixed light look, paper is paper */
#sheetStage{position:absolute;left:-12000px;top:0}
.sheet{width:794px;height:1123px;background:#fff;color:#111;font-family:"Source Sans 3",Arial,sans-serif;padding:108px 60px 84px;position:relative;overflow:hidden}
.sheet *{color:#111}
.sh-head{display:grid;grid-template-columns:1fr;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.sh-school{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#444}
.sh-title{font-family:"Bricolage Grotesque",Arial,sans-serif;font-size:22px;font-weight:800;line-height:1.15;margin:2px 0 4px}
.sh-meta{font-size:13px;color:#333}
.sh-name{margin-top:8px;font-size:15px}

.doc{padding-top:60px}
.rd-note{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.rd-big{font-family:"Caveat",cursive;font-size:54px;color:#C4302B !important;line-height:1}

"use strict";
/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const pct = n => Math.round(n * 100) + " %";
const tone = r => r == null ? "none" : r >= 0.7 ? "ok" : r >= 0.5 ? "warn" : "bad";
const uid = (n = 10) => { const a = "abcdefghijkmnpqrstuvwxyz23456789"; let s = ""; const b = crypto.getRandomValues(new Uint8Array(n)); for (const x of b) s += a[x % a.length]; return s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const frDate = d => { if (!d) return ""; const x = new Date(d + (d.length === 10 ? "T12:00:00" : "")); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const half = v => Math.round(v * 2) / 2;
function toast(msg, ms = 3500){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }

const MATIERES = ["Mathématiques","Français","Histoire-Géographie","SVT","Physique-Chimie","Anglais","Guémara","Halakha","Houmach","Hébreu","Hassidout","Philosophie","SES"];

const ECOLE = "Collège-Lycée Beth Mena'hem · Levallois-Perret";
const STATUT = {brouillon:["Brouillon",""], imprime:["Imprimé","blue"], correction:["En correction","warn"], corrige:["Corrigé","ok"]};

const aiErr = c => ({
  not_granted:"L'IA n'a pas été autorisée pour cette page.", sampling_disabled:"L'IA n'est pas disponible pour ce compte.",
  rate_limited:"Trop de demandes d'un coup : attends une minute puis relance.", session_expired:"Session expirée : reconnecte-toi à Claude.",

/* In-memory stand-in when the database is not available in this view */
function memDB(init = {}, persist = null){
  const data = {...init}; const subs = [];
  const colOf = p => p.split("/").slice(0, -1).join("/");
  const notify = col => subs.filter(s => s.col === col).forEach(s => s.fn(snapOf(col)));
  const snapOf = col => { const docs = Object.keys(data).filter(k => colOf(k) === col).map(k => ({id:k.split("/").pop(), exists:true, data:() => data[k], metadata:{}}));
    return {docs, size:docs.length, empty:!docs.length, docChanges:() => [], metadata:{}}; };
  const merge = (a, b) => { for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const doc = p => ({ id:p.split("/").pop(), path:p,
    get: async () => ({id:p.split("/").pop(), exists:!!data[p], data:() => data[p], metadata:{}}),
    set: async d => { data[p] = JSON.parse(JSON.stringify(d)); notify(colOf(p)); if (persist) await persist(p, data[p], "set"); },
    update: async d => { if (!data[p]) throw {code:"invalid_argument"}; const patch = JSON.parse(JSON.stringify(d)); merge(data[p], JSON.parse(JSON.stringify(d))); data[p] = {...data[p]}; notify(colOf(p)); if (persist) await persist(p, data[p], "update", patch); },
    delete: async () => { delete data[p]; notify(colOf(p)); if (persist) await persist(p, null, "delete"); } });
  return { doc, _all:() => data, _remote:(p, val) => { if (val == null) delete data[p]; else data[p] = val; notify(colOf(p)); }, collection: col => ({ path:col, doc: id => doc(col + "/" + (id || uid(16))),
    onSnapshot: (fn) => { const s = {col, fn}; subs.push(s); setTimeout(() => fn(snapOf(col))); return () => subs.splice(subs.indexOf(s), 1); } }) };
}

const levelOf = (e, mat) => e?.niveaux?.[mat] || "standard";
const versionFor = (c, e) => c.differencie ? levelOf(e, c.matiere) : "standard";
const vOf = (q, lvl) => { const v = q.v || {}; if (v[lvl]?.enonce) return v[lvl]; if (v.standard?.enonce) return v.standard; return LEVELS.map(l => v[l]).find(x => x?.enonce) || {enonce:"", corrige:"", criteres:""}; };
const maxOf = c => (c.questions || []).reduce((a, q) => a + (+q.points || 0), 0);
const noteOf = a => a ? (a.note ?? a.noteIA ?? null) : null;
const copyTotal = (c, cp) => (c.questions || []).reduce((s, q) => s + (+noteOf(cp?.answers?.[q.id]) || 0), 0);
const copyDone = (c, cp) => !!cp && (c.questions || []).every(q => noteOf(cp.answers?.[q.id]) != null);
const on20 = (t, m) => m ? t / m * 20 : null;
const bonusMax = c => (+c.bonus?.proprete || 0) + (+c.bonus?.orthographe || 0);
function bonusOf(c, cp){
  const out = {proprete:0, orthographe:0}; if (!cp) return out;
  for (const k of ["proprete","orthographe"]){ const mx = +c.bonus?.[k] || 0; if (!mx) continue;
    if (cp.bonusProf?.[k] != null){ out[k] = +cp.bonusProf[k]; continue; }
    const fr = Object.values(cp.bonusPages || {}).map(b => +b?.[k]).filter(x => !isNaN(x));
    out[k] = fr.length ? half(mx * fr.reduce((a, b) => a + b, 0) / fr.length) : 0; }
  return out;
}
const final20 = (c, cp) => { const b = bonusOf(c, cp); return Math.min(20, on20(copyTotal(c, cp), maxOf(c)) + b.proprete + b.orthographe); };

let wq = Promise.resolve();
function write(path, data, mode = "set"){

}

/* ---------- sheet building (paper) ---------- */
function qrURL(text, cell = 4){ const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createDataURL(cell, 0); }
const payload = (cid, eid, p) => `TK1|${cid}|${eid}|${p}`;
const CORNERS = {tl:[58, 58], tr:[752, 42], bl:[42, 1081], br:[752, 1081]}; const CSIZE = {tl:84, tr:52, bl:52, br:52}; /* marker centres on the 794×1123 sheet */
const pageQ = pg => Array.isArray(pg) ? pg : (pg?.q || []);
function sheetPages(c, e){
  const stage = $("#sheetStage"); stage.innerHTML = "";
  const m = c.mise || {}, pol = +(m.police || 15), lh = +(m.lh || 30);
  const cl = classe(c.classeId), ver = versionFor(c, e);
  const pages = []; const layout = [];
  const newPage = first => {
    const p = document.createElement("div"); p.className = "sheet"; p.style.fontSize = pol + "px";
    const n = pages.length + 1;
    p.innerHTML = first ? `
      <div class="sh-head"><div>
        <div class="sh-school">${esc(m.entete ?? ECOLE)}</div>
        <div class="sh-title" dir="auto">${esc(c.titre)}</div>
        <div class="sh-meta">${esc(c.matiere)} · ${esc(cl?.nom || "")}${c.date ? " · " + esc(frDate(c.date)) : ""}${c.duree ? " · " + esc(c.duree) + " min" : ""}${m.bareme !== false ? " · noté sur " + fmt(maxOf(c)) : ""}</div>
        <div class="sh-name">Élève : <b>${esc(e.prenom)} ${esc(e.nom)}</b></div>
      </div></div>
      ${(m.consignes ?? "").trim() ? `<div class="sh-cons">${esc(m.consignes)}</div>` : ""}`
      : `<div class="sh-mini">${esc(e.prenom)} ${esc(e.nom)} · ${esc(c.titre)} · page ${n}</div>`;
    for (const [k, [x, y]] of Object.entries(CORNERS)){ const z = CSIZE[k], im = document.createElement("img"); im.className = "sh-corner"; im.alt = "";
      im.src = qrURL(k === "tl" ? payload(c.id, e.id, n) : "TK1C|" + k, 3); im.style.cssText = `left:${x - z / 2}px;top:${y - z / 2}px;width:${z}px;height:${z}px`; p.append(im); }
    const foot = document.createElement("div"); foot.className = "sh-foot"; foot.innerHTML = `<span>Tikoun · ${esc(c.id)}·${esc(e.id)}</span><span class="pn">page ${n}</span>`; p.append(foot);
    stage.append(p); pages.push(p); layout.push([]); return p;
  };
  let page = newPage(true);
  const limit = () => 1123 - 84;
  (c.questions || []).forEach((q, i) => {
    const v = vOf(q, ver);
    const b = document.createElement("div"); b.className = "sh-q";
    const isQ = q.type === "qcm";
    b.innerHTML = `<div class="sh-qh"><span>Question ${i + 1}${isQ ? " · coche la ou les bonnes réponses" : ""}</span>${m.bareme !== false ? `<span>/ ${fmt(+q.points)}</span>` : ""}</div>
      <div class="sh-qt" dir="auto">${esc(v.enonce)}</div>
      ${isQ ? `<div class="sh-qcm">${(v.choix || []).map((ch, j) => `<div class="sh-opt"><span class="sh-case"></span><b>${"ABCDEFGH"[j]}</b><span dir="auto">${esc(ch)}</span></div>`).join("")}</div>`
        : `<div class="sh-box" data-tag="Q${i + 1}" style="--lh:${lh}px;height:${(+q.lignes || 5) * (lh + 1) + 8}px"></div>`}`;
    page.insertBefore(b, page.querySelector(".sh-foot"));
    if (b.offsetTop + b.offsetHeight > limit() && layout[layout.length - 1].length){
      b.remove(); page = newPage(false); page.insertBefore(b, page.querySelector(".sh-foot"));
    }
    const pr = page.getBoundingClientRect(), rel = el => { const r = el.getBoundingClientRect(); return {x:Math.round(r.left - pr.left), y:Math.round(r.top - pr.top), w:Math.round(r.width), h:Math.round(r.height)}; };
    if (isQ) layout[layout.length - 1].push({q:q.id, type:"qcm", ...rel(b.querySelector(".sh-qcm")), cases:$$(".sh-case", b).map(rel)});
    else layout[layout.length - 1].push({q:q.id, ...rel(b.querySelector(".sh-box"))});
  });
  pages.forEach((p, i) => { p.querySelector(".pn").textContent = `page ${i + 1} / ${pages.length}`; });
  return {pages, layout: layout.map(l => ({q:l.map(b => b.q), b:l})), version: Object.fromEntries((c.questions || []).map(q => [q.id, ver]))};
}
function drawPreview(){
  const c = ctrl(S.editId), box = $("#preview"); if (!c || !box) return;
  const e = studentsOf(c).find(x => x.id === S.previewEleve);
  if (!e){ box.innerHTML = `<p class="empty">Ajoute des élèves à la classe pour voir l'aperçu.</p>`; return; }
  if (!window.qrcode){ box.innerHTML = `<p class="empty">Chargement…</p>`; return; }
  const {pages} = sheetPages(c, e);
  const w = box.clientWidth || 600, sc = Math.min(1, (w - 16) / 794);
  box.innerHTML = "";
  const inner = document.createElement("div"); inner.style.cssText = "display:grid;gap:12px;padding:8px;justify-content:center";
  pages.forEach(p => { const holder = document.createElement("div"); holder.style.cssText = `width:${794 * sc}px;height:${1123 * sc}px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.15)`;
    const cl = p.cloneNode(true); cl.style.transform = `scale(${sc})`; cl.style.transformOrigin = "0 0"; holder.append(cl); inner.append(holder); });
  box.append(inner); $("#sheetStage").innerHTML = "";
}
async function printSheets(c, list){
  const st = $("#pr-st");
  if (!window.html2canvas || !window.jspdf){ st.textContent = "Bibliothèques PDF non chargées : recharge la page."; return; }
  if (!list.length){ st.textContent = "Aucun élève dans cette classe."; return; }
  const ov = document.createElement("div"); ov.className = "zoom"; ov.style.alignItems = "center"; ov.style.color = "#fff"; ov.innerHTML = `<div id="ovm" style="font-size:16px">Préparation…</div>`; document.body.append(ov);
  const stage = $("#sheetStage"); stage.style.left = "0"; stage.style.zIndex = "40";
  try{
    await document.fonts.ready;
    const pdf = new jspdf.jsPDF({unit:"pt", format:"a4"}); let first = true;
    const f = feuille(c.id) || {copies:{}}; const copies = {};
    for (let k = 0; k < list.length; k++){
      const e = list[k]; const {pages, layout, version} = sheetPages(c, e);
      for (let i = 0; i < pages.length; i++){
        $("#ovm").textContent = `Feuille ${k + 1} / ${list.length} · ${e.prenom} ${e.nom} · page ${i + 1}`;
        const cv = await html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:-window.scrollY, windowWidth:900});
        if (!first) pdf.addPage(); first = false;
        pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 595.28, 841.89);
      }
      const old = f.copies?.[e.id] || {};
      copies[e.id] = {version, pages:layout, scans:old.scans || {}, answers:old.answers || {}, validee:!!old.validee};
    }
    stage.innerHTML = "";
    const blob = pdf.output("blob");
    const name = `${c.titre} - ${classe(c.classeId)?.nom || ""}${list.length === 1 ? " - " + list[0].prenom + " " + list[0].nom : ""}.pdf`.replace(/[\\/:*?"<>|]/g, "-");
    const all = {...(f.copies || {}), ...copies};
    await write("feuilles/" + c.id, {copies:all, printedAt:new Date().toISOString()});
    if (c.statut === "brouillon"){ c.statut = "imprime"; await saveCtrl(c); }
    ov.remove();
    if (DL){ try { await DL.save({filename:name, data:blob}); st.textContent = "PDF prêt. Imprime-le, puis scanne les copies dans l'onglet Scanner."; }
      catch(e){ st.textContent = e?.code === "declined" ? "Téléchargement annulé." : "Téléchargement impossible dans cette vue."; } }
    else st.textContent = "Téléchargement indisponible dans cette vue : ouvre l'application dans claude.ai.";
  }catch(e){ console.error(e); st.textContent = "Échec de génération du PDF."; }
  finally{ ov.remove(); stage.style.left = "-12000px"; stage.innerHTML = ""; }
}

async function fileToCanvases(file){
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)){
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise; const out = [];
    for (let i = 1; i <= pdf.numPages; i++){ const pg = await pdf.getPage(i); const vp = pg.getViewport({scale: 2000 / Math.max(pg.view[2], pg.view[3])});
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise; out.push(cv); }
    return out;
  }
  let bmp; try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e){ bmp = await createImageBitmap(file); }
  const sc = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);

}

function vAnalyse(){
  const list = store.controles.filter(c => { const f = feuille(c.id); return f && Object.values(f.copies || {}).some(cp => copyDone(c, cp)); });
  if (!list.length) return `<div class="head"><h2>Classe & rattrapage</h2></div><div class="panel empty">Les résultats apparaîtront ici dès que des copies auront été corrigées.</div>`;
  const c = ctrl(S.anCtrl) || list[0]; S.anCtrl = c.id;
  const f = feuille(c.id), max = maxOf(c), studs = studentsOf(c);
  const rows = studs.map(e => ({e, cp:f.copies[e.id]})).filter(r => copyDone(c, r.cp));
  const notes = rows.map(r => final20(c, r.cp));
  const avg = notes.reduce((a, b) => a + b, 0) / notes.length;
  const qs = c.questions.map((q, k) => {
    const got = rows.map(r => noteOf(r.cp.answers[q.id]) / q.points);
    const tags = {}; rows.forEach(r => (r.cp.answers[q.id]?.erreurs || []).forEach(t => { const key = t.trim().toLowerCase(); if (key) tags[key] = (tags[key] || 0) + 1; }));
    return {q, k, rate: got.reduce((a, b) => a + b, 0) / got.length, fail: got.filter(x => x < .5).length, tags:Object.entries(tags).sort((a, b) => b[1] - a[1]).slice(0, 3)};
  });
  const ratts = store.controles.filter(x => x.type === "rattrapage" && x.parentId === c.id);
  const unval = rows.filter(r => !r.cp.validee).length;
  return `
  <div class="head"><div><h2>Classe & rattrapage</h2><p>${rows.length} copie(s) corrigée(s) sur ${studs.length}${unval ? ` · <span style="color:var(--warn)">${unval} pas encore validée(s)</span>` : ""}</p></div>
    <select id="anSel" style="max-width:440px" aria-label="Contrôle">${selOpts(list, c.id, x => (x.type === "rattrapage" ? "Rattrapage · " : x.type === "exercices" ? "Exercices · " : "") + x.titre + " · " + (classe(x.classeId)?.nom || ""), x => x.id)}</select></div>
  <div class="grid g3">
    <div class="panel"><div class="label">Moyenne</div><div class="total num" style="color:var(--ink)">${fmt(avg)}<small>/20</small></div></div>
    <div class="panel"><div class="label">Min – max</div><div class="total num" style="color:var(--ink)">${fmt(Math.min(...notes))} – ${fmt(Math.max(...notes))}</div></div>
    <div class="panel"><div class="label">Sous 10/20</div><div class="total num" style="color:var(--ink)">${notes.filter(n => n < 10).length}<small>/${notes.length}</small></div></div>
  </div>
  <section class="panel"><h3>Réussite et erreurs par question</h3>
    <div class="bars" style="margin-top:12px">${qs.map(x => `<div>
      <div class="bar"><b>Q${x.k + 1}</b><div class="track"><div class="fill" style="width:${Math.round(x.rate * 100)}%;background:var(--${tone(x.rate)})"></div></div><span class="num" style="text-align:right">${pct(x.rate)}</span></div>
      <div class="small muted" style="margin:2px 0 0 50px">${esc(x.q.notion || "")}${x.fail ? ` · ${x.fail} élève(s) sous la moitié des points` : ""}${x.tags.length ? " · " + x.tags.map(([t, n]) => `<span class="chip bad">${esc(t)} × ${n}</span>`).join(" ") : ""}</div></div>`).join("")}</div>
  </section>
  <section class="panel grid"><div class="row between"><h3>Synthèse pédagogique</h3><button class="btn sm" id="synth">${c.analyse ? "Actualiser" : "Rédiger"} (IA)</button></div>
    <div class="status" id="syn-st"></div>
    ${c.analyse ? `<div style="white-space:pre-wrap">${esc(c.analyse)}</div>` : `<p class="muted small">L'IA repère les notions non comprises et propose quoi reprendre en classe.</p>`}</section>
  <section class="panel"><div class="row between"><h3>Élèves</h3><span class="small muted">Rattrapage individuel possible pour chaque élève sous ${SEUIL}/20</span></div>

    ${studs.map(e => { const cp = f.copies[e.id]; const ok = copyDone(c, cp); const r = ratts.find(x => x.eleves?.includes(e.id));
      return `<tr><td><b>${esc(e.prenom)} ${esc(e.nom)}</b>${c.differencie ? ` <span class="lvl ${versionFor(c, e)}">${LVL[versionFor(c, e)][0]}</span>` : ""}</td>
      ${c.questions.map(q => { const n = noteOf(cp?.answers?.[q.id]); return `<td class="c"><span class="cell ${n == null ? "none" : tone(n / q.points)}">${fmt(n)}</span></td>`; }).join("")}
      <td class="c num"><b>${ok ? fmt(final20(c, cp)) : "—"}</b></td>
      <td>${r ? `<button class="btn sm" data-edit="${r.id}">${STATUT[r.statut]?.[0] || "Voir"}</button>` : ok && final20(c, cp) < SEUIL ? `<button class="btn sm" data-ratt="${e.id}">Créer</button>` : ok ? `<span class="small muted">—</span>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}
async function createRattrapage(c, e, replaceId){
  const f = feuille(c.id), cp = f?.copies?.[e.id]; if (!cp) throw {code:"no_copy"};
  if (!copyDone(c, cp) || final20(c, cp) >= SEUIL) throw {code:"not_failed"};
  if (!replaceId && store.controles.some(x => x.type === "rattrapage" && x.parentId === c.id && x.eleves?.includes(e.id))) throw {code:"ratt_exists"};
  const weak = c.questions.map(q => ({q, a:cp.answers[q.id]})).filter(x => x.a && noteOf(x.a) / x.q.points < 0.6);
  const target = weak.length ? weak : c.questions.map(q => ({q, a:cp.answers[q.id]})).sort((x, y) => noteOf(x.a) / x.q.points - noteOf(y.a) / y.q.points).slice(0, 1);
  const lvl = levelOf(e, c.matiere);
  const ctx = target.map(({q, a}) => { const v = vOf(q, cp.version?.[q.id] || "standard");
    return `- Notion : ${q.notion || "?"}\n  Question : ${v.enonce}\n  Corrigé-type : ${v.corrige}\n  Réponse de l'élève (${fmt(noteOf(a))}/${q.points}) : ${a?.transcription || "(vide)"}\n  Erreurs relevées : ${(a?.erreurs || []).join(", ") || "?"}\n  Commentaire : ${a?.commentaire || ""}`; }).join("\n");
  const r = await ai(`Tu prépares une feuille de rattrapage individuelle pour un élève de ${c.niveau || ""} en ${c.matiere} (collège-lycée Beth Mena'hem).
Niveau habituel de l'élève dans cette matière : ${LVL[lvl]}.
Ses difficultés au contrôle « ${c.titre} » :
${ctx}

Crée exactement 3 exercices NOUVEAUX, de difficulté croissante, qui ciblent précisément ces erreurs :
1 = découverte (plus simple que le niveau de l'élève), 2 = application, 3 = retour au niveau ${LVL[lvl].toLowerCase()} du contrôle.
Total 20 points (par ex. 5, 7, 8). Chaque exercice : un énoncé autonome (avec un coup de pouce entre parenthèses pour le 1), un corrigé-type, des critères de notation, 2 ou 3 erreurs types, un nombre de lignes de réponse (3 à 12).
${NOSRC}
${replaceId ? "IMPORTANT : propose des exercices DIFFÉRENTS de ceux-ci : " + (ctrl(replaceId)?.questions || []).map(q => vOf(q, "standard").enonce).join(" / ") + "\n" : ""}Réponds uniquement en JSON : {"titre":"…","questions":[{"notion":"…","points":5,"lignes":5,"enonce":"…","corrige":"…","criteres":"…","erreurs":["…"]}]}`);
  const qs = (r?.questions || []).slice(0, 3).map(x => ({id:"q" + uid(5), notion:String(x.notion || ""), points:+x.points || 5, lignes:clamp(+x.lignes || 6, 2, 20), erreurs:(x.erreurs || []).map(String),
    v:{standard:{enonce:String(x.enonce || ""), corrige:String(x.corrige || ""), criteres:String(x.criteres || "")}}}));
  if (!qs.length) throw {code:"invalid_json"};
  const old = replaceId && ctrl(replaceId), printed = old && feuille(replaceId) && Object.keys(feuille(replaceId).copies || {}).length;
  if (old && !printed){ const o = structuredClone(old); o.questions = qs; o.titre = "Rattrapage · " + (r.titre || c.titre); await saveCtrl(o); return replaceId; }

    duree:30, differencie:false, mise:{...(c.mise || {}), consignes:"Feuille de rattrapage personnelle. Prends ton temps et relis le coup de pouce."}, statut:"brouillon", date:today(), questions:qs, createdAt:new Date().toISOString()};
  await write("controles/" + id, doc);

/* ================= Classes: level suggestions ================= */
function suggestLevels(cl, mat){
  const cs = store.controles.filter(c => c.classeId === cl.id && c.matiere === mat && isCtrl(c)).sort((a, b) => (b.date || b.createdAt || "").localeCompare(a.date || a.createdAt || ""));
  const map = {};
  cl.eleves.forEach(e => {
    const ns = []; for (const c of cs){ const cp = feuille(c.id)?.copies?.[e.id]; if (cp?.validee && copyDone(c, cp)) ns.push(final20(c, cp)); if (ns.length === 3) break; }
    if (ns.length){ const avg = ns.reduce((a, b) => a + b, 0) / ns.length; map[e.id] = {avg, lvl: avg < 10 ? "socle" : avg <= 15 ? "standard" : "approfondi"}; }
  });
  return map;
}

/* ================= Course import ================= */
async function importCourseFiles(files){
  const st = $("#c-st"); const parts = [];
  const pendingImgs = [];
  for (const f of files){
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
      st.innerHTML = `<span class="thinking">Lecture du PDF « ${esc(f.name)} »…</span>`;
      const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise; let txt = "";
      for (let i = 1; i <= pdf.numPages; i++){ const tc = await (await pdf.getPage(i)).getTextContent(); txt += tc.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("") + "\n\n"; }
      if (txt.replace(/\s/g, "").length > 150 * pdf.numPages) parts.push(txt.trim());
      else { for (let i = 1; i <= Math.min(pdf.numPages, 12); i++){ const pg = await pdf.getPage(i); const vp = pg.getViewport({scale: 1800 / Math.max(pg.view[2], pg.view[3])}); const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise; pendingImgs.push(cv); } }
    } else { (await fileToCanvases(f)).forEach(cv => pendingImgs.push(cv)); }
  }
  if (pendingImgs.length){
    if (!AI || !LIM?.images){ st.textContent = "Ce document est une image : il faut l'IA avec images pour le lire. Colle le texte à la place."; }
    else {
      const per = Math.max(1, LIM.images.maxCount || 1);
      for (let i = 0; i < pendingImgs.length; i += per){
        st.innerHTML = `<span class="thinking">Lecture des pages ${i + 1} à ${Math.min(i + per, pendingImgs.length)} sur ${pendingImgs.length}…</span>`;
        const blobs = await Promise.all(pendingImgs.slice(i, i + per).map(cv => toBlob(scaled(cv, 1800))));
        const t = await aiText(`Transcris fidèlement le texte de ces pages de cours (dans l'ordre), en gardant titres, définitions, exemples et formules. Recopie l'hébreu en caractères hébreux, sans traduire. Pas de commentaire : uniquement le texte.`, {images:blobs});
        parts.push(t.trim());
      }
    }
  }
  const box = $("#c-texte"); const prev = box.value.trim();
  box.value = [prev, ...parts].filter(Boolean).join("\n\n").slice(0, 60000);
  S.coursDraft = {...(S.coursDraft || {}), texte:box.value};
  if (parts.length) st.textContent = "Texte extrait : relis-le, corrige si besoin, puis enregistre.";
}

/* ================= Generation ================= */
function genPrompt(co, p, n, extra){
  const T = {cours:"questions de cours", application:"exercices d'application", probleme:"problème ou rédaction", texte:"lecture / explication de texte", traduction:"traduction", qcm:"QCM"};
  return `Tu es un professeur expérimenté de ${p.matiere} au collège-lycée Beth Mena'hem (Levallois-Perret). Prépare ${n === 1 ? "UNE question" : "un contrôle"} pour une classe de ${p.niveau}, à partir du cours ci-dessous.

Durée : ${p.duree} minutes · Difficulté : ${p.difficulte} · Types : ${(p.types || []).map(t => T[t]).join(", ") || "variés"}
${n > 1 ? `Nombre de questions : ${n}. Total des points : 20 exactement.` : ""}
${p.consignes ? "Consignes du professeur : " + p.consignes : ""}
${extra || ""}
Pour chaque question, rédige 3 versions de la même question, portant sur la même notion et notées sur les mêmes points :
- "socle" : plus guidée (étapes, données simplifiées, coup de pouce), pour un élève en difficulté ;
- "standard" : niveau attendu de la classe ;
- "approfondi" : plus exigeante (justification, cas général, extension).
Chaque version a son énoncé, son corrigé-type détaillé et des critères de notation dont la somme fait les points de la question.
${(p.types || []).includes("qcm") ? `Tu peux inclure des QCM (corrigés automatiquement, sans IA) : pour eux "type":"qcm", et dans chaque version "choix" (3 à 5 propositions courtes, sans lettre) et "bonnes" (indices des bonnes réponses, à partir de 0) ; "lignes" inutile.\n` : ""}Ajoute pour chaque question : la notion évaluée, 2 à 4 erreurs types fréquentes (étiquettes de 2 à 5 mots), et le nombre de lignes de réponse nécessaires (3 à 14).
${NOSRC}

COURS :
"""${(co?.texte || "").slice(0, 30000)}"""

Réponds uniquement en JSON : {"titre":"…","questions":[{"notion":"…","points":4,"lignes":6,"erreurs":["…"],"versions":{"socle":{"enonce":"…","corrige":"…","criteres":"…"},"standard":{…},"approfondi":{…}}}]}`;
}
const mapQ = x => ({id:"q" + uid(5), ...(x.type === "qcm" ? {type:"qcm"} : {}), notion:String(x.notion || ""), points:+x.points || 4, lignes:clamp(+x.lignes || 6, 1, 30), erreurs:(x.erreurs || []).map(String).slice(0, 5),
  v:Object.fromEntries(LEVELS.map(l => { const y = x.versions?.[l] || {}; const o = {enonce:String(y.enonce || ""), corrige:String(y.corrige || ""), criteres:String(y.criteres || "")};
    if (x.type === "qcm"){ o.choix = (y.choix || []).map(String).slice(0, 6); o.bonnes = (y.bonnes || []).map(Number).filter(n => n >= 0 && n < o.choix.length); o.corrige = "Bonne(s) réponse(s) : " + o.bonnes.map(n => "ABCDEF"[n]).join(", "); o.criteres = "Tout ou rien."; }
    return [l, o]; }))});

const SEUIL = 10;
const isCtrl = c => !c.type || c.type === "controle";
const EXO_TXT = "IMPORTANT : il s'agit d'une FEUILLE D'EXERCICES D'ENTRAÎNEMENT (pas d'un contrôle) : exercices progressifs, du plus simple au plus complet, pour pratiquer les notions du cours. Le mot « contrôle » ne doit pas apparaître.";
async function regenExercices(c){
  const co = store.cours.find(x => x.id === c.coursId);
  if (!co) throw {code:"no_cours"};
  const g = c.gen || {}, p = {matiere:c.matiere, niveau:c.niveau, duree:c.duree || 55, difficulte:g.difficulte || "moyen", types:g.types || [], consignes:g.consignes || ""};
  const deja = (c.questions || []).map(q => vOf(q, "standard").enonce).join(" / ").slice(0, 3000);
  const r = await ai(genPrompt(co, p, clamp((c.questions || []).length || 5, 1, 10), EXO_TXT + "\nPropose des exercices NOUVEAUX et DIFFÉRENTS de ceux-ci : " + deja), {feature:"exercices"});
  const qs = (r?.questions || []).map(mapQ); if (!qs.length) throw {code:"invalid_json"};
  const f = feuille(c.id), printed = f && Object.keys(f.copies || {}).length;
  if (!printed){ const o = structuredClone(c); o.questions = qs; await saveCtrl(o); return c.id; }
  const n = store.controles.filter(x => x.type === "exercices" && (x.srcId || x.id) === (c.srcId || c.id)).length + 1;
  const id = uid(12), doc = structuredClone(c); delete doc.id; delete doc.owner;
  Object.assign(doc, {srcId:c.srcId || c.id, titre:"Exercices " + n + " · " + (r.titre || co.titre), statut:"brouillon", date:"", questions:qs, createdAt:new Date().toISOString()});
  await write("controles/" + id, doc); return id;

async function loadDemo(){
  const noms = [["Mendel","Azoulay"],["Yossef","Benhamou"],["Levi","Cohen"],["David","Dahan"],["Nathan","Elbaz"],["Eliezer","Fitoussi"],["Samuel","Gozlan"],["Raphaël","Haddad"]];
  const lv = ["standard","standard","approfondi","socle","approfondi","socle","standard","standard"];
  const cid = uid(10);
  await write("classes/" + cid, {nom:"3e A (démo)", niveau:"3e", eleves:noms.map(([p, n], i) => ({id:uid(8), prenom:p, nom:n + " (démo)", niveaux:{"Mathématiques":lv[i]}})), createdAt:new Date().toISOString()});
  await write("cours/" + uid(10), {titre:"Fonctions affines (démo)", matiere:"Mathématiques", niveau:"3e", createdAt:new Date().toISOString(), texte:
`Chapitre : Fonctions affines

1. Définition
Une fonction affine est une fonction f définie par f(x) = ax + b, où a et b sont deux nombres fixés.
a est le coefficient directeur, b est l'ordonnée à l'origine.
Si b = 0, f(x) = ax : f est une fonction linéaire. Si a = 0, f(x) = b : f est une fonction constante.

2. Image et antécédent
L'image de x par f est le nombre f(x). Exemple : f(x) = 2x − 3 ; l'image de 4 est f(4) = 2×4 − 3 = 5.
Un antécédent de y par f est un nombre x tel que f(x) = y. Pour le trouver, on résout l'équation ax + b = y.
Exemple : antécédent de 7 par f : 2x − 3 = 7, donc 2x = 10, x = 5.

3. Représentation graphique
La représentation graphique d'une fonction affine est une droite. Elle passe par le point (0 ; b).
Quand x augmente de 1, f(x) augmente de a. Si a > 0, la fonction est croissante ; si a < 0, décroissante.

4. Déterminer une fonction affine à partir de deux points
Si f(x1) = y1 et f(x2) = y2, alors a = (y2 − y1) / (x2 − x1), puis on calcule b avec b = y1 − a×x1.

5. Problèmes
Comparer deux tarifs : tarif A = 20 € par mois ; tarif B = 8 € + 0,50 € par heure. On modélise B par f(h) = 0,5h + 8.
B est plus cher que A quand 0,5h + 8 > 20, c'est-à-dire h > 24.`});
  toast("Classe et cours de démonstration créés.");
}

  if (el.id === "p-diff"){ S.params.differencie = el.checked; return; }

  if (el.id === "sc-files"){ const fs = Array.from(el.files); el.value = ""; if (fs.length) addScans(fs); return; }
  if (d.mq){ const it = S.queue.find(x => x.id === d.mq); it[d.f] = d.f === "page" ? +el.value : el.value; if (d.f === "ctrlId") it.eleveId = ""; return render(); }
  if (el.id === "lvlMat"){ S.levelMat = el.value; S.suggestions = null; return render(); }
  if (d.lvl){ const cl = classe(S.classeSel); await write("classes/" + cl.id, {eleves:cl.eleves.map(e => e.id === d.lvl ? {...e, niveaux:{...(e.niveaux || {}), [S.levelMat]:el.value}} : e)}, "update"); return; }
  if (el.id === "corrSel"){ S.corrCtrl = el.value; S.corrEleve = null; return render(); }
  if (el.id === "anSel"){ S.anCtrl = el.value; return render(); }
  if (d.bonus){ const C = ctrl(S.corrCtrl), mx = +C.bonus?.[d.bonus] || 0; const v = el.value === "" ? null : clamp(half(+el.value), 0, mx);
    await write("feuilles/" + C.id, {copies:{[S.corrEleve]:{validee:false, bonusProf:{[d.bonus]:v}}}}, "update"); return; }
  if (d.score){ const C = ctrl(S.corrCtrl), q = C.questions.find(x => x.id === d.score); const v = el.value === "" ? null : clamp(half(+el.value), 0, +q.points);
    await write("feuilles/" + C.id, {copies:{[S.corrEleve]:{validee:false, answers:{[d.score]:{note:v, valide:false}}}}}, "update"); return; }
  /* editor fields */
  const c = S.view === "edit" ? ctrl(S.editId) : null; if (!c) return;
  if (el.id === "prevEl"){ S.previewEleve = el.value; return drawPreview(); }
  if (d.c){ c[d.c] = el.type === "number" ? +el.value : el.value; }
  else if (el.id === "e-diff"){ c.differencie = el.checked; }
  else if (d.m){ c.mise = {...(c.mise || {}), [d.m]: ["police","lh"].includes(d.m) ? +el.value : el.value}; }
  else if (d.bo){ c.bonus = {...(c.bonus || {}), [d.bo]:+el.value}; }
  else if (el.id === "m-bar"){ c.mise = {...(c.mise || {}), bareme:el.checked}; }
  else if (d.q !== undefined){ const q = c.questions[+d.q]; if (!q) return;
    if (d.vk === "choixRaw"){ const lines = el.value.split("\n").map(x => x.trim()).filter(Boolean); q.v = q.v || {};
      const o = {...(q.v[d.lv] || {enonce:""}), choix:lines.map(x => x.replace(/^\*\s*/, "")), bonnes:lines.map((x, j) => x.startsWith("*") ? j : -1).filter(j => j >= 0)};
      o.corrige = "Bonne(s) réponse(s) : " + o.bonnes.map(n => "ABCDEF"[n]).join(", "); o.criteres = "Tout ou rien."; q.v[d.lv] = o; }
    else if (d.vk){ q.v = q.v || {}; q.v[d.lv] = {...(q.v[d.lv] || {enonce:"", corrige:"", criteres:""}), [d.vk]:el.value}; }
    else if (d.k === "erreurs") q.erreurs = el.value.split(";").map(s => s.trim()).filter(Boolean);
    else if (d.k === "type"){ if (el.value) q.type = "qcm"; else delete q.type; }
    else q[d.k] = ["points","lignes"].includes(d.k) ? +el.value : el.value; }
  else return;
  await saveCtrl(c);
});

   Outside claude.ai there is no window.claude: data lives in this browser (IndexedDB),
   the AI is called directly with the school's Anthropic API key, files download normally. */
let STANDALONE = false;
const BLOBURL = {};
const blobSrc = id => (typeof SERVERSTORE !== "undefined" && SERVERSTORE) ? "/api/files/" + id : STANDALONE ? (BLOBURL[id] || (SB ? (wantUrl(id), "") : "")) : "/_blob/" + id;
async function getBlob(id){ if (SERVERSTORE){ const r = await fetch("/api/files/" + id, {credentials:"same-origin"}); if (!r.ok) throw {code:"no_blob"}; return r.blob(); } if (STANDALONE && SB) return cloudBlob(id); if (STANDALONE){ const b = await idbGet("blobs", id); if (!b) throw {code:"no_blob"}; return b; } return (await fetch("/_blob/" + id)).blob(); }

function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open("tikoun", 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
let IDB = null;
const idbReq = (store, mode, fn) => new Promise((res, rej) => { const tx = IDB.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); });
const idbGet = (s, k) => idbReq(s, "readonly", o => o.get(k));
const idbPut = (s, k, v) => idbReq(s, "readwrite", o => o.put(v, k));
const idbDel = (s, k) => idbReq(s, "readwrite", o => o.delete(k));
const idbAll = s => new Promise((res, rej) => { const out = {}; const tx = IDB.transaction(s, "readonly"); const c = tx.objectStore(s).openCursor();
  c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } }; tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); });

async function localDB(){
  IDB = await idbOpen();
  const init = await idbAll("docs");
  const db = memDB(init, (path, val) => val == null ? idbDel("docs", path) : idbPut("docs", path, val));
  return db;
}

function parseJSONloose(t){
  try { return JSON.parse(t); } catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch(e){} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  throw {code:"invalid_json", text:t};
}
function apiSample(){
  async function call(input, opts = {}, asJson){
    const cc = cloudCfg(); if (!cc.endpoint) throw {code:"no_ai"};
    const imgs = opts.images ? (opts.images instanceof Blob ? [opts.images] : Array.from(opts.images)) : [];
    const content = [];
    for (const im of imgs) content.push({type:"image", source:{type:"base64", media_type:im.type && im.type.startsWith("image/") ? im.type : "image/jpeg", data:await b64(im)}});
    content.push({type:"text", text:String(input) + (asJson ? "\n\n(Réponds uniquement avec le JSON demandé, sans texte autour.)" : "")});
    const headers = {"content-type":"application/json", "x-tikoun-code":accessCode()};
    if (SB && SB_USER){ const {data} = await SB.auth.getSession(); headers.authorization = "Bearer " + data.session.access_token; }
    let r;
    try { r = await fetch(cc.endpoint, {method:"POST", signal:opts.signal, headers, body:JSON.stringify({tier:opts.modelTier || "default", feature:opts.feature || "", messages:[{role:"user", content}]})}); }
    catch(e){ throw {code:e?.name === "AbortError" ? "cancelled" : "upstream_error"}; }
    if (!r.ok){
      if (r.status === 401 && window.TIKOUN_CONFIG?.accounts){ S.auth = "login"; scheduleRender(); }
      else if (r.status === 401 && !SB){ NEED_CODE = true; try { localStorage.removeItem("tikoun.code"); } catch(e){} scheduleRender(); }
      const code = r.status === 403 ? "no_option" : r.status === 401 ? "need_code" : r.status === 429 ? "rate_limited" : r.status === 400 || r.status === 413 ? "api_400" : r.status === 503 ? "no_ai" : "upstream_error";
      let msg = ""; try { msg = (await r.json())?.error?.message || ""; } catch(e){} throw {code, message:msg}; }
    const j = await r.json(); const text = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    if (!text.trim()) throw {code:"empty_completion"};
    return asJson ? parseJSONloose(text) : text;
  }
  const f = (input, opts) => call(input, opts, false).then(text => ({text, truncated:false, modelTierApplied:opts?.modelTier || "default"}));
  f.json = (input, opts) => call(input, opts, true);
  f.limits = async () => ({maxPromptBytes:400000, images:{maxCount:20, maxInputBytes:5e6, mediaTypes:["image/jpeg","image/png","image/webp"]}});
  return f;
}

/* ================= Online storage (Supabase: Postgres + Storage + Auth, EU region) =================
   Used by the standalone site when a Supabase project is configured (config.js or Réglages).
   Every teacher logs in; all devices share the same classes, contrôles, copies and photos. */
let SB = null, SB_USER = null;
function cloudCfg(){ const c = cfg(), w = window.TIKOUN_CONFIG || {};

async function cloudDB(){
  const init = {};
  for (let from = 0; ; from += 1000){
    const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999);
    if (error) throw error; data.forEach(r => init[r.path] = r.data); if (data.length < 1000) break;
  }
  const db = memDB(init, async (p, val, op, patch) => {
    let r;
    if (op === "delete") r = await SB.from("docs").delete().eq("path", p);
    else if (op === "update") r = await SB.rpc("tk_update", {p_path:p, p_patch:patch});
    else r = await SB.from("docs").upsert({path:p, col:p.split("/").slice(0, -1).join("/"), data:val});
    if (r.error){ console.error(r.error); throw {code:"cloud_write", message:r.error.message}; }
  });
  SB.channel("tikoun-docs").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, pl => {
    if (pl.eventType === "DELETE") db._remote(pl.old.path, null); else db._remote(pl.new.path, pl.new.data);
  }).subscribe();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState !== "visible") return;
    for (let from = 0; ; from += 1000){ const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999); if (error) return; data.forEach(r => db._remote(r.path, r.data)); if (data.length < 1000) break; } });
  return db;
}

let SERVERSTORE = false, SRV_PERSIST = true;
async function serverDB(){
  const r = await fetch("/api/db", {credentials:"same-origin"});
  if (r.status === 401){ NEED_CODE = true; throw {code:"need_code"}; }
  if (!r.ok) throw {code:"cloud_write", message:"serveur " + r.status};
  const j = await r.json(); let epoch = j.epoch, seq = j.seq; SRV_PERSIST = j.persistent !== false;
  const db = memDB(j.docs || {}, async (p, val, op, patch) => {
    const u = "/api/db/doc?path=" + encodeURIComponent(p);
    const res = op === "delete" ? await fetch(u, {method:"DELETE", credentials:"same-origin"})
      : await fetch(u, {method:op === "update" ? "PATCH" : "PUT", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify(op === "update" ? patch : val)});
    if (!res.ok) throw {code:res.status === 401 ? "need_code" : "cloud_write", message:"serveur " + res.status};
  });
  let busy = false;
  const pull = async () => {
    if (busy || document.visibilityState === "hidden") return; busy = true;
    try {
      const r2 = await fetch(`/api/db/changes?since=${seq}&epoch=${encodeURIComponent(epoch)}`, {credentials:"same-origin"}); if (!r2.ok) return;
      const k = await r2.json(); epoch = k.epoch; seq = k.seq;
      if (k.reset){ const cur = db._all(); for (const p of Object.keys(cur)) if (!(p in k.docs)) db._remote(p, null); for (const [p, v] of Object.entries(k.docs)) if (JSON.stringify(cur[p]) !== JSON.stringify(v)) db._remote(p, v); }
      else for (const c of k.changes || []){ if (JSON.stringify(db._all()[c.path]) !== JSON.stringify(c.data)) db._remote(c.path, c.data); }
    } catch(e){} finally { busy = false; }
  };
  setInterval(pull, 8000); document.addEventListener("visibilitychange", pull);
  return db;
}
const serverAssets = { upload: async (blob, want) => {
  const r = await fetch("/api/files" + (want ? "?id=" + want : ""), {method:"POST", credentials:"same-origin", headers:{"content-type":blob.type || "image/jpeg"}, body:blob});
  if (!r.ok) throw {code:"cloud_write"}; const {id} = await r.json(); return {id, url:"/api/files/" + id}; } };
function subscribeStore(){
  DB.collection("classes").onSnapshot(s => { store.classes = s.docs.map(x => ({id:x.id, ...structuredClone(x.data())})); scheduleRender(); });
  DB.collection("controles").onSnapshot(s => { store.allCtrl = s.docs.map(x => ({id:x.id, ...structuredClone(x.data())})); applyScope(); scheduleRender(); });
  DB.collection("cours").onSnapshot(s => { store.allCours = s.docs.map(x => ({id:x.id, ...structuredClone(x.data())})); applyScope(); scheduleRender(); });
  for (const col of ["ecritures","bilans"]) DB.collection(col).onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store[col] = m; scheduleRender(); });
  DB.collection("feuilles").onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store.feuilles = m; scheduleRender(); });
}
async function startServer(){

/* ================= Navigation : de vraies pages, avec adresse, Précédent / Suivant ================= */
const STEPS = [["preparer","Préparer"],["mise-en-page","Mise en page"],["imprimer","Imprimer"],["scanner","Scanner"],["corriger","Corriger"],["classe","Classe & rattrapage"]];
const stepIdx = s => STEPS.findIndex(x => x[0] === s);
function defaultStep(c){ return {brouillon:"preparer", imprime:"scanner", correction:"corriger", corrige:"classe"}[c?.statut] || "preparer"; }
function routeOf(){
  switch (S.view){
    case "home": return "accueil";
    case "new": return "nouveau";
    case "edit": return `controle/${S.editId}/${S.step || "preparer"}`;
    case "scan": return S.scanCtrl ? `controle/${S.scanCtrl}/scanner` : "scanner";
    case "correct": return S.corrCtrl && S.inCtrl ? `controle/${S.corrCtrl}/corriger` : "correction";
    case "analyse": return S.anCtrl && S.inCtrl ? `controle/${S.anCtrl}/classe` : "resultats";
    case "reglages": return "sauvegarde";
    default: return S.view;
  }
}
function applyRoute(){
  const [a, b, c] = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  S.inCtrl = null; S.scanCtrl = null;
  if (a === "controle" && b){
    const step = STEPS.some(x => x[0] === c) ? c : "preparer"; S.inCtrl = b; S.step = step;
    if (stepIdx(step) <= 2){ S.view = "edit"; S.editId = b; }
    else if (step === "scanner"){ S.view = "scan"; S.scanCtrl = b; }
    else if (step === "corriger"){ S.view = "correct"; if (S.corrCtrl !== b){ S.corrCtrl = b; S.corrEleve = null; S.editTr = {}; S.editCom = {}; } }
    else { S.view = "analyse"; S.anCtrl = b; }
  }
  else S.view = {accueil:"home", nouveau:"new", scanner:"scan", sauvegarde:"reglages", correction:"correct", resultats:"analyse"}[a] || (["controles","classes","suivi","banque","direction","compte","comptes"].includes(a) ? a : "home");
}
function go(v){
  S.view = v;
  if (v === "edit"){ S.inCtrl = S.editId; if (stepIdx(S.step) < 0 || stepIdx(S.step) > 2) S.step = "preparer"; }
  else if (v === "correct" && S.corrCtrl){ S.inCtrl = S.corrCtrl; S.step = "corriger"; }
  else if (v === "analyse" && S.anCtrl){ S.inCtrl = S.anCtrl; S.step = "classe"; }
  else if (v !== "scan") S.inCtrl = null;
  const h = "#/" + routeOf();
  if (location.hash !== h) location.hash = h; else { render(); window.scrollTo({top:0}); }
}
function openCtrl(id, step){ const c = ctrl(id); location.hash = `#/controle/${id}/${step || defaultStep(c)}`; }
window.addEventListener("hashchange", () => { applyRoute(); render(); window.scrollTo({top:0}); });

/* Cadre commun d'un contrôle : en-tête, étapes, Précédent / Suivant */
function ctrlProgress(c){
  const f = feuille(c.id), studs = studentsOf(c), n = studs.length;
  const sc = studs.filter(e => Object.keys(f?.copies?.[e.id]?.answers || {}).length).length, va = studs.filter(e => f?.copies?.[e.id]?.validee).length;
  return {n, sc, va, printed:!!f && Object.keys(f.copies || {}).length > 0};
}
function ctrlFrame(c, inner){
  const i = stepIdx(S.step), pr = ctrlProgress(c), cl = classe(c.classeId);
  const doneUpTo = {brouillon:-1, imprime:2, correction:3, corrige:4}[c.statut] ?? -1;
  const prev = STEPS[i - 1], next = STEPS[i + 1];
  return `<div class="crumbs small"><a href="#/controles">← Tous les contrôles</a></div>
  <div class="head"><div><div class="label">${c.type === "rattrapage" ? "Rattrapage" : c.type === "exercices" ? "Exercices" : "Contrôle"} · ${esc(c.matiere)} · ${esc(cl?.nom || "?")}${c.date ? " · " + esc(frDate(c.date)) : ""}</div><h2>${esc(c.titre)}</h2></div>

  <nav class="stepper" aria-label="Étapes">${STEPS.map(([k, l], j) => `<a href="#/controle/${c.id}/${k}" class="st ${j === i ? "on" : j <= doneUpTo ? "done" : ""}" ${j === i ? 'aria-current="step"' : ""}><b>${j + 1}</b><span>${l}</span></a>`).join("")}</nav>
  ${i <= 2 && c.statut === "brouillon" ? `<p class="small muted">Brouillon · chaque modification est enregistrée automatiquement.</p>` : ""}
  ${inner}
  <div class="stepnav">${prev ? `<a class="btn" href="#/controle/${c.id}/${prev[0]}">← ${prev[1]}</a>` : "<span></span>"}${next ? `<a class="btn primary" href="#/controle/${c.id}/${next[0]}">${next[1]} →</a>` : `<a class="btn" href="#/controles">Terminer</a>`}</div>`;
}

/* ================= Shared: document pages → PDF ================= */
function docPages(headHTML, blocks, footTxt){
  const stage = $("#sheetStage"); const pages = [];
  const np = () => { const p = document.createElement("div"); p.className = "sheet doc"; p.innerHTML = pages.length ? "" : headHTML;
    const f = document.createElement("div"); f.className = "sh-foot"; f.innerHTML = `<span>${esc(footTxt)}</span><span class="pn"></span>`; p.append(f); stage.append(p); pages.push(p); return p; };
  let page = np();
  for (const html of blocks){
    const b = document.createElement("div"); b.className = "sh-q"; b.innerHTML = html; page.insertBefore(b, page.querySelector(".sh-foot"));
    if (b.offsetTop + b.offsetHeight > 1123 - 70 && page.querySelectorAll(".sh-q").length > 1){ b.remove(); page = np(); page.insertBefore(b, page.querySelector(".sh-foot")); }
  }
  pages.forEach((p, i) => { p.querySelector(".pn").textContent = `page ${i + 1} / ${pages.length}`; });
  return pages;
}
async function buildPdf(builders, filename, st){
  if (!window.html2canvas || !window.jspdf){ st.textContent = "Bibliothèques PDF non chargées : recharge la page."; return false; }
  const ov = document.createElement("div"); ov.className = "zoom"; ov.style.alignItems = "center"; ov.innerHTML = `<div id="ovm" style="font-size:16px;color:#fff">Préparation…</div>`; document.body.append(ov);
  const stage = $("#sheetStage"); stage.style.left = "0"; stage.style.zIndex = "40";
  try{
    await document.fonts.ready;
    const pdf = new jspdf.jsPDF({unit:"pt", format:"a4"}); let first = true;
    for (let k = 0; k < builders.length; k++){
      stage.innerHTML = ""; const {pages, label} = builders[k]();
      await Promise.all($$("img", stage).map(im => im.decode ? im.decode().catch(() => {}) : null));
      for (let i = 0; i < pages.length; i++){
        $("#ovm").textContent = `${label} · ${k + 1} / ${builders.length}`;
        const cv = await html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:-window.scrollY, windowWidth:900, useCORS:true});
        if (!first) pdf.addPage(); first = false; pdf.addImage(cv.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 595.28, 841.89);
      }
    }
    const blob = pdf.output("blob"); ov.remove();
    if (!DL){ st.textContent = "Téléchargement indisponible dans cette vue : ouvre l'application dans claude.ai."; return false; }
    try { await DL.save({filename:filename.replace(/[\\/:*?"<>|]/g, "-"), data:blob}); st.textContent = "PDF prêt."; return true; }
    catch(e){ st.textContent = e?.code === "declined" ? "Téléchargement annulé." : "Téléchargement impossible dans cette vue."; return false; }
  }catch(e){ console.error(e); st.textContent = "Échec de génération du PDF."; return false; }
  finally{ ov.remove(); stage.style.left = "-12000px"; stage.innerHTML = ""; }
}

/* ================= 1. Copie rendue à l'élève ================= */
function renduPages(c, e){
  const cp = feuille(c.id)?.copies?.[e.id], max = maxOf(c), cl = classe(c.classeId), b = bonusOf(c, cp);
  const rows = studentsOf(c).map(x => feuille(c.id)?.copies?.[x.id]).filter(k => copyDone(c, k));
  const moy = rows.length ? rows.reduce((a, k) => a + final20(c, k), 0) / rows.length : null;
  const ratt = store.controles.find(x => x.type === "rattrapage" && x.parentId === c.id && x.eleves?.includes(e.id));
  const head = `<div class="sh-head"><div><div class="sh-school">${esc(c.mise?.entete ?? ECOLE)}</div>
    <div class="sh-title" dir="auto">Copie corrigée · ${esc(c.titre)}</div>
    <div class="sh-meta">${esc(c.matiere)} · ${esc(cl?.nom || "")}${c.date ? " · " + esc(frDate(c.date)) : ""}</div>
    <div class="sh-name">Élève : <b>${esc(e.prenom)} ${esc(e.nom)}</b></div></div></div>
    <div class="rd-note"><span class="rd-big">${fmt(final20(c, cp))}</span><span> / 20</span>
      <span class="rd-sub">${[bonusMax(c) ? `note brute ${fmt(on20(copyTotal(c, cp), max))} · bonus propreté ${fmt(b.proprete)} · bonus orthographe ${fmt(b.orthographe)}` : "", moy != null ? `moyenne de la classe ${fmt(moy)}` : ""].filter(Boolean).join(" · ")}</span></div>`;
  const blocks = c.questions.map((q, k) => { const a = cp?.answers?.[q.id], v = vOf(q, cp?.version?.[q.id] || "standard");
    return `<div class="sh-qh"><span>Question ${k + 1}${q.notion ? " · " + esc(q.notion) : ""}</span><span class="rd-q">${fmt(noteOf(a))} / ${fmt(+q.points)}</span></div>
      <div class="sh-qt" dir="auto">${esc(v.enonce)}</div>
      ${a?.crop ? `<img class="rd-crop" alt="" src="${esc(blobSrc(a.crop))}">` : ""}
      ${a?.commentaire ? `<div class="rd-com" dir="auto">${esc(a.commentaire)}</div>` : ""}
      ${(a?.acquis || []).length ? `<div class="rd-tag">Acquis : ${esc(a.acquis.join(", "))}</div>` : ""}
      ${(a?.erreurs || []).length ? `<div class="rd-tag">À retravailler : ${esc(a.erreurs.join(", "))}</div>` : ""}`; });
  if (ratt) blocks.push(`<div class="sh-cons">Une feuille de rattrapage personnelle t'a été préparée : « ${esc(ratt.titre)} ». Fais-la sérieusement, elle cible exactement tes erreurs.</div>`);
  return docPages(head, blocks, `Tikoun · copie corrigée · ${e.prenom} ${e.nom}`);
}

/* ================= 2. Suivi par notion ================= */
const nkey = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-");
function notionStats(cl, mat){
  const cs = store.controles.filter(c => c.classeId === cl.id && c.matiere === mat);
  const labels = {}, per = {}, count = {};
  for (const c of cs){ const f = feuille(c.id); if (!f) continue;
    for (const e of cl.eleves || []){ const cp = f.copies?.[e.id]; if (!cp?.validee) continue;
      for (const q of c.questions || []){ const n = noteOf(cp.answers?.[q.id]); if (n == null || !+q.points) continue;
        const k = nkey(q.notion) || "(sans notion)"; labels[k] = labels[k] || q.notion || "(sans notion)"; count[k] = (count[k] || 0) + 1;
        const o = ((per[e.id] = per[e.id] || {})[k] = per[e.id]?.[k] || {s:0, n:0}); o.s += n / q.points; o.n++; } } }
  return {cs, labels, per, notions:Object.keys(count).sort((a, b) => count[b] - count[a])};
}
function studentCtrls(cl, mat, e){
  return store.controles.filter(c => c.classeId === cl.id && c.matiere === mat).map(c => ({c, cp:feuille(c.id)?.copies?.[e.id]})).filter(x => copyDone(x.c, x.cp))
    .sort((a, b) => (a.c.date || a.c.createdAt || "").localeCompare(b.c.date || b.c.createdAt || ""));
}
function vSuivi(){
  if (!store.classes.length) return `<div class="head"><h2>Suivi des élèves</h2></div><div class="panel empty">Crée d'abord une classe.</div>`;
  const cl = classe(S.su?.cl) || store.classes[0]; S.su = S.su || {}; S.su.cl = cl.id;
  const mats = [...new Set(store.controles.filter(c => c.classeId === cl.id).map(c => c.matiere))];
  const mat = mats.includes(S.su.mat) ? S.su.mat : mats[0]; S.su.mat = mat;
  const top = `<div class="head"><div><h2>Suivi des élèves</h2><p>Maîtrise de chaque notion sur toute l'année, calculée sur les copies validées.</p></div>
    <div class="row"><select id="su-cl" style="width:auto" aria-label="Classe">${selOpts(store.classes, cl.id, x => x.nom, x => x.id)}</select>
    ${mats.length ? `<select id="su-mat" style="width:auto" aria-label="Matière">${selOpts(mats, mat)}</select>` : ""}</div></div>`;
  if (!mat) return top + `<div class="panel empty">Aucun contrôle pour cette classe.</div>`;
  const st = notionStats(cl, mat), cols = st.notions.slice(0, 10);
  const ms = (eid, k) => { const o = st.per[eid]?.[k]; return o ? o.s / o.n : null; };
  const lab = r => r == null ? "" : r >= .7 ? "Maîtrisé" : r >= .5 ? "Fragile" : "Non acquis";
  const e = (cl.eleves || []).find(x => x.id === S.su.el);
  let detail = "";
  if (e){
    const hist = studentCtrls(cl, mat, e), avg = hist.filter(x => isCtrl(x.c)).map(x => final20(x.c, x.cp));
    const bil = store.bilans[`${cl.id}_${e.id}_${slug(mat)}`];
    const nl = st.notions.map(k => ({k, r:ms(e.id, k), n:st.per[e.id]?.[k]?.n || 0})).filter(x => x.r != null).sort((a, b) => a.r - b.r);
    detail = `<section class="panel grid">
      <div class="row between"><div><div class="label">${esc(mat)}</div><h3 style="font-size:20px">${esc(e.prenom)} ${esc(e.nom)}</h3></div>
        <div class="total num" style="color:var(--ink)">${avg.length ? fmt(avg.reduce((a, b) => a + b, 0) / avg.length) : "—"}<small>/20</small></div></div>
      <div class="grid g2">
        <div><div class="label" style="margin-bottom:6px">Notions, de la plus fragile à la plus solide</div>
          <div class="bars">${nl.map(x => `<div class="bar" style="grid-template-columns:1fr 90px 44px"><span class="small">${esc(st.labels[x.k])} <span class="muted">(${x.n})</span></span><div class="track"><div class="fill" style="width:${Math.round(x.r * 100)}%;background:var(--${tone(x.r)})"></div></div><span class="num small" style="text-align:right">${pct(x.r)}</span></div>`).join("") || `<p class="muted small">Aucune copie validée.</p>`}</div></div>
        <div><div class="label" style="margin-bottom:6px">Contrôles</div>${hist.map(x => `<div class="item"><div><div class="t small">${x.c.type === "rattrapage" ? "↺ " : ""}${esc(x.c.titre)}</div><div class="s">${esc(frDate(x.c.date) || "")}</div></div><span class="cell ${tone(final20(x.c, x.cp) / 20)}">${fmt(final20(x.c, x.cp))}</span></div>`).join("") || `<p class="muted small">Aucun.</p>`}</div>
      </div>
      <div class="grid" style="gap:8px"><div class="row between"><div class="label">Appréciation pour le bulletin</div><button class="btn sm" id="appr" data-e="${e.id}">${bil ? "Réécrire" : "Rédiger"} (IA)</button></div>

  }
  return top + `<section class="panel"><p class="small muted">Vert : maîtrisé (70 % et plus) · orange : fragile · rouge : non acquis. Touche un élève pour son détail.</p>
    <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Élève</th>${cols.map(k => `<th class="c" title="${esc(st.labels[k])}" style="max-width:110px;overflow:hidden;text-overflow:ellipsis">${esc(st.labels[k].slice(0, 16))}</th>`).join("")}</tr></thead><tbody>
    ${(cl.eleves || []).map(x => `<tr class="clickable ${x.id === S.su.el ? "sel" : ""}" data-suel="${x.id}"><td><b>${esc(x.prenom)} ${esc(x.nom)}</b></td>${cols.map(k => { const r = ms(x.id, k); return `<td class="c"><span class="cell ${tone(r)}" title="${lab(r)}">${r == null ? "—" : Math.round(r * 100)}</span></td>`; }).join("")}</tr>`).join("")}
    </tbody></table></div></section>` + detail;
}

/* ================= 3. Vue direction ================= */
function vDirection_0(){
  const cls = store.classes; if (!cls.length) return `<div class="head"><h2>Direction</h2></div><div class="panel empty">Aucune classe.</div>`;
  const mats = [...new Set(store.controles.filter(isCtrl).map(c => c.matiere))];
  const avgOf = (cl, mat, e) => { const v = studentCtrls(cl, mat, e).filter(x => isCtrl(x.c) && x.cp.validee).slice(-3).map(x => final20(x.c, x.cp)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const grid = cls.map(cl => ({cl, m:Object.fromEntries(mats.map(mat => { const v = (cl.eleves || []).map(e => avgOf(cl, mat, e)).filter(x => x != null); return [mat, v.length ? v.reduce((a, b) => a + b, 0) / v.length : null]; }))}));
  const risk = []; cls.forEach(cl => (cl.eleves || []).forEach(e => { const low = mats.map(m => [m, avgOf(cl, m, e)]).filter(([, a]) => a != null && a < 10); if (low.length >= 2) risk.push({cl, e, low}); }));
  const weak = []; cls.forEach(cl => mats.forEach(mat => { const st = notionStats(cl, mat); st.notions.forEach(k => { const v = Object.values(st.per).map(p => p[k]).filter(Boolean); if (v.length >= 3){ const r = v.reduce((a, o) => a + o.s / o.n, 0) / v.length; if (r < .5) weak.push({cl, mat, label:st.labels[k], r, n:v.length}); } }); }));
  weak.sort((a, b) => a.r - b.r);
  const since = Date.now() - 30 * 864e5, recent = store.controles.filter(c => Date.parse(c.createdAt || 0) > since);
  let pending = 0; store.controles.forEach(c => { const f = feuille(c.id); if (f) Object.values(f.copies || {}).forEach(cp => { if (!cp.validee && Object.keys(cp.answers || {}).length) pending++; }); });
  return `<div class="head"><div><h2>Vue direction</h2><p>Toutes les classes et matières d'un coup d'œil. Moyennes sur les 3 derniers contrôles validés.</p></div></div>
  <div class="grid g3">
    <div class="panel"><div class="label">Contrôles créés · 30 jours</div><div class="total num" style="color:var(--ink)">${recent.filter(isCtrl).length}</div></div>
    <div class="panel"><div class="label">Rattrapages · 30 jours</div><div class="total num" style="color:var(--ink)">${recent.filter(c => c.type === "rattrapage").length}</div></div>
    <div class="panel"><div class="label">Copies à valider</div><div class="total num" style="color:${pending ? "var(--pen)" : "var(--ink)"}">${pending}</div></div>
  </div>
  <section class="panel"><h3>Moyennes par classe et matière</h3><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Classe</th>${mats.map(m => `<th class="c">${esc(m)}</th>`).join("")}</tr></thead><tbody>
    ${grid.map(g => `<tr><td><b>${esc(g.cl.nom)}</b> <span class="muted small">${(g.cl.eleves || []).length} él.</span></td>${mats.map(m => `<td class="c"><span class="cell ${g.m[m] == null ? "none" : tone(g.m[m] / 20)}">${fmt(g.m[m])}</span></td>`).join("")}</tr>`).join("")}
  </tbody></table></div></section>
  <div class="grid g2">
    <section class="panel"><h3>Élèves en difficulté dans 2 matières ou plus</h3><div style="margin-top:4px">${risk.map(r => `<div class="item"><div><div class="t">${esc(r.e.prenom)} ${esc(r.e.nom)}</div><div class="s">${esc(r.cl.nom)}</div></div><div class="tags">${r.low.map(([m, a]) => `<span class="chip bad">${esc(m)} ${fmt(a)}</span>`).join("")}</div></div>`).join("") || `<p class="muted small" style="padding:8px 0">Aucun pour l'instant.</p>`}</div></section>
    <section class="panel"><h3>Notions non acquises par la classe</h3><div style="margin-top:4px">${weak.slice(0, 12).map(w => `<div class="item"><div><div class="t">${esc(w.label)}</div><div class="s">${esc(w.cl.nom)} · ${esc(w.mat)} · ${w.n} élèves</div></div><span class="cell bad">${pct(w.r)}</span></div>`).join("") || `<p class="muted small" style="padding:8px 0">Aucune notion sous 50 %.</p>`}</div></section>
  </div>`;
}

  for (const [k, [x, y]] of Object.entries(CORNERS)){ const z = CSIZE[k], im = document.createElement("img"); im.className = "sh-corner"; im.alt = "";
    im.src = qrURL(k === "tl" ? `TK1W|${cl.id}|${e.id}|1` : "TK1C|" + k, 3); im.style.cssText = `left:${x - z / 2}px;top:${y - z / 2}px;width:${z}px;height:${z}px`; p.append(im); }
  stage.append(p);
  const pr = p.getBoundingClientRect(); const boxes = $$(".sh-box", p).map(el => { const r = el.getBoundingClientRect(); return {x:Math.round(r.left - pr.left), y:Math.round(r.top - pr.top), w:Math.round(r.width), h:Math.round(r.height)}; });
  return {pages:[p], boxes};
}
function lev(a, b){ const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n); let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const simil = (ref, got) => { const A = ref.replace(/\s+/g, ""), B = String(got || "").replace(/\s+/g, ""); return Math.max(0, 1 - lev(A, B) / Math.max(A.length, 1)); };
async function processWriting(it, data){
  const [, clId, eid] = data.split("|"); const cl = classe(clId), e = cl?.eleves?.find(x => x.id === eid);
  it.ctrlId = null; it.eleveId = eid; it.kind = "fiche";
  if (!e){ it.status = "erreur"; it.msg = "Fiche d'écriture : élève introuvable."; return scheduleRender(); }
  it.label = `${e.prenom} ${e.nom} · fiche d'écriture`;
  const H = sheetToPhoto(it.found || []); if (!H){ it.status = "erreur"; it.msg = "Repères non trouvés : reprends la photo avec les 4 coins visibles."; return scheduleRender(); }
  it.status = "lecture"; it.msg = "Découpage des lignes…"; scheduleRender();
  try{
    const {boxes} = fichePages(cl, e); $("#sheetStage").innerHTML = "";
    const crops = boxes.map(b => warpBox(it.cv, H, b));
    const samples = FICHE.map(f => ({id:f.id, texte:f.texte, usage:f.usage, asset:null, lu:"", sim:null}));
    if (ASSETS) for (let k = 0; k < crops.length; k++){ try { samples[k].asset = (await ASSETS.upload(await toBlob(crops[k], .85))).id; } catch(x){} }
    if (AI && LIM?.images){
      it.msg = "Test de lecture de l'écriture…"; scheduleRender();
      const per = Math.max(1, LIM.images.maxCount || 1);
      for (let i = 0; i < crops.length; i += per){
        const part = crops.slice(i, i + per);
        const r = await ai(`Chaque image est une ligne manuscrite écrite par un élève. Transcris exactement ce qui est écrit, caractère par caractère, sans corriger. L'hébreu en caractères hébreux carrés. Réponds uniquement en JSON : {"lignes":["…"]} avec ${part.length} élément(s), dans l'ordre des images.`, {images: await Promise.all(part.map(cv => toBlob(cv, .9)))});
        (r?.lignes || []).forEach((t, j) => { if (samples[i + j]){ samples[i + j].lu = String(t); samples[i + j].sim = simil(samples[i + j].texte, t); } });
      }
    }
    const sims = samples.map(s => s.sim).filter(x => x != null);
    const score = sims.length ? sims.reduce((a, b) => a + b, 0) / sims.length : null;
    const byUsage = u => { const v = samples.filter(s => s.usage === u && s.sim != null).map(s => s.sim); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    await write("ecritures/" + eid, {classeId:clId, samples, score, parUsage:{maths:byUsage("maths"), hebreu:byUsage("hebreu"), francais:byUsage("francais")}, at:new Date().toISOString()});
    it.status = "ok"; it.msg = score != null ? `Écriture enregistrée · lisibilité ${pct(score)}` : "Écriture enregistrée"; it.cv = null;
  }catch(x){ console.error(x); it.status = "erreur"; it.msg = aiErr(x?.code); }
  scheduleRender();
}
async function sampleImages(eid, mat, max = 3){
  const w = store.ecritures[eid]; if (!w) return {blobs:[], txt:""};
  const u = usageOf(mat), sel = (w.samples || []).filter(s => s.asset && s.usage === u).slice(0, max);
  const blobs = []; for (const s of sel){ try { blobs.push(await getBlob(s.asset)); } catch(x){} }
  const ok = sel.slice(0, blobs.length);
  return {blobs, txt: ok.length ? `\nLes images 2 à ${ok.length + 1} sont des échantillons de l'écriture de CET élève, avec le texte exact qu'il a recopié : ${ok.map((s, k) => `image ${k + 2} = « ${s.texte} »`).join(" ; ")}. Sers-t'en pour reconnaître sa façon de former les lettres et les chiffres.` : ""};
}

      await write("bilans/" + `${cl.id}_${e.id}_${slug(mat)}`, {texte:txt.trim(), classeId:cl.id, eleveId:e.id, matiere:mat, at:new Date().toISOString()});

    if (cloudOn()){

    }
    if (window.TIKOUN_CONFIG?.accounts){ await bootAccounts(); return; }

    }

    refreshCaps(); render();

})();
