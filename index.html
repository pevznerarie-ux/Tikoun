:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --surface-2:#F3EFE6; --ink:#15233F; --muted:#6B6758; --line:#E7E1D4;
  --pen:#C0392B; --pen-soft:#FBEAE7; --blue:#15233F; --blue-soft:#EBEEF4; --gold:#B7862B; --gold-soft:#F7EDD8; --on-blue:#FFFFFF;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10141D; --surface:#171C27; --surface-2:#1F2532; --ink:#EFEADF; --muted:#A7A192; --line:#2C3342;
    --pen:#FF7A6E; --pen-soft:#3A1E1D; --blue:#E6D3A8; --blue-soft:#2A2A22; --gold:#D9AE58; --gold-soft:#3A3120; --on-blue:#10141D;
    --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10141D; --surface:#171C27; --surface-2:#1F2532; --ink:#EFEADF; --muted:#A7A192; --line:#2C3342;
  --pen:#FF7A6E; --pen-soft:#3A1E1D; --blue:#E6D3A8; --blue-soft:#2A2A22; --gold:#D9AE58; --gold-soft:#3A3120; --on-blue:#10141D;
  --ok:#4FC98D; --ok-soft:#15301F; --warn:#E9B155; --warn-soft:#33260F; --bad:#FF7A6E; --bad-soft:#3A1C1A;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mk{height:34px;width:auto;display:block}
.logo .wm{height:22px;width:auto;display:block;margin-top:2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .wm{filter:brightness(0) invert(.92)}}
:root[data-theme="dark"] .logo .wm{filter:brightness(0) invert(.92)}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo small{border-left:1px solid var(--line);padding-left:10px}
.logo small{color:var(--muted);font-size:13px}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}

.stepper::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);background:var(--surface-2);white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.st b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:12px}
.st.done{color:var(--ok);background:var(--ok-soft)} .st.done b{background:var(--ok);color:var(--surface)}
.st.on{color:var(--paper);background:var(--ink)} .st.on b{background:var(--gold);color:#fff}
.stepnav{display:flex;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
a.item.link{text-decoration:none;color:inherit} a.item.link:hover .t{color:var(--blue)}
.view{padding-top:18px;display:grid;gap:16px}
.view>*,.grid>*,.split>*{min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.head p{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--muted)}

.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.field{display:grid;gap:4px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

.item:first-child{border-top:0}
.item .t{font-weight:600} .item .s{font-size:13px;color:var(--muted)}
.clickable{cursor:pointer} .clickable:hover .t{color:var(--blue)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.on{background:var(--ink);color:var(--paper)}
.step.done{background:var(--ok-soft);color:var(--ok)}
.status{font-size:13px;min-height:1.4em}
.thinking{color:var(--muted);font-style:italic}
.err{color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.qed{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.vtab{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tbl-wrap{overflow-x:auto}

td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:40px;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-weight:700;text-align:center}
.cell.ok{background:var(--ok-soft);color:var(--ok)} .cell.warn{background:var(--warn-soft);color:var(--warn)}
.cell.bad{background:var(--bad-soft);color:var(--bad)} .cell.none{background:var(--surface-2);color:var(--muted)}
.stu{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;gap:8px;border:0;background:none;width:100%;text-align:left}
.stu:hover{background:var(--surface-2)} .stu[aria-current="true"]{background:var(--blue-soft)}
.copy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.copy-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.q:first-of-type{border-top:0}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.answer{background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:15px;white-space:pre-wrap;line-height:26px;
  background-image:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px)}
.answer mark{background:var(--pen-soft);color:var(--pen);text-decoration:underline wavy var(--pen);text-underline-offset:4px;padding:0 2px;border-radius:3px}
.illisible{color:var(--warn);font-weight:600}
.note{font-family:var(--hand);color:var(--pen);font-size:21px;line-height:1.2}
.comment{border-left:2px solid var(--pen);padding-left:12px;display:grid;gap:6px}
.score{display:flex;align-items:center;gap:6px}
.score input{width:66px;text-align:center;font-family:var(--mono);font-weight:700;color:var(--pen)}
.score .den{font-family:var(--mono);color:var(--muted)}
.total{font-family:var(--hand);font-size:34px;color:var(--pen);line-height:1}
.total small{font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.scans{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.scans img{height:140px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.zoom{position:fixed;inset:0;background:rgba(10,14,22,.85);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;display:flex;justify-content:center;align-items:flex-start}
.zoom img{max-width:min(100%,900px);background:#fff;border-radius:6px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:40px 1fr 56px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.queue{display:grid;gap:0}
.qi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.qi:first-child{border-top:0}
.qi img{width:52px;height:68px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff}
.preview-wrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.lvl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
.lvl.socle{background:var(--warn-soft);color:var(--warn)} .lvl.standard{background:var(--blue-soft);color:var(--blue)} .lvl.approfondi{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Printable sheet — fixed light look, paper is paper */

/* ===== Premium layer ===== */
:root{--r:16px;--gold-2:#E2B865;--shadow:0 1px 2px rgba(21,35,63,.04),0 10px 30px -14px rgba(21,35,63,.16);--hero:#13203B}
body{font-size:15px;letter-spacing:-.003em}
.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{padding-block:16px 6px}
.logo small{font-size:12.5px;letter-spacing:.02em}
.tab{font-weight:500;font-size:14.5px;padding:12px 13px 11px;border-bottom-width:2px;color:var(--muted);transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{font-weight:600}
.view{padding-top:32px;gap:22px}
.head{margin-bottom:2px}
.head h2{font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.head p{margin-top:6px;font-size:15px}
h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.panel{border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.btn{border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;box-shadow:0 1px 1px rgba(21,35,63,.04);transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 1px 2px rgba(21,35,63,.25),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{filter:brightness(1.06)}
.btn.on-dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#F4EFE4}
.btn.on-dark:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.chip{border-radius:6px;padding:3px 8px;font-size:11.5px;letter-spacing:.01em}
.label{font-size:11px;letter-spacing:.14em;color:var(--gold)}
.field>label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
input,select,textarea{border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.item{padding:15px 0}
.item .t{font-weight:600;font-size:15px}
.st{border-radius:999px;padding:9px 15px;font-weight:500}
.st.on{font-weight:600}
.fchip{padding:6px 14px}
.stepnav{padding-top:14px}
.hero-card{background:var(--hero);color:#F4EFE4;border-radius:20px;padding:30px 32px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;box-shadow:0 20px 50px -24px rgba(19,32,59,.55);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;left:-90px;bottom:-130px;width:220px;height:220px;border:1px solid rgba(226,184,101,.25);border-radius:50%}
.hero-card h2{font-size:36px;font-weight:500;color:#fff;letter-spacing:-.02em;margin-top:6px}
.hero-card p{color:rgba(244,239,228,.78);margin-top:8px;font-size:15.5px}
.hero-card p b{color:var(--gold-2)}
.hc-kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:600}
.hc-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden;position:relative;z-index:1}
.hc-stats div{background:var(--hero);padding:16px 18px;display:grid;gap:2px}
.hc-stats b{font-family:var(--display);font-size:30px;font-weight:500;color:#fff;letter-spacing:-.02em}
.hc-stats span{font-size:12.5px;color:rgba(244,239,228,.65)}
@media (max-width:760px){.hero-card{grid-template-columns:1fr;padding:24px}.hero-card h2{font-size:28px}.head h2{font-size:26px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#1B2436;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--hero:#1B2436}

/* Cormorant : titres un peu plus grands */
h1,h2,h3,.hc-stats b,.total,.sh-title{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.hero-card::after{display:none}
h2{font-size:26px} h3{font-size:21px;font-weight:600}
.head h2{font-size:38px;font-weight:500}
.hero-card h2{font-size:44px}
.hc-stats b{font-size:36px}
.sh-title{font-size:26px!important;font-weight:700!important}
@media (max-width:760px){.hero-card h2{font-size:34px}.head h2{font-size:30px}}
</style>

</head>

"use strict";
/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const pct = n => Math.round(n * 100) + " %";
const tone = r => r == null ? "none" : r >= 0.7 ? "ok" : r >= 0.5 ? "warn" : "bad";
const uid = (n = 10) => { const a = "abcdefghijkmnpqrstuvwxyz23456789"; let s = ""; const b = crypto.getRandomValues(new Uint8Array(n)); for (const x of b) s += a[x % a.length]; return s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const frDate = d => { if (!d) return ""; const x = new Date(d + (d.length === 10 ? "T12:00:00" : "")); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const half = v => Math.round(v * 2) / 2;
function toast(msg, ms = 3500){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }

const MATIERES = ["Mathématiques","Français","Histoire-Géographie","SVT","Physique-Chimie","Anglais","Guémara","Halakha","Houmach","Hébreu","Hassidout","Philosophie","SES"];

const LEVELS = ["socle","standard","approfondi"];
const LVL = {socle:"Socle", standard:"Standard", approfondi:"Approfondi"};

const AFFICHE = {les2:"École et mon nom", ecole:"École seulement", nom:"Mon nom seulement"};
function headerFrom(aff){
  const e = S.me?.ecole, ec = e?.nom ? e.nom + (e.ville ? " · " + e.ville : "") : "", nom = S.me?.nom || "";
  if (aff === "ecole") return ec || nom; if (aff === "nom") return nom || ec; return [ec, nom].filter(Boolean).join(" · ");
}

}[c] || "Échec temporaire de l'IA : relance.");

/* ================= Capabilities ================= */
let DB = null, AI = null, ASSETS = null, DL = null, LIM = null, LOCAL = false;

/* In-memory stand-in when the database is not available in this view */
function memDB(init = {}, persist = null){
  const data = {...init}; const subs = [];
  const colOf = p => p.split("/").slice(0, -1).join("/");
  const notify = col => subs.filter(s => s.col === col).forEach(s => s.fn(snapOf(col)));
  const snapOf = col => { const docs = Object.keys(data).filter(k => colOf(k) === col).map(k => ({id:k.split("/").pop(), exists:true, data:() => data[k], metadata:{}}));
    return {docs, size:docs.length, empty:!docs.length, docChanges:() => [], metadata:{}}; };
  const merge = (a, b) => { for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const doc = p => ({ id:p.split("/").pop(), path:p,
    get: async () => ({id:p.split("/").pop(), exists:!!data[p], data:() => data[p], metadata:{}}),
    set: async d => { data[p] = JSON.parse(JSON.stringify(d)); notify(colOf(p)); if (persist) await persist(p, data[p], "set"); },
    update: async d => { if (!data[p]) throw {code:"invalid_argument"}; const patch = JSON.parse(JSON.stringify(d)); merge(data[p], JSON.parse(JSON.stringify(d))); data[p] = {...data[p]}; notify(colOf(p)); if (persist) await persist(p, data[p], "update", patch); },
    delete: async () => { delete data[p]; notify(colOf(p)); if (persist) await persist(p, null, "delete"); } });
  return { doc, _all:() => data, _remote:(p, val) => { if (val == null) delete data[p]; else data[p] = val; notify(colOf(p)); }, collection: col => ({ path:col, doc: id => doc(col + "/" + (id || uid(16))),
    onSnapshot: (fn) => { const s = {col, fn}; subs.push(s); setTimeout(() => fn(snapOf(col))); return () => subs.splice(subs.indexOf(s), 1); } }) };
}

/* ================= Store ================= */
const store = {classes:[], cours:[], controles:[], feuilles:{}, ecritures:{}, bilans:{}};
const S = {
  view:"home", wizStep:1, coursId:null, coursDraft:null, params:{classeId:"", titre:"", duree:55, nbq:5, difficulte:"moyen", types:["cours","application"], consignes:"", differencie:false, matiere:"", niveau:""},
  editId:null, vtab:{}, previewEleve:null, classeSel:null, levelMat:"Mathématiques", suggestions:null,
  su:null, bk:null, bankOpen:false, bkq:"", corrCtrl:null, corrEleve:null, editTr:{}, editCom:{}, anCtrl:null, queue:[], queueRunning:false, busy:{}
};


const classe = id => store.classes.find(c => c.id === id);
const ctrl = id => (store.allCtrl || store.controles).find(c => c.id === id);
const feuille = id => store.feuilles[id];
const eleveOf = (c, eid) => (classe(c.classeId)?.eleves || []).find(e => e.id === eid);
const studentsOf = c => { const cl = classe(c.classeId); if (!cl) return []; return c.eleves?.length ? cl.eleves.filter(e => c.eleves.includes(e.id)) : cl.eleves; };
const levelOf = (e, mat) => e?.niveaux?.[mat] || "standard";
const versionFor = (c, e) => c.differencie ? levelOf(e, c.matiere) : "standard";
const vOf = (q, lvl) => { const v = q.v || {}; if (v[lvl]?.enonce) return v[lvl]; if (v.standard?.enonce) return v.standard; return LEVELS.map(l => v[l]).find(x => x?.enonce) || {enonce:"", corrige:"", criteres:""}; };
const maxOf = c => (c.questions || []).reduce((a, q) => a + (+q.points || 0), 0);
const noteOf = a => a ? (a.note ?? a.noteIA ?? null) : null;
const copyTotal = (c, cp) => (c.questions || []).reduce((s, q) => s + (+noteOf(cp?.answers?.[q.id]) || 0), 0);
const copyDone = (c, cp) => !!cp && (c.questions || []).every(q => noteOf(cp.answers?.[q.id]) != null);
const on20 = (t, m) => m ? t / m * 20 : null;
const bonusMax = c => (+c.bonus?.proprete || 0) + (+c.bonus?.orthographe || 0);
function bonusOf(c, cp){
  const out = {proprete:0, orthographe:0}; if (!cp) return out;
  for (const k of ["proprete","orthographe"]){ const mx = +c.bonus?.[k] || 0; if (!mx) continue;
    if (cp.bonusProf?.[k] != null){ out[k] = +cp.bonusProf[k]; continue; }
    const fr = Object.values(cp.bonusPages || {}).map(b => +b?.[k]).filter(x => !isNaN(x));
    out[k] = fr.length ? half(mx * fr.reduce((a, b) => a + b, 0) / fr.length) : 0; }
  return out;
}
const final20 = (c, cp) => { const b = bonusOf(c, cp); return Math.min(20, on20(copyTotal(c, cp), maxOf(c)) + b.proprete + b.orthographe); };

/* Serialized writes: one at a time */
let wq = Promise.resolve();
function write(path, data, mode = "set"){
  wq = wq.then(() => mode === "update" ? DB.doc(path).update(data) : mode === "delete" ? DB.doc(path).delete() : DB.doc(path).set(data))
    .catch(e => { console.error(e); toast(e?.code === "quota_exceeded" ? "Base pleine : supprime d'anciens contrôles." : "Enregistrement impossible (" + (e?.code || "erreur") + ")."); });
  return wq;
}
const saveCtrl = c => { const {id, ...d} = c; return write("controles/" + id, d); };

/* ================= AI ================= */
async function ai(prompt, opts = {}){
  if (!AI) throw {code:"no_ai"};
  return AI.json(prompt, {cache:false, ...opts});
}
async function aiText(prompt, opts = {}){
  if (!AI) throw {code:"no_ai"};
  return (await AI(prompt, {cache:false, ...opts})).text;
}

/* ================= Render loop (keeps focus while data arrives) ================= */
let rq = false, skipped = false;
document.addEventListener("focusout", () => { if (skipped) setTimeout(scheduleRender, 0); });
function scheduleRender(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); }
function render(){
  const a = document.activeElement, keep = a && a.id && $("#view").contains(a) ? {id:a.id, s:a.selectionStart, e:a.selectionEnd, v:a.value, typing: ["INPUT","TEXTAREA"].includes(a.tagName) && a.type !== "file"} : null;
  if (keep?.typing && a.dataset.live !== undefined){ skipped = true; return; } // don't clobber a field being typed
  skipped = false;
  $$(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.r === navKey()));
  const V = S.auth ? vAuth : (typeof SB !== "undefined" && SB && !SB_USER) ? vLogin : (typeof NEED_CODE !== "undefined" && NEED_CODE) ? vCode : {home:vHome, classes:vClasses, new:vNew, edit:vEdit, scan:vScan, correct:vCorrect, analyse:vAnalyse, suivi:vSuivi, banque:vBanque, direction:vDirection, reglages:vReglages, controles:vControles, exercices:vExercices, quiznew:vQuizNew, quiz:vQuiz, compte:vCompte, comptes:vComptes}[S.view] || vHome;
  $("#tabs").hidden = V === vLogin || V === vCode || V === vAuth;
  { const acc = !!window.TIKOUN_CONFIG?.accounts; const tg = (id, h) => { const e = document.getElementById(id); if (e) e.hidden = h; };
    tg("tabComptes", !isAdmin()); { const n = (S.users || []).filter(u => u.statut === "en_attente").length, tc = document.getElementById("tabComptes"); if (tc) tc.textContent = n ? `Comptes (${n})` : "Comptes"; } tg("tabCompte", !(acc && S.me)); tg("tabReglages", acc || !STANDALONE); tg("tabDir", acc && !isAdmin()); }
  let html = V();
  const fc = S.inCtrl && ["edit","scan","correct","analyse"].includes(S.view) && V !== vLogin && ctrl(S.inCtrl);
  if (fc){
    if (S.view === "correct" && fc.statut === "brouillon") html = `<section class="panel empty">Les feuilles ne sont pas encore imprimées. Passe par l'étape « Imprimer ».</section>`;
    html = ctrlFrame(fc, html.replace(/<select id="(corrSel|anSel)"[\s\S]*?<\/select>/, "").replace(/<h2>(Correction|Classe & rattrapage|Scanner les copies)<\/h2>/, "<h3>$1</h3>"));
  }
  $("#view").innerHTML = `<div class="view">${LOCAL ? `<p class="banner">Base de données indisponible dans cette vue : rien n'est sauvegardé. Ouvre l'application depuis claude.ai.</p>` : ""}${html}</div>`;
  if (keep){ const el = document.getElementById(keep.id); if (el){ el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch(e){} } }
  if (S.view === "edit" && S.step === "mise-en-page") drawPreview();
  { const sp = $(".stepper"), on = $(".st.on"); if (sp && on) sp.scrollLeft = on.offsetLeft - sp.clientWidth / 2 + on.clientWidth / 2; }
  if (S.view === "correct" && window.MathJax?.typesetPromise){ const v = $("#view"); MathJax.typesetClear?.([v]); MathJax.typesetPromise([v]).catch(() => {}); }
}

function vAnalyse(){

  if (!list.length) return `<div class="head"><h2>Classe & rattrapage</h2></div><div class="panel empty">Les résultats apparaîtront ici dès que des copies auront été corrigées.</div>`;
  const c = ctrl(S.anCtrl) || list[0]; S.anCtrl = c.id;
  const f = feuille(c.id), max = maxOf(c), studs = studentsOf(c);
  const rows = studs.map(e => ({e, cp:f.copies[e.id]})).filter(r => copyDone(c, r.cp));
  const notes = rows.map(r => final20(c, r.cp));
  const avg = notes.reduce((a, b) => a + b, 0) / notes.length;
  const qs = c.questions.map((q, k) => {
    const got = rows.map(r => noteOf(r.cp.answers[q.id]) / q.points);

    return {q, k, rate: got.reduce((a, b) => a + b, 0) / got.length, fail: got.filter(x => x < .5).length, tags:Object.entries(tags).sort((a, b) => b[1] - a[1]).slice(0, 3)};
  });
  const ratts = store.controles.filter(x => x.type === "rattrapage" && x.parentId === c.id);

  return `
  <div class="head"><div><h2>Classe & rattrapage</h2><p>${rows.length} copie(s) corrigée(s) sur ${studs.length}${unval ? ` · <span style="color:var(--warn)">${unval} pas encore validée(s)</span>` : ""}</p></div>

    <div class="panel"><div class="label">Sous 10/20</div><div class="total num" style="color:var(--ink)">${notes.filter(n => n < 10).length}<small>/${notes.length}</small></div></div>
  </div>
  <section class="panel"><h3>Réussite et erreurs par question</h3>
    <div class="bars" style="margin-top:12px">${qs.map(x => `<div>
      <div class="bar"><b>Q${x.k + 1}</b><div class="track"><div class="fill" style="width:${Math.round(x.rate * 100)}%;background:var(--${tone(x.rate)})"></div></div><span class="num" style="text-align:right">${pct(x.rate)}</span></div>
      <div class="small muted" style="margin:2px 0 0 50px">${esc(x.q.notion || "")}${x.fail ? ` · ${x.fail} élève(s) sous la moitié des points` : ""}${x.tags.length ? " · " + x.tags.map(([t, n]) => `<span class="chip bad">${esc(t)} × ${n}</span>`).join(" ") : ""}</div></div>`).join("")}</div>
  </section>

    <div class="status" id="syn-st"></div>
    ${c.analyse ? `<div style="white-space:pre-wrap">${esc(c.analyse)}</div>` : `<p class="muted small">L'IA repère les notions non comprises et propose quoi reprendre en classe.</p>`}</section>

      <td class="c num"><b>${ok ? fmt(final20(c, cp)) : "—"}</b></td>

async function createRattrapage(c, e, replaceId){

  const weak = c.questions.map(q => ({q, a:cp.answers[q.id]})).filter(x => x.a && noteOf(x.a) / x.q.points < 0.6);
  const target = weak.length ? weak : c.questions.map(q => ({q, a:cp.answers[q.id]})).sort((x, y) => noteOf(x.a) / x.q.points - noteOf(y.a) / y.q.points).slice(0, 1);

Niveau habituel de l'élève dans cette matière : ${LVL[lvl]}.
Ses difficultés au contrôle « ${c.titre} » :
${ctx}

Crée exactement 3 exercices NOUVEAUX, de difficulté croissante, qui ciblent précisément ces erreurs :

function suggestLevels(cl, mat){
  const cs = store.controles.filter(c => c.classeId === cl.id && c.matiere === mat && isCtrl(c)).sort((a, b) => (b.date || b.createdAt || "").localeCompare(a.date || a.createdAt || ""));
  const map = {};
  cl.eleves.forEach(e => {
    const ns = []; for (const c of cs){ const cp = feuille(c.id)?.copies?.[e.id]; if (cp?.validee && copyDone(c, cp)) ns.push(final20(c, cp)); if (ns.length === 3) break; }
    if (ns.length){ const avg = ns.reduce((a, b) => a + b, 0) / ns.length; map[e.id] = {avg, lvl: avg < 10 ? "socle" : avg <= 15 ? "standard" : "approfondi"}; }
  });
  return map;
}

/* ================= Course import ================= */
async function importCourseFiles(files){
  const st = $("#c-st"); const parts = [];
  const pendingImgs = [];
  for (const f of files){
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
      st.innerHTML = `<span class="thinking">Lecture du PDF « ${esc(f.name)} »…</span>`;
      const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise; let txt = "";
      for (let i = 1; i <= pdf.numPages; i++){ const tc = await (await pdf.getPage(i)).getTextContent(); txt += tc.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("") + "\n\n"; }
      if (txt.replace(/\s/g, "").length > 150 * pdf.numPages) parts.push(txt.trim());
      else { for (let i = 1; i <= Math.min(pdf.numPages, 12); i++){ const pg = await pdf.getPage(i); const vp = pg.getViewport({scale: 1800 / Math.max(pg.view[2], pg.view[3])}); const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await pg.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise; pendingImgs.push(cv); } }
    } else { (await fileToCanvases(f)).forEach(cv => pendingImgs.push(cv)); }
  }
  if (pendingImgs.length){
    if (!AI || !LIM?.images){ st.textContent = "Ce document est une image : il faut l'IA avec images pour le lire. Colle le texte à la place."; }
    else {
      const per = Math.max(1, LIM.images.maxCount || 1);
      for (let i = 0; i < pendingImgs.length; i += per){
        st.innerHTML = `<span class="thinking">Lecture des pages ${i + 1} à ${Math.min(i + per, pendingImgs.length)} sur ${pendingImgs.length}…</span>`;
        const blobs = await Promise.all(pendingImgs.slice(i, i + per).map(cv => toBlob(scaled(cv, 1800))));
        const t = await aiText(`Transcris fidèlement le texte de ces pages de cours (dans l'ordre), en gardant titres, définitions, exemples et formules. Recopie l'hébreu en caractères hébreux, sans traduire. Pas de commentaire : uniquement le texte.`, {images:blobs});
        parts.push(t.trim());
      }
    }
  }
  const box = $("#c-texte"); const prev = box.value.trim();
  box.value = [prev, ...parts].filter(Boolean).join("\n\n").slice(0, 60000);
  S.coursDraft = {...(S.coursDraft || {}), texte:box.value};
  if (parts.length) st.textContent = "Texte extrait : relis-le, corrige si besoin, puis enregistre.";
}

  const lv = ["standard","standard","approfondi","socle","approfondi","socle","standard","standard"];
  const cid = uid(10);
  await write("classes/" + cid, {nom:"3e A (démo)", niveau:"3e", eleves:noms.map(([p, n], i) => ({id:uid(8), prenom:p, nom:n + " (démo)", niveaux:{"Mathématiques":lv[i]}})), createdAt:new Date().toISOString()});
  await write("cours/" + uid(10), {titre:"Fonctions affines (démo)", matiere:"Mathématiques", niveau:"3e", createdAt:new Date().toISOString(), texte:
`Chapitre : Fonctions affines

1. Définition
Une fonction affine est une fonction f définie par f(x) = ax + b, où a et b sont deux nombres fixés.
a est le coefficient directeur, b est l'ordonnée à l'origine.
Si b = 0, f(x) = ax : f est une fonction linéaire. Si a = 0, f(x) = b : f est une fonction constante.

2. Image et antécédent
L'image de x par f est le nombre f(x). Exemple : f(x) = 2x − 3 ; l'image de 4 est f(4) = 2×4 − 3 = 5.
Un antécédent de y par f est un nombre x tel que f(x) = y. Pour le trouver, on résout l'équation ax + b = y.
Exemple : antécédent de 7 par f : 2x − 3 = 7, donc 2x = 10, x = 5.

3. Représentation graphique
La représentation graphique d'une fonction affine est une droite. Elle passe par le point (0 ; b).
Quand x augmente de 1, f(x) augmente de a. Si a > 0, la fonction est croissante ; si a < 0, décroissante.

4. Déterminer une fonction affine à partir de deux points
Si f(x1) = y1 et f(x2) = y2, alors a = (y2 − y1) / (x2 − x1), puis on calcule b avec b = y1 − a×x1.

5. Problèmes
Comparer deux tarifs : tarif A = 20 € par mois ; tarif B = 8 € + 0,50 € par heure. On modélise B par f(h) = 0,5h + 8.
B est plus cher que A quand 0,5h + 8 > 20, c'est-à-dire h > 24.`});
  toast("Classe et cours de démonstration créés.");
}

let STANDALONE = false;

const blobSrc = id => (typeof SERVERSTORE !== "undefined" && SERVERSTORE) ? "/api/files/" + id : STANDALONE ? (BLOBURL[id] || (SB ? (wantUrl(id), "") : "")) : "/_blob/" + id;
async function getBlob(id){ if (SERVERSTORE){ const r = await fetch("/api/files/" + id, {credentials:"same-origin"}); if (!r.ok) throw {code:"no_blob"}; return r.blob(); } if (STANDALONE && SB) return cloudBlob(id); if (STANDALONE){ const b = await idbGet("blobs", id); if (!b) throw {code:"no_blob"}; return b; } return (await fetch("/_blob/" + id)).blob(); }

function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open("tikoun", 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
let IDB = null;
const idbReq = (store, mode, fn) => new Promise((res, rej) => { const tx = IDB.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); });
const idbGet = (s, k) => idbReq(s, "readonly", o => o.get(k));
const idbPut = (s, k, v) => idbReq(s, "readwrite", o => o.put(v, k));
const idbDel = (s, k) => idbReq(s, "readwrite", o => o.delete(k));
const idbAll = s => new Promise((res, rej) => { const out = {}; const tx = IDB.transaction(s, "readonly"); const c = tx.objectStore(s).openCursor();
  c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } }; tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); });

function parseJSONloose(t){
  try { return JSON.parse(t); } catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch(e){} }

      let msg = ""; try { msg = (await r.json())?.error?.message || ""; } catch(e){} throw {code, message:msg}; }
    const j = await r.json(); const text = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");

    return asJson ? parseJSONloose(text) : text;

}

function cloudCfg(){ const c = cfg(), w = window.TIKOUN_CONFIG || {};

async function cloudDB(){
  const init = {};
  for (let from = 0; ; from += 1000){
    const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999);
    if (error) throw error; data.forEach(r => init[r.path] = r.data); if (data.length < 1000) break;
  }
  const db = memDB(init, async (p, val, op, patch) => {
    let r;
    if (op === "delete") r = await SB.from("docs").delete().eq("path", p);
    else if (op === "update") r = await SB.rpc("tk_update", {p_path:p, p_patch:patch});
    else r = await SB.from("docs").upsert({path:p, col:p.split("/").slice(0, -1).join("/"), data:val});
    if (r.error){ console.error(r.error); throw {code:"cloud_write", message:r.error.message}; }
  });
  SB.channel("tikoun-docs").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, pl => {
    if (pl.eventType === "DELETE") db._remote(pl.old.path, null); else db._remote(pl.new.path, pl.new.data);
  }).subscribe();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState !== "visible") return;
    for (let from = 0; ; from += 1000){ const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999); if (error) return; data.forEach(r => db._remote(r.path, r.data)); if (data.length < 1000) break; } });
  return db;
}

let SERVERSTORE = false, SRV_PERSIST = true;
async function serverDB(){
  const r = await fetch("/api/db", {credentials:"same-origin"});
  if (r.status === 401){ NEED_CODE = true; throw {code:"need_code"}; }
  if (!r.ok) throw {code:"cloud_write", message:"serveur " + r.status};
  const j = await r.json(); let epoch = j.epoch, seq = j.seq; SRV_PERSIST = j.persistent !== false;
  const db = memDB(j.docs || {}, async (p, val, op, patch) => {
    const u = "/api/db/doc?path=" + encodeURIComponent(p);
    const res = op === "delete" ? await fetch(u, {method:"DELETE", credentials:"same-origin"})
      : await fetch(u, {method:op === "update" ? "PATCH" : "PUT", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify(op === "update" ? patch : val)});
    if (!res.ok) throw {code:res.status === 401 ? "need_code" : "cloud_write", message:"serveur " + res.status};
  });
  let busy = false;
  const pull = async () => {
    if (busy || document.visibilityState === "hidden") return; busy = true;
    try {
      const r2 = await fetch(`/api/db/changes?since=${seq}&epoch=${encodeURIComponent(epoch)}`, {credentials:"same-origin"}); if (!r2.ok) return;
      const k = await r2.json(); epoch = k.epoch; seq = k.seq;
      if (k.reset){ const cur = db._all(); for (const p of Object.keys(cur)) if (!(p in k.docs)) db._remote(p, null); for (const [p, v] of Object.entries(k.docs)) if (JSON.stringify(cur[p]) !== JSON.stringify(v)) db._remote(p, v); }
      else for (const c of k.changes || []){ if (JSON.stringify(db._all()[c.path]) !== JSON.stringify(c.data)) db._remote(c.path, c.data); }
    } catch(e){} finally { busy = false; }
  };
  setInterval(pull, 8000); document.addEventListener("visibilitychange", pull);
  return db;
}

  const r = await fetch("/api/files" + (want ? "?id=" + want : ""), {method:"POST", credentials:"same-origin", headers:{"content-type":blob.type || "image/jpeg"}, body:blob});
  if (!r.ok) throw {code:"cloud_write"}; const {id} = await r.json(); return {id, url:"/api/files/" + id}; } };

/* ================= Navigation : de vraies pages, avec adresse, Précédent / Suivant ================= */
const STEPS = [["preparer","Préparer"],["mise-en-page","Mise en page"],["imprimer","Imprimer"],["scanner","Scanner"],["corriger","Corriger"],["classe","Classe & rattrapage"]];
const stepIdx = s => STEPS.findIndex(x => x[0] === s);
function defaultStep(c){ return {brouillon:"preparer", imprime:"scanner", correction:"corriger", corrige:"classe"}[c?.statut] || "preparer"; }
function routeOf(){
  switch (S.view){
    case "home": return "accueil";
    case "new": return "nouveau";
    case "edit": return `controle/${S.editId}/${S.step || "preparer"}`;
    case "scan": return S.scanCtrl ? `controle/${S.scanCtrl}/scanner` : "scanner";
    case "correct": return S.corrCtrl && S.inCtrl ? `controle/${S.corrCtrl}/corriger` : "correction";
    case "analyse": return S.anCtrl && S.inCtrl ? `controle/${S.anCtrl}/classe` : "resultats";
    case "reglages": return "sauvegarde";
    case "quiznew": return "exercices/nouveau";
    case "quiz": return `exercices/${S.qz.id}/${S.qz.tab || "questions"}`;
    default: return S.view;
  }
}
function applyRoute(){
  const [a, b, c] = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  S.inCtrl = null; S.scanCtrl = null;
  if (a === "controle" && b){
    const step = STEPS.some(x => x[0] === c) ? c : "preparer"; S.inCtrl = b; S.step = step;
    if (stepIdx(step) <= 2){ S.view = "edit"; S.editId = b; }
    else if (step === "scanner"){ S.view = "scan"; S.scanCtrl = b; }
    else if (step === "corriger"){ S.view = "correct"; if (S.corrCtrl !== b){ S.corrCtrl = b; S.corrEleve = null; S.editTr = {}; S.editCom = {}; } }
    else { S.view = "analyse"; S.anCtrl = b; }
  }
  else if (a === "exercices" && b){ if (b === "nouveau") S.view = "quiznew"; else { if (S.qz.id !== b) S.qz.el = null; S.view = "quiz"; S.qz.id = b; S.qz.tab = ["questions","reglages","resultats"].includes(c) ? c : "questions"; } }
  else S.view = {accueil:"home", nouveau:"new", scanner:"scan", sauvegarde:"reglages", correction:"correct", resultats:"analyse"}[a] || (["controles","exercices","classes","suivi","banque","direction","compte","comptes"].includes(a) ? a : "home");
}
function go(v){
  S.view = v;
  if (v === "edit"){ S.inCtrl = S.editId; if (stepIdx(S.step) < 0 || stepIdx(S.step) > 2) S.step = "preparer"; }
  else if (v === "correct" && S.corrCtrl){ S.inCtrl = S.corrCtrl; S.step = "corriger"; }
  else if (v === "analyse" && S.anCtrl){ S.inCtrl = S.anCtrl; S.step = "classe"; }
  else if (v !== "scan") S.inCtrl = null;
  const h = "#/" + routeOf();
  if (location.hash !== h) location.hash = h; else { render(); window.scrollTo({top:0}); }
}
function openCtrl(id, step){ const c = ctrl(id); location.hash = `#/controle/${id}/${step || defaultStep(c)}`; }
window.addEventListener("hashchange", () => { applyRoute(); render(); window.scrollTo({top:0}); });

/* Cadre commun d'un contrôle : en-tête, étapes, Précédent / Suivant */
function ctrlProgress(c){
  const f = feuille(c.id), studs = studentsOf(c), n = studs.length;
  const sc = studs.filter(e => Object.keys(f?.copies?.[e.id]?.answers || {}).length).length, va = studs.filter(e => f?.copies?.[e.id]?.validee).length;
  return {n, sc, va, printed:!!f && Object.keys(f.copies || {}).length > 0};
}
function ctrlFrame(c, inner){
  const i = stepIdx(S.step), pr = ctrlProgress(c), cl = classe(c.classeId);
  const doneUpTo = {brouillon:-1, imprime:2, correction:3, corrige:4}[c.statut] ?? -1;
  const prev = STEPS[i - 1], next = STEPS[i + 1];
  return `<div class="crumbs small"><a href="#/controles">← Tous les contrôles</a></div>
  <div class="head"><div><div class="label">${c.type === "rattrapage" ? "Rattrapage" : c.type === "exercices" ? "Exercices" : "Contrôle"} · ${esc(c.matiere)} · ${esc(cl?.nom || "?")}${c.date ? " · " + esc(frDate(c.date)) : ""}</div><h2>${esc(c.titre)}</h2></div>

  <nav class="stepper" aria-label="Étapes">${STEPS.map(([k, l], j) => `<a href="#/controle/${c.id}/${k}" class="st ${j === i ? "on" : j <= doneUpTo ? "done" : ""}" ${j === i ? 'aria-current="step"' : ""}><b>${j + 1}</b><span>${l}</span></a>`).join("")}</nav>
  ${i <= 2 && c.statut === "brouillon" ? `<p class="small muted">Brouillon · chaque modification est enregistrée automatiquement.</p>` : ""}
  ${inner}
  <div class="stepnav">${prev ? `<a class="btn" href="#/controle/${c.id}/${prev[0]}">← ${prev[1]}</a>` : "<span></span>"}${next ? `<a class="btn primary" href="#/controle/${c.id}/${next[0]}">${next[1]} →</a>` : `<a class="btn" href="#/controles">Terminer</a>`}</div>`;
}

/* ================= Shared: document pages → PDF ================= */
function docPages(headHTML, blocks, footTxt){
  const stage = $("#sheetStage"); const pages = [];
  const np = () => { const p = document.createElement("div"); p.className = "sheet doc"; p.innerHTML = pages.length ? "" : headHTML;
    const f = document.createElement("div"); f.className = "sh-foot"; f.innerHTML = `<span>${esc(footTxt)}</span><span class="pn"></span>`; p.append(f); stage.append(p); pages.push(p); return p; };
  let page = np();
  for (const html of blocks){
    const b = document.createElement("div"); b.className = "sh-q"; b.innerHTML = html; page.insertBefore(b, page.querySelector(".sh-foot"));
    if (b.offsetTop + b.offsetHeight > 1123 - 70 && page.querySelectorAll(".sh-q").length > 1){ b.remove(); page = np(); page.insertBefore(b, page.querySelector(".sh-foot")); }
  }
  pages.forEach((p, i) => { p.querySelector(".pn").textContent = `page ${i + 1} / ${pages.length}`; });
  return pages;
}
async function buildPdf(builders, filename, st){
  if (!window.html2canvas || !window.jspdf){ st.textContent = "Bibliothèques PDF non chargées : recharge la page."; return false; }
  const ov = document.createElement("div"); ov.className = "zoom"; ov.style.alignItems = "center"; ov.innerHTML = `<div id="ovm" style="font-size:16px;color:#fff">Préparation…</div>`; document.body.append(ov);
  const stage = $("#sheetStage"); stage.style.left = "0"; stage.style.zIndex = "40";
  try{
    await document.fonts.ready;
    const pdf = new jspdf.jsPDF({unit:"pt", format:"a4"}); let first = true;
    for (let k = 0; k < builders.length; k++){
      stage.innerHTML = ""; const {pages, label} = builders[k]();
      await Promise.all($$("img", stage).map(im => im.decode ? im.decode().catch(() => {}) : null));
      for (let i = 0; i < pages.length; i++){
        $("#ovm").textContent = `${label} · ${k + 1} / ${builders.length}`;
        const cv = await html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:-window.scrollY, windowWidth:900, useCORS:true});
        if (!first) pdf.addPage(); first = false; pdf.addImage(cv.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 595.28, 841.89);
      }
    }
    const blob = pdf.output("blob"); ov.remove();
    if (!DL){ st.textContent = "Téléchargement indisponible dans cette vue : ouvre l'application dans claude.ai."; return false; }
    try { await DL.save({filename:filename.replace(/[\\/:*?"<>|]/g, "-"), data:blob}); st.textContent = "PDF prêt."; return true; }
    catch(e){ st.textContent = e?.code === "declined" ? "Téléchargement annulé." : "Téléchargement impossible dans cette vue."; return false; }
  }catch(e){ console.error(e); st.textContent = "Échec de génération du PDF."; return false; }
  finally{ ov.remove(); stage.style.left = "-12000px"; stage.innerHTML = ""; }
}

/* ================= 1. Copie rendue à l'élève ================= */
function renduPages(c, e){
  const cp = feuille(c.id)?.copies?.[e.id], max = maxOf(c), cl = classe(c.classeId), b = bonusOf(c, cp);
  const rows = studentsOf(c).map(x => feuille(c.id)?.copies?.[x.id]).filter(k => copyDone(c, k));
  const moy = rows.length ? rows.reduce((a, k) => a + final20(c, k), 0) / rows.length : null;
  const ratt = store.controles.find(x => x.type === "rattrapage" && x.parentId === c.id && x.eleves?.includes(e.id));
  const head = `<div class="sh-head"><div><div class="sh-school">${esc(enteteOf(c))}</div>
    <div class="sh-title" dir="auto">Copie corrigée · ${esc(c.titre)}</div>
    <div class="sh-meta">${esc(c.matiere)} · ${esc(cl?.nom || "")}${c.date ? " · " + esc(frDate(c.date)) : ""}</div>
    <div class="sh-name">Élève : <b>${esc(e.prenom)} ${esc(e.nom)}</b></div></div></div>
    <div class="rd-note"><span class="rd-big">${fmt(final20(c, cp))}</span><span> / 20</span>
      <span class="rd-sub">${[bonusMax(c) ? `note brute ${fmt(on20(copyTotal(c, cp), max))} · bonus propreté ${fmt(b.proprete)} · bonus orthographe ${fmt(b.orthographe)}` : "", moy != null ? `moyenne de la classe ${fmt(moy)}` : ""].filter(Boolean).join(" · ")}</span></div>`;
  const blocks = c.questions.map((q, k) => { const a = cp?.answers?.[q.id], v = vOf(q, cp?.version?.[q.id] || "standard");
    return `<div class="sh-qh"><span>Question ${k + 1}${q.notion ? " · " + esc(q.notion) : ""}</span><span class="rd-q">${fmt(noteOf(a))} / ${fmt(+q.points)}</span></div>
      <div class="sh-qt" dir="auto">${esc(v.enonce)}</div>
      ${a?.crop ? `<img class="rd-crop" alt="" src="${esc(blobSrc(a.crop))}">` : ""}
      ${a?.commentaire ? `<div class="rd-com" dir="auto">${esc(a.commentaire)}</div>` : ""}
      ${(a?.acquis || []).length ? `<div class="rd-tag">Acquis : ${esc(a.acquis.join(", "))}</div>` : ""}
      ${(a?.erreurs || []).length ? `<div class="rd-tag">À retravailler : ${esc(a.erreurs.join(", "))}</div>` : ""}`; });
  if (ratt) blocks.push(`<div class="sh-cons">Une feuille de rattrapage personnelle t'a été préparée : « ${esc(ratt.titre)} ». Fais-la sérieusement, elle cible exactement tes erreurs.</div>`);
  return docPages(head, blocks, `Mastery · copie corrigée · ${e.prenom} ${e.nom}`);
}

/* ================= 2. Suivi par notion ================= */
const nkey = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-");
function notionStats(cl, mat){
  const cs = store.controles.filter(c => c.classeId === cl.id && c.matiere === mat);
  const labels = {}, per = {}, count = {};
  for (const c of cs){ const f = feuille(c.id); if (!f) continue;
    for (const e of cl.eleves || []){ const cp = f.copies?.[e.id]; if (!cp?.validee) continue;
      for (const q of c.questions || []){ const n = noteOf(cp.answers?.[q.id]); if (n == null || !+q.points) continue;
        const k = nkey(q.notion) || "(sans notion)"; labels[k] = labels[k] || q.notion || "(sans notion)"; count[k] = (count[k] || 0) + 1;
        const o = ((per[e.id] = per[e.id] || {})[k] = per[e.id]?.[k] || {s:0, n:0}); o.s += n / q.points; o.n++; } } }
  return {cs, labels, per, notions:Object.keys(count).sort((a, b) => count[b] - count[a])};
}
function studentCtrls(cl, mat, e){
  return store.controles.filter(c => c.classeId === cl.id && c.matiere === mat).map(c => ({c, cp:feuille(c.id)?.copies?.[e.id]})).filter(x => copyDone(x.c, x.cp))
    .sort((a, b) => (a.c.date || a.c.createdAt || "").localeCompare(b.c.date || b.c.createdAt || ""));
}

function lev(a, b){ const m = a.length, n = b.length; if (!m || !n) return Math.max(m, n); let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
const simil = (ref, got) => { const A = ref.replace(/\s+/g, ""), B = String(got || "").replace(/\s+/g, ""); return Math.max(0, 1 - lev(A, B) / Math.max(A.length, 1)); };
async function processWriting(it, data){
  const [, clId, eid] = data.split("|"); const cl = classe(clId), e = cl?.eleves?.find(x => x.id === eid);
  it.ctrlId = null; it.eleveId = eid; it.kind = "fiche";
  if (!e){ it.status = "erreur"; it.msg = "Fiche d'écriture : élève introuvable."; return scheduleRender(); }
  it.label = `${e.prenom} ${e.nom} · fiche d'écriture`;
  const H = sheetToPhoto(it.found || []); if (!H){ it.status = "erreur"; it.msg = "Repères non trouvés : reprends la photo avec les 4 coins visibles."; return scheduleRender(); }
  it.status = "lecture"; it.msg = "Découpage des lignes…"; scheduleRender();
  try{
    const {boxes} = fichePages(cl, e); $("#sheetStage").innerHTML = "";
    const crops = boxes.map(b => warpBox(it.cv, H, b));
    const samples = FICHE.map(f => ({id:f.id, texte:f.texte, usage:f.usage, asset:null, lu:"", sim:null}));
    if (ASSETS) for (let k = 0; k < crops.length; k++){ try { samples[k].asset = (await ASSETS.upload(await toBlob(crops[k], .85))).id; } catch(x){} }
    if (AI && LIM?.images){
      it.msg = "Test de lecture de l'écriture…"; scheduleRender();
      const per = Math.max(1, LIM.images.maxCount || 1);
      for (let i = 0; i < crops.length; i += per){
        const part = crops.slice(i, i + per);
        const r = await ai(`Chaque image est une ligne manuscrite écrite par un élève. Transcris exactement ce qui est écrit, caractère par caractère, sans corriger. L'hébreu en caractères hébreux carrés. Réponds uniquement en JSON : {"lignes":["…"]} avec ${part.length} élément(s), dans l'ordre des images.`, {images: await Promise.all(part.map(cv => toBlob(cv, .9)))});
        (r?.lignes || []).forEach((t, j) => { if (samples[i + j]){ samples[i + j].lu = String(t); samples[i + j].sim = simil(samples[i + j].texte, t); } });
      }
    }
    const sims = samples.map(s => s.sim).filter(x => x != null);
    const score = sims.length ? sims.reduce((a, b) => a + b, 0) / sims.length : null;
    const byUsage = u => { const v = samples.filter(s => s.usage === u && s.sim != null).map(s => s.sim); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    await write("ecritures/" + eid, {classeId:clId, samples, score, parUsage:{maths:byUsage("maths"), hebreu:byUsage("hebreu"), francais:byUsage("francais")}, at:new Date().toISOString()});
    it.status = "ok"; it.msg = score != null ? `Écriture enregistrée · lisibilité ${pct(score)}` : "Écriture enregistrée"; it.cv = null;
  }catch(x){ console.error(x); it.status = "erreur"; it.msg = aiErr(x?.code); }
  scheduleRender();
}

}

S.qz = {id:null, tab:"questions", el:null}; S.qn = {coursId:"", classeId:"", titre:"", banque:30, parTentative:10, types:["qcm","vf","num","trou"], fermeture:"", consignes:""};
const QTYPES = {qcm:"QCM", vf:"Vrai / faux", num:"Réponse numérique", trou:"Texte à trous", redige:"Réponse rédigée (sur ordinateur)"};
const QSTAT = {brouillon:["Brouillon",""], ouvert:["Ouvert aux élèves","ok"], clos:["Clos","warn"]};
const quizOf = id => store.quizzes.find(q => q.id === id);
const myQuizzes = () => store.quizzes.filter(q => !S.me || (isAdmin() && S.scope === "ecole") || !q.owner || q.owner === S.me.id);
const repsOf = qid => Object.values(store.quizrep).filter(r => r.quizId === qid);
const quizNotions = q => [...new Set((q.questions || []).map(x => x.notion).filter(Boolean))];
const stars = n => "★".repeat(clamp(+n || 1, 1, 3));
const quizOpenNow = q => q.statut === "ouvert" && (!q.fermeture || new Date(q.fermeture + "T23:59:59") >= new Date());
const dur = s => { s = Math.round(+s || 0); if (s < 60) return s + " s"; const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); };

function mapQuizQ(x){
  const t = QTYPES[x?.type] ? x.type : null; if (!t || !String(x.enonce || "").trim()) return null;
  const q = {id:"x" + uid(7), type:t, notion:String(x.notion || "").slice(0, 80), niveau:clamp(+x.niveau || 1, 1, 3), enonce:String(x.enonce).slice(0, 1200), explication:String(x.explication || "").slice(0, 1200)};
  if (t === "qcm"){ q.choix = (x.choix || []).map(String).filter(Boolean).slice(0, 6); q.bonnes = [...new Set((x.bonnes || []).map(Number))].filter(n => n >= 0 && n < q.choix.length); if (q.choix.length < 2 || !q.bonnes.length) return null; }
  if (t === "vf") q.bonne = x.bonne === true || x.bonne === "true" || x.bonne === "vrai";
  if (t === "num"){ q.reponse = Number(String(x.reponse).replace(",", ".")); if (!isFinite(q.reponse)) return null; q.tolerance = Math.abs(Number(x.tolerance) || 0); q.unite = String(x.unite || "").slice(0, 20); }
  if (t === "trou"){ q.reponses = (Array.isArray(x.reponses) ? x.reponses : [x.reponses]).map(String).filter(Boolean).slice(0, 6); if (!q.reponses.length) return null; }
  if (t === "redige"){ q.corrige = String(x.corrige || ""); q.criteres = String(x.criteres || ""); }
  return q;
}
function quizPrompt(co, o, n, deja){
  return `Tu es professeur de ${o.matiere} (niveau ${o.niveau}) en France. À partir du COURS ci-dessous, crée une banque de ${n} questions d'entraînement pour un quiz en ligne que les élèves refont plusieurs fois.
Règles :
- Couvre toutes les notions importantes du cours ; indique pour chaque question la notion (2 à 5 mots, réutilise exactement le même libellé pour une même notion).
- Mélange les niveaux : 1 = découverte, 2 = application, 3 = défi (environ 40 % / 40 % / 20 %).
- Types autorisés uniquement : ${o.types.map(t => QTYPES[t]).join(", ")}.
- Pas de LaTeX : écris les maths avec des symboles simples (x², √, ½, ×, ÷, ≤).
- Chaque question a une explication courte (1 à 3 phrases) montrée à l'élève après sa réponse.
- Réponses sans ambiguïté : une réponse numérique a une seule valeur ; un texte à trous a un trou marqué ___ et une liste de réponses acceptées (variantes d'orthographe incluses).
${o.consignes ? "Consignes du professeur : " + o.consignes + "\n" : ""}${deja ? "IMPORTANT : questions NOUVELLES, différentes de celles-ci : " + deja + "\n" : ""}${NOSRC}

COURS :
"""${(co?.texte || "").slice(0, 30000)}"""

Réponds uniquement en JSON : {"titre":"…","questions":[
 {"type":"qcm","notion":"…","niveau":1,"enonce":"…","choix":["…","…","…"],"bonnes":[0],"explication":"…"},
 {"type":"vf","notion":"…","niveau":1,"enonce":"…","bonne":true,"explication":"…"},
 {"type":"num","notion":"…","niveau":2,"enonce":"…","reponse":12.5,"tolerance":0,"unite":"cm","explication":"…"},
 {"type":"trou","notion":"…","niveau":1,"enonce":"Le ___ est …","reponses":["mot","variante"],"explication":"…"},
 {"type":"redige","notion":"…","niveau":3,"enonce":"…","corrige":"…","criteres":"…","explication":"…"}]}`;
}
async function genQuizQuestions(co, o, n, existing){
  const out = []; let titre = "";
  while (out.length < n){
    const k = Math.min(25, n - out.length), deja = [...(existing || []), ...out].map(q => q.enonce).join(" / ").slice(0, 6000);
    const r = await ai(quizPrompt(co, o, k, deja), {feature:"exercices"});
    const qs = (r?.questions || []).map(mapQuizQ).filter(Boolean).filter(q => o.types.includes(q.type));
    if (!qs.length) { if (!out.length) throw {code:"invalid_json"}; break; }
    titre = titre || r.titre || ""; out.push(...qs);
    if (qs.length < k / 2) break;
  }
  return {titre, questions:out.slice(0, n)};
}

function quizResults(q, cl, notions){
  const studs = cl?.eleves || [], R = Object.fromEntries(repsOf(q.id).map(r => [r.eleveId, r]));
  if (q.statut === "brouillon") return `<section class="panel empty">Publie le quiz pour que les élèves puissent s'entraîner.</section>`;
  const rows = studs.map(e => { const r = R[e.id] || {}; const t = r.tentatives || []; const acq = notions.filter(n => r.notions?.[n]?.acquis).length;
    return {e, r, t:t.length, vues:r.vues || 0, taux:r.vues ? (r.ok || 0) / r.vues : null, acq, temps:t.reduce((s, x) => s + (x.dureeS || 0), 0), der:r.derniere}; });
  const sel = rows.find(x => x.e.id === S.qz.el);
  const qStats = (q.questions || []).map(x => { let v = 0, ok = 0; Object.values(R).forEach(r => { const s = r.q?.[x.id]; if (s){ v += s.v; ok += s.ok; } }); return {x, v, rate:v ? ok / v : null}; }).filter(s => s.v >= 2 && s.x.type !== "redige").sort((a, b) => a.rate - b.rate).slice(0, 6);
  const red = []; Object.values(R).forEach(r => (r.redigees || []).forEach((a, i) => { if (a.note == null){ const x = (q.questions || []).find(y => y.id === a.qid); if (x) red.push({r, a, i, x, e:studs.find(s => s.id === r.eleveId)}); } }));
  const tone = v => v == null ? "none" : v >= .7 ? "ok" : v >= .5 ? "warn" : "bad";
  return `<section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Élève</th><th class="c">Tentatives</th><th class="c">Questions vues</th><th class="c">Réussite</th><th class="c">Notions acquises</th><th class="c">Temps</th><th>Dernière activité</th></tr></thead><tbody>
    ${rows.map(x => `<tr class="clickable" data-qzel="${x.e.id}"${S.qz.el === x.e.id ? ' style="background:var(--surface-2)"' : ""}><td><b>${esc(x.e.prenom)} ${esc(x.e.nom)}</b></td><td class="c num">${x.t}</td><td class="c num">${x.vues}</td>
      <td class="c"><span class="cell ${tone(x.taux)}">${x.taux == null ? "—" : Math.round(x.taux * 100) + " %"}</span></td><td class="c num">${x.acq}/${notions.length}</td><td class="c num">${x.t ? dur(x.temps) : "—"}</td><td class="small muted">${x.der ? esc(new Date(x.der).toLocaleString("fr-FR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})) : "pas encore commencé"}</td></tr>`).join("")}
    </tbody></table></div></section>
  ${sel ? `<section class="panel grid"><div class="row between"><h3>${esc(sel.e.prenom)} ${esc(sel.e.nom)}</h3><span class="small muted">${sel.t} tentative(s) · ${sel.vues} question(s) · ${sel.t ? dur(sel.temps) : ""}</span></div>
    <div class="row">${notions.map(n => { const s = sel.r.notions?.[n]; const st = !s ? ["Pas vue", ""] : s.acquis ? ["Acquis", "ok"] : s.ok ? ["En cours", "warn"] : ["À revoir", "bad"]; return `<span class="chip ${st[1]}" title="${s ? s.ok + " bonne(s) sur " + s.vus : ""}">${esc(n)} · ${st[0]}</span>`; }).join("")}</div>
    ${(sel.r.tentatives || []).length ? `<div class="small muted">${sel.r.tentatives.slice(-8).map(t => `${esc(new Date(t.at).toLocaleDateString("fr-FR"))} : ${t.ok}/${t.auto}${t.n > t.auto ? " + " + (t.n - t.auto) + " rédigée(s)" : ""} en ${dur(t.dureeS)}`).join(" · ")}</div>` : ""}</section>` : ""}
  ${qStats.length ? `<section class="panel"><h3>Questions les plus ratées</h3><div style="margin-top:6px">${qStats.map(s => `<div class="item"><div><div class="t small">${esc(s.x.enonce.slice(0, 140))}</div><div class="s">${esc(s.x.notion || "")} · vue ${s.v} fois</div></div><span class="cell ${tone(s.rate)}">${Math.round(s.rate * 100)} %</span></div>`).join("")}</div></section>` : ""}
  ${red.length ? `<section class="panel grid"><div class="row between"><h3>Réponses rédigées à corriger (${red.length})</h3><button class="btn sm primary" id="qz-redai">Corriger avec l'IA</button></div><div class="status" id="qz-redst"></div>
    ${red.slice(0, 40).map(o => `<div class="item" style="align-items:start"><div style="display:grid;gap:4px"><div class="small muted">${esc(o.e ? o.e.prenom + " " + o.e.nom : "?")} · ${esc(o.x.notion || "")}</div><div class="t small">${esc(o.x.enonce)}</div>
      <div class="answer">${esc(o.a.rep)}</div>${o.x.corrige ? `<div class="small muted">Corrigé : ${esc(o.x.corrige)}</div>` : ""}</div>
      <div class="row" style="flex:none"><button class="btn sm" data-rednote="${o.r.eleveId}|${o.i}|1">✓ Juste</button><button class="btn sm" data-rednote="${o.r.eleveId}|${o.i}|0">✗ À revoir</button></div></div>`).join("")}</section>` : ""}`;
}

/* ---------- Suivi : exercices dans le suivi de la classe ---------- */
function quizSuivi(){
  const cl = classe(S.su?.cl); if (!cl) return "";
  const qs = myQuizzes().filter(q => q.classeId === cl.id && q.statut !== "brouillon" && (!S.su.mat || q.matiere === S.su.mat));
  if (!qs.length) return "";
  const studs = cl.eleves || [];
  const agg = e => { let t = 0, v = 0, ok = 0, acq = 0, nn = 0, der = ""; qs.forEach(q => { const r = store.quizrep["" + q.id + "_" + e.id] || repsOf(q.id).find(x => x.eleveId === e.id) || {}; const ns = quizNotions(q); t += (r.tentatives || []).length; v += r.vues || 0; ok += r.ok || 0; nn += ns.length; acq += ns.filter(n => r.notions?.[n]?.acquis).length; if ((r.derniere || "") > der) der = r.derniere; }); return {t, v, rate:v ? ok / v : null, acq, nn, der}; };
  const tone = v => v == null ? "none" : v >= .7 ? "ok" : v >= .5 ? "warn" : "bad";
  const e = studs.find(x => x.id === S.su.el);
  return `<section class="panel"><div class="row between"><h3>Exercices en ligne${S.su.mat ? " · " + esc(S.su.mat) : ""}</h3><span class="small muted">${qs.length} quiz</span></div>
    <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Élève</th><th class="c">Tentatives</th><th class="c">Questions</th><th class="c">Réussite</th><th class="c">Notions acquises</th><th>Dernière activité</th></tr></thead><tbody>
    ${studs.map(s => { const a = agg(s); return `<tr${e && e.id === s.id ? ' style="background:var(--surface-2)"' : ""}><td><b>${esc(s.prenom)} ${esc(s.nom)}</b></td><td class="c num">${a.t}</td><td class="c num">${a.v}</td><td class="c"><span class="cell ${tone(a.rate)}">${a.rate == null ? "—" : Math.round(a.rate * 100) + " %"}</span></td><td class="c num">${a.acq}/${a.nn}</td><td class="small muted">${a.der ? esc(new Date(a.der).toLocaleDateString("fr-FR")) : "—"}</td></tr>`; }).join("")}
    </tbody></table></div>
    ${e ? `<div style="margin-top:12px"><div class="label" style="margin-bottom:6px">${esc(e.prenom)} · détail par quiz</div>${qs.map(q => { const r = repsOf(q.id).find(x => x.eleveId === e.id) || {}; const ns = quizNotions(q); return `<div class="item"><div><a class="t small" style="color:inherit" href="#/exercices/${q.id}/resultats">${esc(q.titre)}</a><div class="s">${(r.tentatives || []).length} tentative(s) · ${r.vues || 0} question(s) · ${ns.filter(n => r.notions?.[n]?.acquis).length}/${ns.length} notions acquises</div></div><span class="cell ${tone(r.vues ? (r.ok || 0) / r.vues : null)}">${r.vues ? Math.round((r.ok || 0) / r.vues * 100) + " %" : "—"}</span></div>`; }).join("")}</div>` : ""}</section>`;
}

/* ---------- Codes élèves (Classes) ---------- */
const CODE_ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode = () => { let s = ""; for (const b of crypto.getRandomValues(new Uint8Array(6))) s += CODE_ALPHA[b % CODE_ALPHA.length]; return s; };
function codesPanel(cl){
  if (!cl || !window.TIKOUN_CONFIG?.accounts) return "";
  const n = (cl.eleves || []).filter(e => e.code).length, tot = (cl.eleves || []).length;
  return `<section class="panel grid" style="gap:10px"><div class="row between"><div><h3>Codes élèves</h3><p class="small muted">Pour les exercices en ligne : chaque élève se connecte sur <b>${esc(location.origin)}/eleve</b> avec son code personnel (sans e-mail).</p></div>
    <div class="row"><button class="btn sm" id="codes-gen">${n < tot ? "Générer les codes manquants" : "Codes à jour"}</button>${n ? `<button class="btn sm primary" id="codes-print">Imprimer les cartes</button>` : ""}</div></div>
    ${n ? `<div class="row">${(cl.eleves || []).map(e => `<span class="chip">${esc(e.prenom)} ${esc((e.nom || "").slice(0, 1))}. · <b class="num">${esc(e.code || "—")}</b>${e.code ? ` <button class="btn sm ghost" style="padding:0 4px" data-recode="${e.id}" title="Nouveau code">↻</button>` : ""}</span>`).join("")}</div>` : ""}</section>`;
}
function printCards(cl){
  const url = location.origin + "/eleve?c=";
  const card = e => { let svg = ""; try { const qr = qrcode(0, "M"); qr.addData(url + e.code); qr.make(); svg = qr.createSvgTag({cellSize:3, margin:0}); } catch(err){}
    return `<div class="c"><div class="h"><b>Mastery</b><span>${esc(cl.nom)}</span></div><div class="n">${esc(e.prenom)} ${esc(e.nom)}</div><div class="b"><div>${svg}</div><div><div class="l">Ton code</div><div class="k">${esc(e.code)}</div><div class="u">${esc(location.host)}/eleve</div></div></div></div>`; };
  const w = window.open("", "_blank"); if (!w) return toast("Autorise les fenêtres pour imprimer les cartes.");
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Cartes élèves · ${esc(cl.nom)}</title><style>
    body{font-family:Inter,Arial,sans-serif;margin:0;padding:10mm;color:#15233F}.g{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
    .c{border:1px solid #cfc8b8;border-radius:4mm;padding:5mm;break-inside:avoid;display:grid;gap:3mm}.h{display:flex;justify-content:space-between;font-size:11pt}.h b{font-family:Georgia,serif}
    .n{font-size:14pt;font-weight:700}.b{display:flex;gap:5mm;align-items:center}.b svg{width:28mm;height:28mm}.l{font-size:9pt;color:#6b6758;text-transform:uppercase;letter-spacing:.1em}.k{font-size:22pt;font-weight:700;letter-spacing:.12em;font-family:monospace}.u{font-size:9pt;color:#6b6758}
    @media print{body{padding:6mm}}</style></head><body><div class="g">${(cl.eleves || []).filter(e => e.code).map(card).join("")}</div><script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ---------- Événements ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,[data-qzel]"); if (!t) return; const d = t.dataset;
  try {
    if (d.qzel){ S.qz.el = S.qz.el === d.qzel ? null : d.qzel; return render(); }
    if (t.id === "qn-import"){ S.params.kind = "quiz"; S.wizStep = 1; return go("new"); }
    if (t.id === "qn-go"){ const o = S.qn, co = store.cours.find(c => c.id === o.coursId), cl = classe(o.classeId), st = $("#qn-st");
      if (!o.types.length) return toast("Choisis au moins un type de question.");
      t.disabled = true; st.innerHTML = `<span class="thinking">L'IA prépare ${o.banque} questions (1 à 2 minutes)…</span>`;
      try { const auto = o.types.filter(x => x !== "redige"); const g = await genQuizQuestions(co, {matiere:co.matiere, niveau:co.niveau, types:o.types, consignes:o.consignes}, +o.banque);
        const id = uid(12); await write("quizzes/" + id, {titre:o.titre || g.titre || "Quiz · " + co.titre, matiere:co.matiere, niveau:co.niveau, classeId:cl.id, coursId:co.id, statut:"brouillon", parTentative:+o.parTentative, fermeture:o.fermeture || "", redige:o.types.includes("redige"), types:o.types, consignes:o.consignes || "", questions:g.questions, createdAt:new Date().toISOString()});
        S.qn.titre = ""; S.qz = {id, tab:"questions", el:null}; location.hash = `#/exercices/${id}/questions`; void auto; }
      catch(e){ st.textContent = aiErr(e?.code); t.disabled = false; } return; }
    const q = S.view === "quiz" ? quizOf(S.qz.id) : null;
    if (q){
      if (d.qzstat){ if (d.qzstat === "ouvert" && !(q.questions || []).length) return toast("Ajoute des questions avant de publier."); q.statut = d.qzstat; await write("quizzes/" + q.id, q); toast(d.qzstat === "ouvert" ? "Quiz ouvert : les élèves le voient avec leur code." : "Quiz clos."); return; }
      if (t.id === "qz-del"){ if (!confirm("Supprimer ce quiz et les résultats des élèves ?")) return; for (const r of repsOf(q.id)) await write("quizrep/" + q.id + "_" + r.eleveId, null, "delete"); await write("quizzes/" + q.id, null, "delete"); location.hash = "#/exercices"; return; }
      if (d.qqdel){ q.questions = q.questions.filter(x => x.id !== d.qqdel); await write("quizzes/" + q.id, q); return; }
      if (t.id === "qz-more" || t.id === "qz-regen"){ const co = store.cours.find(c => c.id === q.coursId); if (!co) return toast("Cours d'origine introuvable.");
        if (t.id === "qz-regen" && !confirm("Remplacer toutes les questions par une nouvelle banque ? Les résultats déjà obtenus restent.")) return;
        const st = $("#qz-st"); t.disabled = true; st.innerHTML = `<span class="thinking">L'IA prépare de nouvelles questions…</span>`;
        try { const n = t.id === "qz-more" ? 10 : (q.questions || []).length || 30; const g = await genQuizQuestions(co, {matiere:q.matiere, niveau:q.niveau, types:q.types || ["qcm","vf","num","trou"], consignes:q.consignes}, n, (q.questions || []).map(x => x.enonce));
          q.questions = t.id === "qz-more" ? [...(q.questions || []), ...g.questions] : g.questions; await write("quizzes/" + q.id, q); toast(g.questions.length + " nouvelle(s) question(s)."); }
        catch(e){ st.textContent = aiErr(e?.code); t.disabled = false; } return; }
      if (d.rednote){ const [eid, i, v] = d.rednote.split("|"); const k = "quizrep/" + q.id + "_" + eid, r = store.quizrep[q.id + "_" + eid]; if (!r) return;
        const red = structuredClone(r.redigees || []); if (red[+i]) red[+i].note = +v; await write(k, {redigees:red}, "update"); return; }
      if (t.id === "qz-redai"){ const st = $("#qz-redst"); const items = []; repsOf(q.id).forEach(r => (r.redigees || []).forEach((a, i) => { const x = (q.questions || []).find(y => y.id === a.qid); if (a.note == null && x) items.push({r, i, x, a}); }));
        if (!items.length) return; t.disabled = true; st.innerHTML = `<span class="thinking">Correction de ${Math.min(items.length, 30)} réponse(s)…</span>`;
        try { const batch = items.slice(0, 30);
          const res = await ai(`Tu corriges des réponses rédigées d'élèves (${q.matiere}, ${q.niveau}) à un quiz d'entraînement. Sois juste et bienveillant ; une réponse vide ou « je ne sais pas » est fausse.
${batch.map((o, k) => `#${k}\nQuestion : ${o.x.enonce}\nCorrigé : ${o.x.corrige || ""}\nCritères : ${o.x.criteres || ""}\nRéponse de l'élève : ${o.a.rep}`).join("\n\n")}
Réponds uniquement en JSON : {"notes":[{"k":0,"juste":true,"commentaire":"…"}]}`, {feature:"exercices", modelTier:"quick"});
          const byDoc = {}; (res?.notes || []).forEach(n => { const o = batch[+n.k]; if (!o) return; const key = q.id + "_" + o.r.eleveId; byDoc[key] = byDoc[key] || structuredClone(o.r.redigees || []); byDoc[key][o.i] = {...byDoc[key][o.i], note:n.juste ? 1 : 0, commentaire:String(n.commentaire || "")}; });
          for (const [key, red] of Object.entries(byDoc)) await write("quizrep/" + key, {redigees:red}, "update");
          st.textContent = Object.keys(byDoc).length ? "Corrections enregistrées : vérifie-les si besoin." : "Aucune correction reçue."; }
        catch(e){ st.textContent = aiErr(e?.code); } t.disabled = false; return; }
    }
    if (t.id === "codes-gen" || d.recode){ const cl = classe(S.classeSel) || store.classes[0]; if (!cl) return; const c = structuredClone(cl); delete c.id;
      c.eleves = (c.eleves || []).map(e => (d.recode ? e.id === d.recode : !e.code) ? {...e, code:newCode()} : e); await write("classes/" + cl.id, c); toast(d.recode ? "Nouveau code généré (l'ancien ne marche plus)." : "Codes générés."); return; }
    if (t.id === "codes-print"){ const cl = classe(S.classeSel) || store.classes[0]; if (cl) printCards(cl); return; }
  } catch(e){ console.error(e); toast(e?.message || "Erreur."); }
});
document.addEventListener("change", async ev => {
  const el = ev.target, d = el.dataset;
  if (d.qn){ S.qn[d.qn] = el.value; if (d.qn === "coursId") S.qn.classeId = ""; if (["coursId","classeId"].includes(d.qn)) render(); return; }
  if (d.qtype){ const s = new Set(S.qn.types); el.checked ? s.add(d.qtype) : s.delete(d.qtype); S.qn.types = [...s]; return; }
  const q = S.view === "quiz" ? quizOf(S.qz.id) : null; if (!q) return;
  if (d.qzf){ q[d.qzf] = el.type === "checkbox" ? el.checked : d.qzf === "parTentative" ? +el.value : el.value; await write("quizzes/" + q.id, q); return; }
  if (d.qqf){ const x = (q.questions || []).find(y => y.id === d.qqf); if (!x) return; const v = el.value, k = d.k;
    if (k === "choix"){ const lines = v.split("\n").map(s => s.trim()).filter(Boolean); x.choix = lines.map(s => s.replace(/^\*\s*/, "")); x.bonnes = lines.map((s, i) => s.startsWith("*") ? i : -1).filter(i => i >= 0); if (!x.bonnes.length) toast("Marque au moins une bonne réponse avec *."); }
    else if (k === "bonne") x.bonne = v === "true";
    else if (k === "reponse" || k === "tolerance"){ const n = Number(v.replace(",", ".")); if (!isFinite(n)) return toast("Nombre invalide."); x[k] = n; }
    else if (k === "reponses") x.reponses = v.split("|").map(s => s.trim()).filter(Boolean);
    else if (k === "niveau") x.niveau = +v;
    else x[k] = v;
    await write("quizzes/" + q.id, q); }
});

/* ================= Boot ================= */
applyRoute(); render();
(async () => {
  if (!window.claude?.use){
    STANDALONE = true; $("#tabReglages").hidden = false;
    AI = apiSample(); DL = localDownloads; LIM = await AI.limits();
    if (cloudOn()){
      const c = cloudCfg(); SB = supabase.createClient(c.url, c.anon);
      const {data} = await SB.auth.getSession(); SB_USER = data?.session?.user || null;
      SB.auth.onAuthStateChange((ev, sess) => { if (!SB_USER && sess?.user){ SB_USER = sess.user; startCloud(); } });
      if (SB_USER) await startCloud(); else { refreshCaps(); render(); }
      return;
    }
    if (window.TIKOUN_CONFIG?.accounts){ await bootAccounts(); return; }
    if (window.TIKOUN_CONFIG?.storage === "server"){
      const ok = await fetch("/api/check", {credentials:"same-origin", headers:{"x-tikoun-code":accessCode()}}).then(r => r.ok).catch(() => false);
      if (ok) await startServer(); else { NEED_CODE = true; refreshCaps(); render(); }
      return;
    }
    try { DB = await localDB(); ASSETS = await localAssets(); } catch(e){ console.warn(e); DB = memDB(); LOCAL = true; }
    NEED_CODE = !!(window.TIKOUN_CONFIG?.codeRequired && !accessCode());
    refreshCaps(); render();
  } else {
    const use = n => window.claude.use(n).catch(() => null);
    [DB, AI, ASSETS, DL] = await Promise.all([use("db"), use("sample"), use("assets"), use("downloads")]);
    if (AI) LIM = await AI.limits().catch(() => null);
    if (!DB){ DB = memDB(); LOCAL = true; }
    $("#caps").innerHTML = [["IA", AI], ["Photos IA", LIM?.images], ["Sauvegarde", !LOCAL], ["Scans stockés", ASSETS], ["PDF", DL]].map(([l, v]) => `${l} ${v ? "✓" : "✗"}`).join(" · ");
  }
  for (const col of ["classes","cours","controles"]){
    DB.collection(col).onSnapshot(s => { store[col] = s.docs.map(x => ({id:x.id, ...structuredClone(x.data())})); scheduleRender(); }, e => toast("Lecture impossible : " + (e?.code || "")));
  }
  for (const col of ["ecritures","bilans"]) DB.collection(col).onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store[col] = m; scheduleRender(); }, e => console.warn(e));
  DB.collection("feuilles").onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store.feuilles = m; scheduleRender(); }, e => console.warn(e));
})();
