<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mastery · Student portal</title>
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#15233F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
:root{--paper:#FAF8F3;--surface:#fff;--surface-2:#F3EFE6;--ink:#15233F;--muted:#6B6758;--line:#E7E1D4;--gold:#B7862B;--gold-soft:#F7EDD8;--ok:#1E7A4C;--ok-soft:#E3F3EA;--bad:#B42318;--bad-soft:#FCE8E6;--display:"Cormorant Garamond",Georgia,serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#10141D;--surface:#171C27;--surface-2:#1F2532;--ink:#EFEADF;--muted:#A7A192;--line:#2C3342;--gold:#D9AE58;--gold-soft:#3A3120;--ok:#4FC98D;--ok-soft:#15301F;--bad:#FF7A6E;--bad-soft:#3A1C1A}.wm{filter:brightness(0) invert(.92)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:8px}.brand .mk{height:30px}.brand .wm{height:19px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(21,35,63,.04),0 10px 30px -18px rgba(21,35,63,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:48px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);min-height:auto;padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.opt[disabled]{opacity:1;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%}
textarea{min-height:160px;resize:vertical}
.code{font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.muted{color:var(--muted)}.small{font-size:14px}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.q{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.enonce{font-size:19px;line-height:1.45;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{text-align:left;justify-content:flex-start;font-weight:500;padding:14px 16px}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}.opt.badc{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.ko{background:var(--bad-soft);color:var(--bad)}.fb.neutral{background:var(--gold-soft);color:var(--ink)}
.fb p{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:grid;gap:12px}
.qz{display:grid;gap:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.big{font-family:var(--display);font-size:44px;font-weight:500}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.hello{display:grid;gap:4px}
h1{font-size:1.15em}.big{font-size:54px}h2{font-size:26px!important}
h1,h2,h3,.big,.price{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
</style>
</head>
<body>
<header class="top"><div class="brand"><img class="mk" src="/logo-mark.png" alt=""><img class="wm" src="/logo-word.png" alt="Mastery"></div><div class="row"><div id="who" class="small muted"></div><a class="small muted" style="text-decoration:none" href="?lang=fr" hreflang="fr">FR</a></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
const ORDI = matchMedia("(pointer:fine)").matches && innerWidth >= 900;
let ME = null, RUN = null;
async function api(p, body){
  const r = await fetch(p, {method:body ? "POST" : "GET", credentials:"same-origin", headers:{"content-type":"application/json"}, body:body ? JSON.stringify(body) : undefined});
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) throw {status:r.status, message:j?.error?.message || "Error " + r.status};
  return j;
}
function vLogin(prefill, err){
  $("#who").textContent = "";
  app.innerHTML = `<section class="card" style="display:grid;gap:16px;max-width:440px;margin:6vh auto 0;width:100%">
    <div class="hello"><div class="label">Student portal</div><h1 style="font-size:30px">Welcome</h1><p class="muted">Enter the personal code written on your card.</p></div>
    <input id="code" class="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(prefill || "")}" aria-label="Your code">
    <button class="btn primary" id="go">Enter</button><div class="err" id="err">${esc(err || "")}</div></section>`;
  $("#code").focus();
  const go = async () => { $("#go").disabled = true; try { await api("/api/eleve/login", {code:$("#code").value}); history.replaceState(null, "", "/eleve"); home(); } catch(e){ $("#err").textContent = e.message; $("#go").disabled = false; } };
  $("#go").onclick = go; $("#code").onkeydown = e => { if (e.key === "Enter") go(); };
}
async function home(){
  try { ME = await api("/api/eleve/me"); } catch(e){ return vLogin("", e.status === 401 ? "" : e.message); }
  $("#who").innerHTML = `${esc(ME.eleve.prenom)} · ${esc(ME.eleve.classe)} · <button class="btn ghost small" id="out">Exit</button>`;
  $("#out").onclick = async () => { await api("/api/eleve/logout", {}); vLogin(); };
  const q = ME.quizzes;
  app.innerHTML = `<div class="hello"><div class="label">${esc(new Date().toLocaleDateString("en-US", {weekday:"long", day:"numeric", month:"long"}))}</div><h1 style="font-size:32px">Good morning ${esc(ME.eleve.prenom)}</h1><p class="muted">Practice as much as you want: the questions change every time.</p></div>
  <div class="list">${q.length ? q.map(x => `<section class="card qz"><div class="row" style="justify-content:space-between"><div><div class="small muted">${esc(x.matiere)}${x.fermeture ? " · until " + esc(new Date(x.fermeture + "T12:00").toLocaleDateString("en-US", {day:"numeric", month:"long"})) : ""}</div><h2 style="font-size:22px">${esc(x.titre)}</h2></div>${x.nbNotions && x.acquises === x.nbNotions ? '<span class="chip ok">All mastered ✓</span>' : ""}</div>
      <div class="bar" aria-label="Skills mastered"><i style="width:${x.nbNotions ? Math.round(x.acquises / x.nbNotions * 100) : 0}%"></i></div>
      <div class="row" style="justify-content:space-between"><span class="small muted">${x.acquises}/${x.nbNotions} skills mastered · ${x.tentatives} tentative(s)</span>${x.ouvert ? `<button class="btn ${x.tentatives ? "" : "gold"}" data-play="${esc(x.id)}">${x.tentatives ? "Start over" : "Start"}</button>` : `<span class="chip">Closed</span>`}</div></section>`).join("") : `<section class="card"><p class="muted">No practice yet. Your teacher will assign some soon.</p></section>`}</div>`;
  app.querySelectorAll("[data-play]").forEach(b => b.onclick = () => play(b.dataset.play));
}
async function play(id){
  app.innerHTML = `<section class="card"><p class="muted">Preparing your questions…</p></section>`;
  try { const t = await api(`/api/eleve/quiz/${id}/tirage`, {ordinateur:ORDI}); RUN = {id, tirage:t.tirage, titre:t.titre, qs:t.questions, i:0, ok:0, auto:0, answered:false, t0:Date.now()}; show(); }
  catch(e){ app.innerHTML = `<section class="card"><p>${esc(e.message)}</p><button class="btn" id="back">Back</button></section>`; $("#back").onclick = home; }
}
function show(){
  const R = RUN, q = R.qs[R.i]; R.answered = false; R.sel = new Set(); R.t0 = Date.now();
  const pct = Math.round(R.i / R.qs.length * 100);
  let input = "";
  if (q.type === "qcm") input = `<div class="opts">${q.choix.map((c, k) => `<button class="btn opt" data-k="${k}">${esc(c)}</button>`).join("")}</div>${q.multi ? `<p class="small muted">Several correct answers are possible.</p><button class="btn primary" id="val">Submit</button>` : ""}`;
  if (q.type === "vf") input = `<div class="opts" style="grid-template-columns:1fr 1fr"><button class="btn opt" data-vf="true">True</button><button class="btn opt" data-vf="false">False</button></div>`;
  if (q.type === "num") input = `<div class="row" style="flex-wrap:nowrap"><input id="rep" inputmode="decimal" autocomplete="off" placeholder="Your answer">${q.unite ? `<span class="muted">${esc(q.unite)}</span>` : ""}</div><button class="btn primary" id="val">Submit</button>`;
  if (q.type === "trou") input = `<input id="rep" autocomplete="off" autocapitalize="off" placeholder="The missing word"><button class="btn primary" id="val">Submit</button>`;
  if (q.type === "redige") input = `<textarea id="rep" placeholder="Write your answer"></textarea><button class="btn primary" id="val">Send</button>`;
  app.innerHTML = `<section class="card q"><div class="qhead"><span>Question ${R.i + 1} / ${R.qs.length}</span><span>${esc(q.notion || "")} · ${"★".repeat(q.niveau || 1)}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="enonce">${esc(q.enonce)}</div>${input}<div id="fb"></div></section>
    <button class="btn ghost" id="quit">← Stop and return to my practice</button>`;
  $("#quit").onclick = () => { if (confirm("Stop this attempt?")) finish(); };
  const send = rep => answer(q, rep);
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if (R.answered) return; const k = +b.dataset.k; if (q.multi){ R.sel.has(k) ? R.sel.delete(k) : R.sel.add(k); b.classList.toggle("sel"); } else { b.classList.add("sel"); send([k]); } });
  app.querySelectorAll("[data-vf]").forEach(b => b.onclick = () => { if (R.answered) return; b.classList.add("sel"); send(b.dataset.vf === "true"); });
  const val = $("#val"); if (val) val.onclick = () => { if (R.answered) return; if (q.type === "qcm") return R.sel.size ? send([...R.sel]) : null; const v = $("#rep").value.trim(); if (!v) return $("#rep").focus(); send(v); };
  const rep = $("#rep"); if (rep && q.type !== "redige"){ rep.focus(); rep.onkeydown = e => { if (e.key === "Enter") val.click(); }; }
}
async function answer(q, rep){
  const R = RUN; R.answered = true; app.querySelectorAll(".opt,#val,#rep").forEach(x => x.disabled = true);
  let r; try { r = await api(`/api/eleve/quiz/${R.id}/reponse`, {tirage:R.tirage, qid:q.id, rep, ms:Date.now() - R.t0}); } catch(e){ $("#fb").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  if (r.ok !== null){ R.auto++; if (r.ok) R.ok++; }
  if (q.type === "qcm") app.querySelectorAll("[data-k]").forEach(b => { const k = +b.dataset.k; if ((r.bonne || []).includes(k)) b.classList.add("good"); else if (b.classList.contains("sel")) b.classList.add("badc"); });
  if (q.type === "vf") app.querySelectorAll("[data-vf]").forEach(b => { if (String(r.bonne) === b.dataset.vf) b.classList.add("good"); else if (b.classList.contains("sel")) b.classList.add("badc"); });
  if (r.next) R.qs.splice(R.i + 1, 0, r.next);
  const last = R.i >= R.qs.length - 1;
  const good = r.ok === true, neutral = r.ok === null;
  const shown = q.type === "num" || q.type === "trou" ? `<p><b>Expected answer:</b> ${esc(r.bonne)}</p>` : "";
  $("#fb").innerHTML = `<div class="fb ${neutral ? "neutral" : good ? "ok" : "ko"}"><b>${neutral ? "Answer sent to your teacher." : good ? (r.acquis ? "Well done! Skill mastered ✓" : "Well done!") : "Not quite."}</b>${!good && !neutral ? shown : ""}${r.explication ? `<p>${esc(r.explication)}</p>` : ""}${r.next ? `<p class="small">Another question on the same skill awaits you.</p>` : ""}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" id="nx">${last ? "See my result" : "Next question →"}</button></div>`;
  $("#nx").focus(); $("#nx").onclick = () => { if (last) finish(); else { R.i++; show(); } };
}
async function finish(){
  const R = RUN; let r = {ok:R.ok, total:R.auto};
  try { r = await api(`/api/eleve/quiz/${R.id}/fin`, {tirage:R.tirage}); } catch(e){}
  app.innerHTML = `<section class="card" style="display:grid;gap:14px;text-align:center"><div class="label">${esc(R.titre)}</div><div class="big">${r.ok} / ${r.total}</div>
    <p class="muted">correct answers${r.redigees ? ` · ${r.redigees} written answer(s) sent to your teacher` : ""}</p>
    ${r.nbNotions ? `<div class="bar"><i style="width:${Math.round(r.acquises / r.nbNotions * 100)}%"></i></div><p class="small muted">${r.acquises}/${r.nbNotions} skills mastered</p>` : ""}
    <div class="row" style="justify-content:center"><button class="btn gold" id="again">Start over with different questions</button><button class="btn" id="home">My practice</button></div></section>`;
  $("#again").onclick = () => play(R.id); $("#home").onclick = home;
}
const pre = new URLSearchParams(location.search).get("c");
if (pre) (async () => { try { await api("/api/eleve/login", {code:pre}); history.replaceState(null, "", "/eleve"); home(); } catch(e){ vLogin(pre, e.message); } })();
else home();
</script>
</body>
</html>
