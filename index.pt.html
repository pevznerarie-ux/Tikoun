<script>/* Apparence choisie par chacun : clair, sombre, ou automatique (sombre de 20 h à 7 h) */
window.themePref = () => { try { return localStorage.getItem("mastery.theme") || "clair"; } catch(e){ return "clair"; } };
window.applyTheme = () => { const p = themePref(), h = new Date().getHours(), dark = p === "sombre" || (p === "auto" && (h >= 20 || h < 7));
  document.documentElement.dataset.theme = dark ? "dark" : "light"; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = dark ? "#14110F" : "#FFFFFF"; };
applyTheme(); setInterval(applyTheme, 60000);</script>

/* ===== Premium layer ===== */
:root{--r:16px;--gold-2:#E2B865;--shadow:0 1px 2px rgba(21,35,63,.04),0 10px 30px -14px rgba(21,35,63,.16);--hero:#13203B}

.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}

}

  --ok:#47CD89; --ok-soft:#10301F; --warn:#F5B44A; --warn-soft:#33260F; --bad:#FF7A70; --bad-soft:#3A1C1A; --pen:#FF7A70; --pen-soft:#3A1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -10px rgba(0,0,0,.6); --hero:#A94F2A}}

  --blue:#E08A63; --blue-2:#EBA07E; --blue-soft:#3A2219; --on-blue:#14110F; --gold:#E08A63; --gold-soft:#3A2219;
  --ok:#47CD89; --ok-soft:#10301F; --warn:#F5B44A; --warn-soft:#33260F; --bad:#FF7A70; --bad-soft:#3A1C1A; --pen:#FF7A70; --pen-soft:#3A1C1A; --hero:#A94F2A}

/* Boutons */
.btn{border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}

.stepnav{border-top:0;padding-top:4px}
.seg{border-radius:12px}.seg button[aria-pressed="true"]{color:var(--blue)}
.vtab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.stu{border-radius:10px}.stu[aria-current="true"]{background:var(--blue-soft);color:var(--blue)}
/* Accueil : carte blanche, la couleur seulement sur l'essentiel */
.hero-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero-card h2{font-family:var(--display);font-weight:700;letter-spacing:-.03em;color:var(--ink)}

.hero-card .btn.gold{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:none}

.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}.src{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.src b{font-size:15px}.src span{font-size:13px;color:var(--muted)}.src:hover{border-color:var(--blue)}.src.on{border:2px solid var(--blue);padding:13px 15px;background:color-mix(in srgb,var(--blue) 6%,var(--surface))}.src:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#fmic{position:fixed;z-index:60;width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}#fmic[hidden]{display:none}#fmic.on{background:var(--blue);color:#fff;border-color:var(--blue);animation:fmicPulse 1.2s ease-in-out infinite}@keyframes fmicPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 25%,transparent)}}
#view textarea,#view input[type=text],#view input:not([type]){padding-right:44px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tier>.btn:first-of-type{margin-top:auto}
.tier.best,.tier.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tier-p{font-size:22px;font-weight:700;letter-spacing:-.02em}
/* Menu du compte */
.brand{position:relative}
.umenu{position:relative}
.ubtn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;font-weight:600;max-width:52vw}
.ubtn:hover,.ubtn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--line)}
.ubtn .who{color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uav{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.uav[hidden]{display:none}
.uchev{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);flex:none}
.ubtn.dot .uav{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
.upop{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px -12px rgba(16,24,40,.25);padding:6px;display:grid;gap:2px;z-index:30}
.upop[hidden]{display:none}
.upop .tab{display:block;border-radius:9px;padding:9px 12px;color:var(--ink);font-weight:550}
.upop .tab[hidden]{display:none}
.upop .tab:hover{background:var(--surface-2)}
.upop .tab[aria-selected="true"]{background:var(--blue-soft);color:var(--blue)}
.upop-st{font-size:12.5px;color:var(--muted);padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px}
.upop-st:empty{display:none}.upop-st .warn{color:var(--warn);margin-top:2px}
@media (max-width:600px){.ubtn .who,.ubtn .uchev{display:none}.ubtn{padding:4px}.uav[hidden]{display:grid}.uav:empty::before{content:"";width:12px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}}
/* Tableaux, barres, liens */
th{font-size:11px;letter-spacing:.06em;font-weight:650}
.bar .track{border-radius:99px}.bar .fill{border-radius:99px}
.view a:not([class]),.view .small a,.view p a{color:var(--blue);text-decoration-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.banner{border-radius:12px}
.toast{border-radius:12px;background:#101828;color:#fff;box-shadow:0 12px 30px -10px rgba(16,24,40,.45)}
#jobs-pill{background:#101828}
.qchips .chip.cur{background:var(--blue);border-color:var(--blue)}
.score .qs.on{background:var(--blue);border-color:var(--blue)}
details>summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
.total{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:30px;line-height:1.1}.total small{font-size:16px;font-weight:600;opacity:.7}
@media (max-width:600px){.form-row[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
@media (max-width:600px){.item{flex-wrap:wrap}.item>.row{margin-left:auto}.hero-card .row>.btn{flex:1 1 auto}}
.topbar{display:flex;align-items:center;gap:10px;padding-block:8px!important}
.topbar .tabs{flex:1;min-width:0;padding-bottom:0!important}
.topbar .umenu{flex:none}
@media (max-width:700px){.ubtn .who,.ubtn .uchev{display:none}.ubtn{padding:3px}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper,#fff);transition:opacity .45s ease,visibility .45s}
#splash .logo{flex-direction:column;gap:14px;animation:splashIn .6s ease both}
#splash .logo .mk{height:84px}#splash .logo .wm{height:36px}
#splash.out{opacity:0;visibility:hidden}
@keyframes splashIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
.qdet{margin:4px 0 0 50px;display:grid;gap:6px;min-width:0}.qdet .chips{display:flex;flex-wrap:wrap;gap:6px}.qdet .chip{border-radius:10px;white-space:normal;max-width:100%;overflow-wrap:anywhere;height:auto;line-height:1.35;padding-block:3px;text-align:left}
.bars{gap:16px}
@media (max-width:600px){.qdet{margin-left:0}.bar{grid-template-columns:32px minmax(0,1fr) 44px;gap:8px}}
.tasks-chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.tasks-chip .tdot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:tdot 1s ease-in-out infinite}
@keyframes tdot{50%{opacity:.25}}
#ntf{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:min(520px,calc(100vw - 24px))}
.ntf{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper,#fff);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);font-size:14px;animation:ntfIn .25s ease both}
.ntf>span{flex:1;min-width:0}.ntf.bad{background:var(--bad)}
.ntf .ntf-x{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;font-size:18px;opacity:.75}.ntf .ntf-x:hover{opacity:1;background:rgba(255,255,255,.12)}
@keyframes ntfIn{from{opacity:0;transform:translateY(8px)}}

<script>
"use strict";
/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toString().replace(".", document.documentElement.lang === "en" ? "." : ",");
const pct = n => Math.round(n * 100) + (document.documentElement.lang === "en" ? "%" : " %");
const tone = r => r == null ? "none" : r >= 0.7 ? "ok" : r >= 0.5 ? "warn" : "bad";
const uid = (n = 10) => { const a = "abcdefghijkmnpqrstuvwxyz23456789"; let s = ""; const b = crypto.getRandomValues(new Uint8Array(n)); for (const x of b) s += a[x % a.length]; return s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => new Date().toISOString().slice(0, 10);
const frDate = d => { if (!d) return ""; const x = new Date(d + (d.length === 10 ? "T12:00:00" : "")); return isNaN(x) ? d : x.toLocaleDateString("pt-BR", {day:"numeric", month:"long", year:"numeric"}); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const half = v => Math.round(v * 2) / 2;
/* Lecture des PDF dans un vrai « worker » : l'écran ne fige plus sur les gros PDF du copieur */
document.addEventListener("DOMContentLoaded", () => { try { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"; } catch(e){} });
/* Filet de sécurité : une erreur imprévue ne laisse pas l'écran figé sans explication */
window.addEventListener("error", ev => { if (!ev.error || /ResizeObserver|Script error/i.test(ev.message || "")) return; console.error(ev.error); try { toast("Algo deu errado. Se um botão parar de responder, recarregue a página.", 6000); } catch(e){} });
window.addEventListener("unhandledrejection", ev => { console.error(ev.reason); try { const c = ev.reason?.code; toast(c ? aiErr(c) : "Algo deu errado. Tente de novo ou recarregue a página.", 6000); } catch(e){} });
function toast(msg, ms = 3500){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), ms); }

const MATIERES = ["Matemática","Língua Portuguesa","Ciências","Biologia","Química","Física","História","Geografia","Inglês","Espanhol","Hebraico","Filosofia","Sociologia","Artes","Educação Física"];
const MAT_SUGG = ["Guemará","Mishná","Chumash","Neviim","Halachá","Chassidut","Pensamento judaico"];
/* Matières : liste de base + matières ajoutées par le prof, + celles déjà utilisées */
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch(e){ return []; } };
/* Les matières que le prof enseigne (Mon compte) : seules celles-ci sont proposées. Vide = toute la liste. */
const enseigne = () => (window.TIKOUN_CONFIG?.accounts && S.me ? S.me.enseigne : lsGet("mastery.enseigne")) || [];
function myMatieres(all){ const ens = enseigne(); if (!all && ens.length) return ens;
  const perso = S.me?.matieres || lsGet("mastery.matieres");
  const used = [...(store.controles || []), ...(store.cours || []), ...(store.quizzes || [])].map(x => x.matiere).filter(Boolean);
  return [...new Set([...MATIERES, ...MAT_SUGG, ...perso, ...used])]; }
const matOpts = (cur, all) => { const l = myMatieres(all); return selOpts(cur && !l.includes(cur) ? [cur, ...l] : l, cur) + (!all && enseigne().length ? `<option value="__all">Outra disciplina…</option>` : `<option value="__add">+ Nova disciplina…</option>`); };
async function saveMe(patch, lsKey){ if (window.TIKOUN_CONFIG?.accounts && S.me){ const j = await api("/api/me", {method:"PATCH", body:JSON.stringify(patch)}); S.me = j.user; }
  else { try { localStorage.setItem(lsKey, JSON.stringify(Object.values(patch)[0])); } catch(e){} } }
const clean = l => [...new Set(l.map(x => String(x).trim()).filter(Boolean))];
async function saveMatieres(list){ await saveMe({matieres:clean(list).slice(0, 40)}, "mastery.matieres"); }
async function saveEnseigne(list){ await saveMe({enseigne:clean(list).slice(0, 12)}, "mastery.enseigne"); }
/* Une matière utilisée qui n'est pas encore dans « mes matières » y est ajoutée toute seule */
async function learnMatiere(m){ if (!m || enseigne().includes(m)) return; try { await saveEnseigne([...enseigne(), m]); } catch(e){} }
document.addEventListener("change", async ev => { const el = ev.target; if (el.tagName !== "SELECT" || !["__add", "__all"].includes(el.value)) return;
  ev.stopImmediatePropagation();
  if (el.value === "__all"){ const cur = myMatieres()[0]; el.innerHTML = matOpts(cur, true); el.value = cur; return; }
  const n = (prompt("Nome da nova disciplina (ex. Guemará):") || "").trim();
  if (n){ await saveMatieres([...(S.me?.matieres || lsGet("mastery.matieres")), n]); }
  const v = n || myMatieres()[0]; el.innerHTML = matOpts(v, true); el.value = v; el.dispatchEvent(new Event("change", {bubbles:true})); }, true);
const NIVEAUX = ["6º ano","7º ano","8º ano","9º ano","1º ano EM","2º ano EM","3º ano EM"];
const LEVELS = ["socle","standard","approfondi"];

/* In-memory stand-in when the database is not available in this view */
function memDB(init = {}, persist = null){
  const data = {...init}; const subs = [];
  const colOf = p => p.split("/").slice(0, -1).join("/");
  const notify = col => subs.filter(s => s.col === col).forEach(s => s.fn(snapOf(col)));
  const snapOf = col => { const docs = Object.keys(data).filter(k => colOf(k) === col).map(k => ({id:k.split("/").pop(), exists:true, data:() => data[k], metadata:{}}));
    return {docs, size:docs.length, empty:!docs.length, docChanges:() => [], metadata:{}}; };
  const merge = (a, b) => { for (const k in b){ if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
  const doc = p => ({ id:p.split("/").pop(), path:p,
    get: async () => ({id:p.split("/").pop(), exists:!!data[p], data:() => data[p], metadata:{}}),
    set: async d => { data[p] = JSON.parse(JSON.stringify(d)); notify(colOf(p)); if (persist) await persist(p, data[p], "set"); },
    update: async d => { if (!data[p]) throw {code:"invalid_argument"}; const patch = JSON.parse(JSON.stringify(d)); merge(data[p], JSON.parse(JSON.stringify(d))); data[p] = {...data[p]}; notify(colOf(p)); if (persist) await persist(p, data[p], "update", patch); },
    delete: async () => { delete data[p]; notify(colOf(p)); if (persist) await persist(p, null, "delete"); } });
  return { doc, _all:() => data, _remote:(p, val) => { if (val == null) delete data[p]; else data[p] = val; notify(colOf(p)); }, collection: col => ({ path:col, doc: id => doc(col + "/" + (id || uid(16))),
    onSnapshot: (fn) => { const s = {col, fn}; subs.push(s); setTimeout(() => fn(snapOf(col))); return () => subs.splice(subs.indexOf(s), 1); } }) };
}

/* Serialized writes: one at a time */
let wq = Promise.resolve();
function write(path, data, mode = "set"){
  const run = () => mode === "update" ? DB.doc(path).update(data) : mode === "delete" ? DB.doc(path).delete() : DB.doc(path).set(data);
  const retry = (n) => run().catch(e => { if (n > 0 && e?.code !== "no_access" && e?.code !== "quota_exceeded" && !/403/.test(e?.message || "")) return new Promise(r => setTimeout(r, n === 2 ? 1500 : 4000)).then(() => retry(n - 1)); throw e; });
  SAVE.n++; saveState();
  wq = wq.then(() => retry(2)).then(() => { SAVE.err = false; SAVE.at = Date.now(); })
    .catch(e => { SAVE.err = true; console.error(e); toast(e?.code === "no_access" ? aiErr("no_access") : e?.code === "quota_exceeded" ? "Banco de dados cheio: exclua provas antigas." : "⚠ Não salvo: a conexão com o servidor falhou. Verifique a rede e refaça a última alteração.", 9000); })
    .finally(() => { SAVE.n--; saveState(); });
  return wq;
}

/* Relecture d'une page : les notes posées par le professeur et les copies validées ne sont jamais écrasées */
function keepTeacherNotes(cp, out){
  const ans = out.answers || {};
  for (const qid of Object.keys(ans)){
    const old = cp?.answers?.[qid];
    if (cp?.validee || old?.valide) delete ans[qid];
    else if (old && old.note != null) delete ans[qid].note;
  }
  if (!cp?.validee) out.validee = false; else delete out.validee;
  return out;
}
/* Élèves retirés (ou classe supprimée) : on efface leurs copies, images, notes, exercices et échantillons d'écriture */
async function purgeStudents(ids){
  const set = new Set(ids); if (!set.size) return;
  const assets = [];
  const grab = v => { if (typeof v === "string"){ if (/^[a-z0-9]{8,40}$/.test(v)) assets.push(v); } else if (Array.isArray(v)) v.forEach(grab); else if (v && typeof v === "object") Object.values(v).forEach(grab); };
  for (const [cid, f] of Object.entries(store.feuilles || {})){
    const copies = f?.copies || {}; if (!Object.keys(copies).some(e => set.has(e))) continue;
    const keep = {}; for (const [e, cp] of Object.entries(copies)){ if (set.has(e)){ grab(cp.scans); for (const a of Object.values(cp.answers || {})) grab(a?.crop); } else keep[e] = cp; }
    const {id, ...rest} = f; await write("feuilles/" + cid, {...rest, copies:keep});
  }
  for (const k of Object.keys(store.quizrep || {})){ const eid = k.slice(k.indexOf("_") + 1); if (set.has(eid)) await write("quizrep/" + k, null, "delete"); }
  for (const eid of set) if (store.ecritures?.[eid]){ grab(store.ecritures[eid].samples); await write("ecritures/" + eid, null, "delete"); }
  const still = new Set(); const keepRef = v => { if (typeof v === "string") still.add(v); else if (Array.isArray(v)) v.forEach(keepRef); else if (v && typeof v === "object") Object.values(v).forEach(keepRef); };
  keepRef(store.feuilles); keepRef(store.ecritures);   // une image encore utilisée ailleurs n'est jamais effacée
  for (const a of [...new Set(assets)]) if (!still.has(a)) fetch("/api/files/" + a, {method:"DELETE", credentials:"same-origin"}).catch(() => {});
}

    const blk = n.parentElement?.closest("p,div,td,li,span,label") || n.parentElement; const first = (blk?.textContent || "").match(strong)?.[0] || ""; const rtlPara = heb.test(first);

    return start > end ? reverseVisual(line) : line;
  }).join("\n");
}

const micLang = () => S.micLang || (() => { try { return localStorage.getItem("mastery.micLang"); } catch(e){ return null; } })() || ({en:"en-US", pt:"pt-BR"}[document.documentElement.lang.slice(0, 2)] || FR_FR);

function micToggle(id){
  if (REC){ const same = REC_FOR === id; REC.stop(); if (same) return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Ditado indisponível neste navegador: toque no campo de texto e depois no microfone do teclado.", 8000);
  const r = new SR(); r.lang = micLang(); r.continuous = true; r.interimResults = true;
  let base = $("#" + id)?.value || ""; if (base && !/\s$/.test(base)) base += " ";
  r.onresult = ev => { let fin = "", tmp = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += t; else tmp += t; }
    if (fin) base += fin.trim() + " ";

const rTitre = t => String(t).replace(/^(feuille de |fiche de )?rattrapage\s*[-:·–]?\s*/i, "").replace(/^contr[ôo]le de /i, "") || String(t);
/* Deux énoncés trop proches : l'un contient l'autre, ou ils partagent la plupart de leurs mots significatifs */
function tooClose(a, b, seuil = 0.6){
  const w = t => new Set(t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\u0590-\u05ff ]+/g, " ").split(/\s+/).filter(x => x.length > 3).map(x => x.slice(0, 5)));
  const A = w(a), B = w(b); if (!A.size || !B.size) return false;
  const inter = [...A].filter(x => B.has(x)).length; return inter / Math.min(A.size, B.size) >= seuil;
}

const askedOf = ctrls => ctrls.flatMap(x => (x.questions || []).flatMap(q => [...new Set(Object.values(q.v || {}).map(v => v?.enonce).filter(Boolean))].map(en => ({enonce:en, corrige:Object.values(q.v).find(v => v?.enonce === en)?.corrige || ""}))));

async function doublons(news, olds){
  if (!news.length || !olds.length) return [];

NOVAS QUESTÕES:
${news.map((n, k) => `N${k + 1}. ${n.enonce.slice(0, 300)} → resposta esperada: ${n.corrige.slice(0, 200)}`).join("\n")}

Uma nova questão é DUPLICATA se pedir a mesma informação ou esperar essencialmente a mesma resposta de uma questão já feita, mesmo com outra redação (reformulação, verdadeiro/falso, lacuna, múltipla escolha, situação que leve a recitar a mesma coisa). NÃO é duplicata se tratar do mesmo conceito mas pedir outro elemento, uma nova aplicação ou outra explicação.

async function createRattrapage(c, e, replaceId){
  const f = feuille(c.id), cp = f?.copies?.[e.id]; if (!cp) throw {code:"no_copy"};
  if (!copyDone(c, cp) || final20(c, cp) >= SEUIL) throw {code:"not_failed"};
  if (!cp.validee && !confirm(`A prova de ${e.prenom} ainda não foi validada: a recuperação seria baseada na nota sugerida pela IA. Continuar?`)) throw {code:"cancelled"};
  if (!replaceId && store.controles.some(x => x.type === "rattrapage" && x.parentId === c.id && x.eleves?.includes(e.id))) throw {code:"ratt_exists"};
  const weak = c.questions.map(q => ({q, a:cp.answers[q.id]})).filter(x => x.a && noteOf(x.a) / x.q.points < 0.6);
  const target = weak.length ? weak : c.questions.map(q => ({q, a:cp.answers[q.id]})).sort((x, y) => noteOf(x.a) / x.q.points - noteOf(y.a) / y.q.points).slice(0, 1);
  const lvl = levelOf(e, c.matiere);
  /* Ce que l'élève a raté : notions et erreurs seulement. Les questions du contrôle ne sont données qu'en liste INTERDITE,

  const ctx = target.map(({q, a}) => `- Conteúdo: ${q.notion || "?"} · nota ${fmt(noteOf(a))}/${q.points} · erros anotados: ${(a?.erreurs || []).join(", ") || "?"}${a?.commentaire ? " · comentário: " + a.commentaire : ""}`).join("\n");
  const co = c.coursId && (store.allCours || store.cours).find(x => x.id === c.coursId);
  const olds = askedOf([c, ...store.controles.filter(x => x.type === "rattrapage" && x.parentId === c.id)]);
  const prompt = (n, refus) => `Você está preparando uma folha de recuperação individual para um aluno do ${c.niveau || ""} en ${c.matiere}.
Nível habitual do aluno nesta disciplina: ${LVL[lvl]}.
Conceitos em que o aluno falhou na prova “ ${c.titre} » :
${ctx}
${co?.texte ? `\nAULA (fonte principal das novas questões):\n"""${co.texte.slice(0, 14000)}"""\n` : ""}
QUESTÕES JÁ FEITAS AO ALUNO, TODAS PROIBIDAS (com a resposta):
${[...olds, ...refus].map((o, k) => `${k + 1}. ${o.enonce.slice(0, 300)} → resposta: ${o.corrige.slice(0, 200)}`).join("\n")}

${langueRule(c.langue)}
Crie exatamente ${n} exercício(s) TOTALMENTE NOVO(S)${n === 3 ? ", de dificuldade crescente: 1 = descoberta (mais simples que o nível do aluno), 2 = aplicação, 3 = retorno ao nível " + LVL[lvl].toLowerCase() + " da prova" : ""}.
REGRA ABSOLUTA: cada exercício deve pedir outra coisa e esperar uma resposta DIFERENTE de todas as questões proibidas. Reformular uma questão proibida, ou transformá-la em verdadeiro/falso, lacuna, múltipla escolha ou situação que leve à mesma resposta, é duplicata: recusado.
Para continuar nos conceitos em que o aluno errou sem repetir: use outras partes da aula (outra regra, outro detalhe, outro exemplo, caso particular, consequência prática, comparação entre dois conceitos, aplicação a uma situação concreta nova, explicação do “porquê”).
Total ${n === 3 ? "20 pontos (ex.: 5, 7, 8)" : "pontos: " + n * 6 + " aproximadamente"}. Cada exercício: um enunciado autônomo${n === 3 ? " (com uma dica entre parênteses no 1)" : ""}, uma resposta-modelo, critérios de correção, 2 ou 3 erros típicos, um número de linhas de resposta (3 a 12).
${NOSRC}
Responda apenas em JSON: {"titre":"…","questions":[{"notion":"…","points":5,"lignes":5,"enonce":"…","corrige":"…","criteres":"…","erreurs":["…"]}]}`;
  const toQ = x => ({id:"q" + uid(5), notion:String(x.notion || ""), points:+x.points || 5, lignes:clamp(+x.lignes || 6, 2, 20), erreurs:(x.erreurs || []).map(String),
    v:{standard:{enonce:String(x.enonce || ""), corrige:String(x.corrige || ""), criteres:String(x.criteres || "")}}});
  const prev = replaceId ? askedOf([ctrl(replaceId)].filter(Boolean)) : [];

  /* Vérification du sens par l'IA : une question qui demande la même chose qu'une question déjà posée est remplacée (2 essais) */
  for (let k = 0; k < 2 && qs.length; k++){
    const dup = await doublons(qs.map(q => vOf(q, "standard")), olds); if (!dup.length) break;
    const keep = qs.filter((q, i) => !dup.includes(i)).map(q => vOf(q, "standard")), bad = dup.map(i => vOf(qs[i], "standard"));

    dup.forEach((i, j) => { if (add[j]){ add[j].points = qs[i].points; qs[i] = add[j]; } });

  if (old && !printed){ const o = structuredClone(old); o.questions = qs; o.titre = "Recuperação · " + rTitre(r.titre || c.titre); await saveCtrl(o); return replaceId; }
  const round = store.controles.filter(x => x.type === "rattrapage" && x.parentId === c.id && x.eleves?.includes(e.id)).length;
  const id = uid(12);

  await write("controles/" + id, doc);
  return id;
}

`Chapitre : Fonctions affines

1. Définition
Une fonction affine est une fonction f définie par f(x) = ax + b, où a et b sont deux nombres fixés.
a est le coefficient directeur, b est l'ordonnée à l'origine.
Si b = 0, f(x) = ax : f est une fonction linéaire. Si a = 0, f(x) = b : f est une fonction constante.

2. Image et antécédent
L'image de x par f est le nombre f(x). Exemple : f(x) = 2x − 3 ; l'image de 4 est f(4) = 2×4 − 3 = 5.
Un antécédent de y par f est un nombre x tel que f(x) = y. Pour le trouver, on résout l'équation ax + b = y.
Exemple : antécédent de 7 par f : 2x − 3 = 7, donc 2x = 10, x = 5.

3. Représentation graphique
La représentation graphique d'une fonction affine est une droite. Elle passe par le point (0 ; b).
Quand x augmente de 1, f(x) augmente de a. Si a > 0, a função é crescente; se a < 0, décroissante.

4. Déterminer une fonction affine à partir de deux points
Si f(x1) = y1 et f(x2) = y2, alors a = (y2 − y1) / (x2 − x1), puis on calcule b avec b = y1 − a×x1.

5. Problèmes
Comparer deux tarifs : tarif A = 20 € par mois ; tarif B = 8 € + 0,50 € par heure. On modélise B par f(h) = 0,5h + 8.
B est plus cher que A quand 0,5h + 8 > 20, c'est-à-dire h > 24.`});

}

/* Champs de l'éditeur de contrôle : applique la saisie au contrôle et le renvoie (null si ce n'est pas un champ de l'éditeur) */
function applyEdit(el){
  const d = el.dataset, c = S.view === "edit" ? ctrl(S.editId) : null; if (!c) return null;
  if (editPending && editPending.id === c.id && editPending !== c) Object.assign(c, structuredClone(editPending));   // le magasin a été rechargé entre-temps : on garde la saisie en attente
  if (d.c){ c[d.c] = el.type === "number" ? +el.value : el.value; }
  else if (el.id === "e-diff"){ c.differencie = el.checked; }
  else if (d.m){ c.mise = {...(c.mise || {}), [d.m]: ["police","lh"].includes(d.m) ? +el.value : el.value}; }
  else if (d.bo){ c.bonus = {...(c.bonus || {}), [d.bo]:+el.value}; }
  else if (el.id === "m-bar"){ c.mise = {...(c.mise || {}), bareme:el.checked}; }
  else if (d.q !== undefined){ const q = c.questions[+d.q]; if (!q) return null;
    if (d.vk === "choixRaw"){ const lines = el.value.split("\n").map(x => x.trim()).filter(Boolean); q.v = q.v || {};
      const o = {...(q.v[d.lv] || {enonce:""}), choix:lines.map(x => x.replace(/^\*\s*/, "")), bonnes:lines.map((x, j) => x.startsWith("*") ? j : -1).filter(j => j >= 0)};
      o.corrige = "Resposta(s) correta(s): " + o.bonnes.map(n => "ABCDEF"[n]).join(", "); o.criteres = "Tudo ou nada."; q.v[d.lv] = o; }
    else if (d.vk){ q.v = q.v || {}; q.v[d.lv] = {...(q.v[d.lv] || {enonce:"", corrige:"", criteres:""}), [d.vk]:el.value}; }
    else if (d.k === "erreurs") q.erreurs = el.value.split(";").map(s => s.trim()).filter(Boolean);
    else if (d.k === "type"){ if (el.value) q.type = "qcm"; else delete q.type; }
    else q[d.k] = ["points","lignes"].includes(d.k) ? +el.value : el.value; }
  else return null;
  return c;
}

/* Contrôle dicté par le professeur (ou lu sur la photo d'un ancien contrôle) : l'IA met au propre sans rien inventer */
function dictPrompt(texte, mat, niveau, langue, photo){
  const qcm = !prefs().q.justif;
  return `Você é o assistente de um professor de ${mat}${niveau ? " (turma do " + niveau + ")" : ""}. ${photo ? "O professor fotografou uma de suas provas antigas; aqui está a transcrição da folha, às vezes com as respostas acrescentadas." : "O professor ditou (ou escreveu) a prova: as questões, as respostas esperadas e às vezes os pontos."}
O texto pode vir de um ditado por voz: pontuação ausente, palavras mal reconhecidas (sobretudo termos em hebraico ou técnicos), hesitações, repetições, correções faladas (“não, desculpa…”).

TEXTO DO PROFESSOR:
"""${texte.slice(0, 20000)}"""

Sua tarefa: organizar esta prova SEM INVENTAR NADA no conteúdo.
- Mantenha exatamente as questões do professor, na ordem dele. Não acrescente nem remova nenhuma questão.
- Corrija apenas ortografia, pontuação, palavras claramente mal reconhecidas e a redação, para que o aluno entenda o enunciado.
- Resposta-modelo = a resposta dada pelo professor, organizada. Nunca a altere, mesmo que pareça discutível: sinalize em "remarques".
- Se uma questão não tiver resposta, escreva uma resposta-modelo curta e sinalize em "remarques" (ex.: “Q3: resposta proposta pela IA, verificar”).
- Pontos: os do professor. Se ele não der, distribua 20 pontos conforme a dificuldade. Se o total dele não for 20, mantenha os pontos e sinalize.
- Critérios de correção: use o que o professor disse (ex.: “aceito dois de três”); senão, proponha critérios simples cuja soma dá os pontos.
${qcm ? `- Se o professor der opções para marcar, transforme em múltipla escolha: "type":"qcm" e, na versão, "choix" (as opções, sem letra) e "bonnes" (índices das respostas certas, a partir de 0).` : `- Se o professor der opções, escreva-as no enunciado (A, B, C…) e peça para justificar a escolha.`}
- Para cada questão: o conceito avaliado, 1 ou 2 erros típicos prováveis e um número adequado de linhas de resposta (2 a 15).
- "remarques": uma lista curta do que o professor deve verificar (vazia se tudo estiver claro).
${langueRule(langue)}
${NOSRC}
Responda apenas em JSON: {"titre":"…","remarques":["…"],"questions":[{"notion":"…","points":4,"lignes":5,"erreurs":["…"],"versions":{"standard":{"enonce":"…","corrige":"…","criteres":"…"}}}]}`;
}
/* Variante d'un contrôle : même structure, mêmes notions et mêmes points, nouveaux énoncés */
async function createVariante(c){
  const co = c.coursId && (store.allCours || store.cours).find(x => x.id === c.coursId), lv = c.differencie ? LEVELS : ["standard"];
  const list = c.questions.map((q, i) => { const v = vOf(q, "standard"); return `${i + 1}. [${q.points} pts${q.type === "qcm" ? ", QCM" : ""}] Notion : ${q.notion || "?"}\n   Enunciado: ${v.enonce}\n   Resposta: ${v.corrige}`; }).join("\n");
  const ask = (refus) => ai(`Você é um professor de ${c.matiere}${c.niveau ? " en " + c.niveau : ""}. Aqui está uma prova:
${list}
${co?.texte ? `\nAULA (para encontrar outros exemplos):\n"""${co.texte.slice(0, 12000)}"""\n` : ""}
Escreva uma VARIANTE desta prova para outra turma ou outro dia: exatamente ${c.questions.length} questões, na mesma ordem, cada uma sobre o MESMO conceito, com os MESMOS pontos, o mesmo tipo e a mesma dificuldade, mas pedindo OUTRA COISA: outros valores, outro exemplo, outra situação ou outro elemento do conceito, com uma resposta esperada diferente da original. Reformular a questão original (ou transformá-la em verdadeiro/falso, lacuna ou múltipla escolha com a mesma resposta) é proibido.
${lv.length > 1 ? `Para cada questão, 3 versões com os mesmos pontos: "socle" (mais guiada), "standard", "approfondi" (mais exigente).` : `Para cada questão, uma única versão "standard".`} Cada versão: enunciado, resposta-modelo e critérios de correção cuja soma dá os pontos.${c.questions.some(q => q.type === "qcm") ? ` Para múltipla escolha: "type":"qcm" e, em cada versão, "choix" (opções sem letra) e "bonnes" (índices a partir de 0).` : ""}
${refus.length ? "Estas questões são PROIBIDAS (duplicatas de uma questão da prova): " + refus.map(t => "« " + t.slice(0, 200) + " ”").join(" / ") + "\n" : ""}${langueRule(c.langue)}
${NOSRC}
Responda apenas em JSON: {"questions":[{"notion":"…","points":4,"lignes":6,"erreurs":["…"],"versions":{${lv.map(l => `"${l}":{"enonce":"…","corrige":"…","criteres":"…"}`).join(",")}}}]}`);
  const olds = askedOf([c]); let r = await ask([]);
  /* Vérification du sens : si des questions ne font que reformuler l'original, on refait la variante en les interdisant */
  const d1 = await doublons((r?.questions || []).map(mapQ).map(q => vOf(q, "standard")), olds);
  if (d1.length){ const r2 = await ask(d1.map(k => String(r.questions[k]?.versions?.standard?.enonce || ""))); if ((r2?.questions || []).length) r = r2; }
  const qs = (r?.questions || []).map(mapQ); if (!qs.length) throw {code:"invalid_json"};
  qs.forEach((q, i) => { const o = c.questions[i]; if (o){ q.points = +o.points; q.lignes = o.lignes || q.lignes; } });
  const {id:_, ...rest} = c, id = uid(12);
  await write("controles/" + id, {...rest, titre:c.titre.replace(/ \(variante( \d+)?\)$/, "") + " (variante)", questions:qs, statut:"brouillon", date:"", varianteDe:c.id, remarques:[], createdAt:new Date().toISOString()});
  return id;
}


/* ================= Standalone mode (GitHub Pages / any web host) =================
   Outside claude.ai there is no window.claude: data lives in this browser (IndexedDB),
   the AI is called directly with the school's Anthropic API key, files download normally. */
let STANDALONE = false;
const BLOBURL = {};
const blobSrc = id => (typeof SERVERSTORE !== "undefined" && SERVERSTORE) ? "/api/files/" + id : STANDALONE ? (BLOBURL[id] || (SB ? (wantUrl(id), "") : "")) : "/_blob/" + id;
async function getBlob(id){ if (SERVERSTORE){ const r = await fetch("/api/files/" + id, {credentials:"same-origin"}); if (!r.ok) throw {code:"no_blob"}; return r.blob(); } if (STANDALONE && SB) return cloudBlob(id); if (STANDALONE){ const b = await idbGet("blobs", id); if (!b) throw {code:"no_blob"}; return b; } return (await fetch("/_blob/" + id)).blob(); }

function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open("tikoun", 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
let IDB = null;
const idbReq = (store, mode, fn) => new Promise((res, rej) => { const tx = IDB.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r?.result); tx.onerror = () => rej(tx.error); });
const idbGet = (s, k) => idbReq(s, "readonly", o => o.get(k));
const idbPut = (s, k, v) => idbReq(s, "readwrite", o => o.put(v, k));
const idbDel = (s, k) => idbReq(s, "readwrite", o => o.delete(k));
const idbAll = s => new Promise((res, rej) => { const out = {}; const tx = IDB.transaction(s, "readonly"); const c = tx.objectStore(s).openCursor();
  c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } }; tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); });

async function localDB(){
  IDB = await idbOpen();
  const init = await idbAll("docs");
  const db = memDB(init, (path, val) => val == null ? idbDel("docs", path) : idbPut("docs", path, val));
  return db;
}
async function localAssets(){
  const all = await idbAll("blobs"); for (const [k, b] of Object.entries(all)) BLOBURL[k] = URL.createObjectURL(b);
  return { upload: async blob => { const id = uid(14); await idbPut("blobs", id, blob); BLOBURL[id] = URL.createObjectURL(blob); return {id, url:BLOBURL[id], sizeBytes:blob.size, contentType:blob.type}; } };

function parseJSONloose(t){
  try { return JSON.parse(t); } catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch(e){} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  const part = salvageJSON(t); if (part) return part;
  throw {code:"invalid_json", text:t};
}
/* Réponse coupée (trop longue) : on garde les questions complètes du tableau "questions" (jamais pour la correction des copies) */
function salvageJSON(t){
  const k = t.search(/"(questions)"\s*:\s*\[/); if (k < 0) return null;
  const key = t.slice(k + 1, t.indexOf('"', k + 1)), start = t.indexOf("[", k) + 1, items = [];
  let depth = 0, inStr = false, esc = false, from = -1;
  for (let i = start; i < t.length; i++){ const ch = t[i];
    if (inStr){ if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') inStr = true;
    else if (ch === "{"){ if (depth === 0) from = i; depth++; }
    else if (ch === "}"){ depth--; if (depth === 0 && from >= 0){ try { items.push(JSON.parse(t.slice(from, i + 1))); } catch(e){} from = -1; } }
    else if (ch === "]" && depth === 0) break; }
  if (!items.length) return null;
  const titre = (t.slice(0, k).match(/"titre"\s*:\s*"((?:[^"\\]|\\.)*)"/) || [])[1];
  return {[key]:items, ...(titre ? {titre:JSON.parse('"' + titre + '"')} : {}), _partiel:true};
}

async function cloudDB(){
  const init = {};

    const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999);
    if (error) throw error; data.forEach(r => init[r.path] = r.data); if (data.length < 1000) break;
  }
  const db = memDB(init, async (p, val, op, patch) => {
    let r;

    else if (op === "update") r = await SB.rpc("tk_update", {p_path:p, p_patch:patch});
    else r = await SB.from("docs").upsert({path:p, col:p.split("/").slice(0, -1).join("/"), data:val});
    if (r.error){ console.error(r.error); throw {code:"cloud_write", message:r.error.message}; }
  });
  SB.channel("tikoun-docs").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, pl => {
    if (pl.eventType === "DELETE") db._remote(pl.old.path, null); else db._remote(pl.new.path, pl.new.data);
  }).subscribe();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState !== "visible") return;
    for (let from = 0; ; from += 1000){ const {data, error} = await SB.from("docs").select("path,data").range(from, from + 999); if (error) return; data.forEach(r => db._remote(r.path, r.data)); if (data.length < 1000) break; } });

}

/* ================= Stockage sur le serveur de l'école (Railway + Volume) ================= */
let SERVERSTORE = false, SRV_PERSIST = true;
async function serverDB(){
  const r = await fetch("/api/db", {credentials:"same-origin"});
  if (r.status === 401){ NEED_CODE = true; throw {code:"need_code"}; }
  if (!r.ok) throw {code:"cloud_write", message:"serveur " + r.status};
  const j = await r.json(); let epoch = j.epoch, seq = j.seq; SRV_PERSIST = j.persistent !== false;
  /* Écritures locales en cours : une synchronisation lancée avant elles ne doit pas remettre l'ancienne version */
  const pend = {}, touched = {}; let gen = 0;
  const db = memDB(j.docs || {}, async (p, val, op, patch) => {
    pend[p] = (pend[p] || 0) + 1; touched[p] = ++gen;
    try { await sendDoc(p, val, op, patch); } finally { pend[p]--; touched[p] = ++gen; }
  });
  async function sendDoc(p, val, op, patch){
    const u = "/api/db/doc?path=" + encodeURIComponent(p);
    const res = op === "delete" ? await fetch(u, {method:"DELETE", credentials:"same-origin"})
      : await fetch(u, {method:op === "update" ? "PATCH" : "PUT", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify(op === "update" ? patch : val)});
    if (!res.ok) throw {code:res.status === 401 ? "need_code" : res.status === 402 ? "no_access" : "cloud_write", message:"serveur " + res.status};
  }
  let busy = false;
  const pull = async () => {
    if (busy || document.visibilityState === "hidden") return; busy = true; const g0 = gen;
    const fresh = p => !pend[p] && !(touched[p] > g0);
    try {
      const r2 = await fetch(`/api/db/changes?since=${seq}&epoch=${encodeURIComponent(epoch)}`, {credentials:"same-origin"}); if (!r2.ok) return;
      const k = await r2.json(); let skip = false; const ok = p => fresh(p) || (skip = true, false);
      if (k.reset){ const cur = db._all(); for (const p of Object.keys(cur)) if (!(p in k.docs) && ok(p)) db._remote(p, null); for (const [p, v] of Object.entries(k.docs)) if (ok(p) && JSON.stringify(cur[p]) !== JSON.stringify(v)) db._remote(p, v); }
      else for (const c of k.changes || []){ if (ok(c.path) && JSON.stringify(db._all()[c.path]) !== JSON.stringify(c.data)) db._remote(c.path, c.data); }
      if (!skip){ epoch = k.epoch; seq = k.seq; }   // un document ignoré sera relu à la prochaine synchronisation
    } catch(e){} finally { busy = false; }
  };
  setInterval(pull, 8000); document.addEventListener("visibilitychange", pull);
  return db;
}

/* ================= Navigation : de vraies pages, avec adresse, Précédent / Suivant ================= */
const STEPS = [["preparer","Preparar"],["mise-en-page","Layout"],["imprimer","Imprimir"],["scanner","Escanear"],["corriger","Corrigir"],["classe","Turma e recuperação"]];
const stepIdx = s => STEPS.findIndex(x => x[0] === s);
function defaultStep(c){ return {brouillon:"preparer", imprime:"scanner", correction:"corriger", corrige:"classe"}[c?.statut] || "preparer"; }
function routeOf(){
  switch (S.view){
    case "home": return "accueil";
    case "new": return "nouveau";
    case "edit": return `controle/${S.editId}/${S.step || "preparer"}`;
    case "scan": return S.scanCtrl ? `controle/${S.scanCtrl}/scanner` : "scanner";
    case "correct": return S.corrCtrl && S.inCtrl ? `controle/${S.corrCtrl}/corriger` : "correction";
    case "analyse": return S.anCtrl && S.inCtrl ? `controle/${S.anCtrl}/classe` : "resultats";
    case "reglages": return "sauvegarde";
    case "quiznew": return "exercices/nouveau";
    case "quiz": return `exercices/${S.qz.id}/${S.qz.tab || "questions"}`;
    default: return S.view;
  }
}
function applyRoute(){
  const [a, b, c] = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  S.inCtrl = null; S.scanCtrl = null;
  if (a === "controle" && b){
    const step = STEPS.some(x => x[0] === c) ? c : "preparer"; S.inCtrl = b; S.step = step;
    if (stepIdx(step) <= 2){ S.view = "edit"; S.editId = b; }
    else if (step === "scanner"){ S.view = "scan"; S.scanCtrl = b; }
    else if (step === "corriger"){ S.view = "correct"; if (S.corrCtrl !== b){ S.corrCtrl = b; S.corrEleve = null; S.editTr = {}; S.editCom = {}; } }
    else { S.view = "analyse"; S.anCtrl = b; }
  }
  else if (a === "exercices" && b){ if (b === "nouveau") S.view = "quiznew"; else { if (S.qz.id !== b) S.qz.el = null; S.view = "quiz"; S.qz.id = b; S.qz.tab = ["questions","reglages","resultats"].includes(c) ? c : "questions"; } }
  else S.view = {accueil:"home", nouveau:"new", scanner:"scan", sauvegarde:"reglages", correction:"correct", resultats:"analyse"}[a] || (["controles","exercices","classes","suivi","banque","direction","compte","comptes","entrainement"].includes(a) ? a : "home");
}
function go(v){
  S.view = v;
  if (v === "edit"){ S.inCtrl = S.editId; if (stepIdx(S.step) < 0 || stepIdx(S.step) > 2) S.step = "preparer"; }
  else if (v === "correct" && S.corrCtrl){ S.inCtrl = S.corrCtrl; S.step = "corriger"; }
  else if (v === "analyse" && S.anCtrl){ S.inCtrl = S.anCtrl; S.step = "classe"; }
  else if (v !== "scan") S.inCtrl = null;
  const h = "#/" + routeOf();
  if (location.hash !== h) location.hash = h; else { render(); window.scrollTo({top:0}); }
}
function openCtrl(id, step){ const c = ctrl(id); location.hash = `#/controle/${id}/${step || defaultStep(c)}`; }
window.addEventListener("hashchange", () => { if (FREC) FREC.stop(); const a = document.activeElement; if (a && a !== document.body && $("#view")?.contains(a)) a.blur(); flushEdit(); applyRoute(); render(); window.scrollTo({top:0}); });

function ctrlProgress(c){

}

/* ================= Shared: document pages → PDF ================= */
function docPages(headHTML, blocks, footTxt){
  const stage = $("#sheetStage"); const pages = [];
  const np = () => { const p = document.createElement("div"); p.className = "sheet doc"; p.innerHTML = pages.length ? "" : headHTML;
    const f = document.createElement("div"); f.className = "sh-foot"; f.innerHTML = `<span>${esc(footTxt)}</span><span class="pn"></span>`; p.append(f); stage.append(p); pages.push(p); return p; };
  let page = np();
  for (const html of blocks){
    const b = document.createElement("div"); b.className = "sh-q"; b.innerHTML = html; page.insertBefore(b, page.querySelector(".sh-foot"));
    if (b.offsetTop + b.offsetHeight > 1123 - 70 && page.querySelectorAll(".sh-q").length > 1){ b.remove(); page = np(); page.insertBefore(b, page.querySelector(".sh-foot")); }
  }
  pages.forEach((p, i) => { p.querySelector(".pn").textContent = `page ${i + 1} / ${pages.length}`; });
  return pages;
}
async function buildPdf(builders, filename, st){
  if (!window.html2canvas || !window.jspdf){ st.textContent = "Bibliotecas de PDF não carregadas: recarregue a página."; return false; }
  const ov = document.createElement("div"); ov.className = "zoom"; ov.style.alignItems = "center"; ov.innerHTML = `<div id="ovm" style="font-size:16px;color:#fff">Preparando…</div>`; document.body.append(ov);
  const stage = $("#sheetStage"); stage.style.left = "0"; stage.style.zIndex = "40";
  try{
    await document.fonts.ready;
    const pdf = new jspdf.jsPDF({unit:"pt", format:"a4"}); let first = true;
    for (let k = 0; k < builders.length; k++){
      stage.innerHTML = ""; const {pages, label} = builders[k]();
      await Promise.all($$("img", stage).map(im => im.decode ? im.decode().catch(() => {}) : null));
      for (let i = 0; i < pages.length; i++){
        $("#ovm").textContent = `${label} · ${k + 1} / ${builders.length}`;
        const cv = await html2canvas(pages[i], {scale:2, backgroundColor:"#ffffff", logging:false, scrollX:0, scrollY:-window.scrollY, windowWidth:900, useCORS:true, onclone:(doc, el) => fixBidiForCanvas(el)});
        if (!first) pdf.addPage(); first = false; pdf.addImage(cv.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 595.28, 841.89);
      }
    }
    const blob = pdf.output("blob"); ov.remove();
    if (!DL){ st.textContent = "Download indisponível nesta visualização: abra o aplicativo no claude.ai."; return false; }
    try { await DL.save({filename:filename.replace(/[\\/:*?"<>|]/g, "-"), data:blob}); st.textContent = "PDF pronto."; return true; }
    catch(e){ st.textContent = e?.code === "declined" ? "Download cancelado." : "Não é possível fazer download nesta visualização."; return false; }
  }catch(e){ console.error(e); st.textContent = "Falha ao gerar o PDF."; return false; }
  finally{ ov.remove(); stage.style.left = "-12000px"; stage.innerHTML = ""; }
}

  if (!e){ it.status = "erreur"; it.msg = "Ficha de escrita: aluno não encontrado."; return scheduleRender(); }
  it.label = `${e.prenom} ${e.nom} · ficha de escrita`;
  const H = sheetToPhoto(it.found || []); if (!H){ it.status = "erreur"; it.msg = "Marcadores não encontrados: tire a foto de novo com os 4 cantos visíveis."; return scheduleRender(); }
  it.status = "lecture"; it.msg = "Recortando as linhas…"; scheduleRender();
  try{
    const {boxes} = fichePages(cl, e); $("#sheetStage").innerHTML = "";
    const crops = boxes.map(b => warpBox(it.cv, H, b));
    const samples = FICHE.map(f => ({id:f.id, texte:f.texte, usage:f.usage, asset:null, lu:"", sim:null}));
    if (ASSETS) for (let k = 0; k < crops.length; k++){ try { samples[k].asset = (await ASSETS.upload(await toBlob(crops[k], .85))).id; } catch(x){} }

      for (let i = 0; i < crops.length; i += per){

        const r = await ai(`Cada imagem é uma linha manuscrita escrita por um aluno. Transcreva exatamente o que está escrito, caractere por caractere, sem corrigir. O hebraico em letras hebraicas quadradas.${lectureTips()} Responda apenas em JSON: {"lignes":["…"]} com ${part.length} elemento(s), na ordem das imagens.`, {images: await Promise.all(part.map(cv => toBlob(cv, .9)))});
        (r?.lignes || []).forEach((t, j) => { if (samples[i + j]){ samples[i + j].lu = String(t); samples[i + j].sim = simil(samples[i + j].texte, t); } });
      }

    }
    const sims = samples.map(s => s.sim).filter(x => x != null);
    const score = sims.length ? sims.reduce((a, b) => a + b, 0) / sims.length : null;
    const byUsage = u => { const v = samples.filter(s => s.usage === u && s.sim != null).map(s => s.sim); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    await write("ecritures/" + eid, {classeId:clId, samples, score, parUsage:{maths:byUsage("maths"), hebreu:byUsage("hebreu"), francais:byUsage("francais")}, at:new Date().toISOString()});
    it.status = "ok"; it.msg = score != null ? `Escrita registrada · legibilidade ${pct(score)}` : "Escrita registrada"; it.cv = null;
  }catch(x){ console.error(x); it.status = "erreur"; it.msg = aiErr(x?.code); }
  scheduleRender();
}

function mapQuizQ(x){
  const t = QTYPES[x?.type] ? x.type : null; if (!t || !String(x.enonce || "").trim()) return null;
  const q = {id:"x" + uid(7), type:t, notion:String(x.notion || "").slice(0, 80), niveau:clamp(+x.niveau || 1, 1, 3), enonce:String(x.enonce).slice(0, 1200), explication:String(x.explication || "").slice(0, 1200)};
  if (t === "qcm"){ q.choix = (x.choix || []).map(String).filter(Boolean).slice(0, 6); q.bonnes = [...new Set((x.bonnes || []).map(Number))].filter(n => n >= 0 && n < q.choix.length); if (q.choix.length < 2 || !q.bonnes.length) return null; }
  if (t === "vf") q.bonne = x.bonne === true || x.bonne === "true" || x.bonne === "vrai";
  if (t === "num"){ q.reponse = Number(String(x.reponse).replace(",", ".")); if (!isFinite(q.reponse)) return null; q.tolerance = Math.abs(Number(x.tolerance) || 0); q.unite = String(x.unite || "").slice(0, 20); }
  if (t === "trou"){ q.reponses = (Array.isArray(x.reponses) ? x.reponses : [x.reponses]).map(String).filter(Boolean).slice(0, 6); if (!q.reponses.length) return null; }
  if (t === "redige"){ q.corrige = String(x.corrige || ""); q.criteres = String(x.criteres || ""); }
  return q;
}
function quizPrompt(co, o, n, deja){
  return `Você é professor de ${o.matiere} (niveau ${o.niveau}) no Brasil. A partir da AULA abaixo, crie um banco de ${n} questões de treino para um quiz on-line que os alunos refazem várias vezes.
Regras:
- Cubra todos os conteúdos importantes da aula; indique para cada questão o conteúdo (2 a 5 palavras, reutilize exatamente o mesmo rótulo para um mesmo conteúdo).
- Misture os níveis: 1 = descoberta, 2 = aplicação, 3 = desafio (cerca de 40 % / 40 % / 20 %).
- Somente os tipos permitidos: ${o.types.map(t => QTYPES[t]).join(", ")}.
- Sem LaTeX: escreva a matemática com símbolos simples (x², √, ½, ×, ÷, ≤).
- Cada questão tem uma explicação curta (1 a 3 frases) mostrada ao aluno depois da resposta.
- Respostas sem ambiguidade: uma resposta numérica tem um único valor; um texto com lacuna tem uma lacuna marcada ___ e uma lista de respostas aceitas (incluindo variantes de grafia).
${o.langue ? langueRule(o.langue) + "\n" : ""}${o.consignes ? "Instruções do professor: " + o.consignes + "\n" : ""}${deja ? "IMPORTANTE: questões NOVAS, diferentes destas: " + deja + "\n" : ""}${NOSRC}

AULA:
"""${(co?.texte || "").slice(0, 30000)}"""

Responda somente em JSON: {"titre":"…","questions":[
 {"type":"qcm","notion":"…","niveau":1,"enonce":"…","choix":["…","…","…"],"bonnes":[0],"explication":"…"},
 {"type":"vf","notion":"…","niveau":1,"enonce":"…","bonne":true,"explication":"…"},
 {"type":"num","notion":"…","niveau":2,"enonce":"…","reponse":12.5,"tolerance":0,"unite":"cm","explication":"…"},
 {"type":"trou","notion":"…","niveau":1,"enonce":"O ___ é …","reponses":["mot","variante"],"explication":"…"},
 {"type":"redige","notion":"…","niveau":3,"enonce":"…","corrige":"…","criteres":"…","explication":"…"}]}`;
}
async function genQuizQuestions(co, o, n, existing){
  const out = []; let titre = "";
  while (out.length < n){
    const k = Math.min(25, n - out.length), deja = [...(existing || []), ...out].map(q => q.enonce).join(" / ").slice(0, 6000);
    const r = await ai(quizPrompt(co, o, k, deja), {feature:"exercices"});
    const qs = (r?.questions || []).map(mapQuizQ).filter(Boolean).filter(q => o.types.includes(q.type));
    if (!qs.length) { if (!out.length) throw {code:"invalid_json"}; break; }
    titre = titre || r.titre || ""; out.push(...qs);
    if (qs.length < k / 2) break;
  }
  return {titre, questions:out.slice(0, n)};
}

}

function quizResults(q, cl, notions){
  const studs = cl?.eleves || [], R = Object.fromEntries(repsOf(q.id).map(r => [r.eleveId, r]));
  if (q.statut === "brouillon") return `<section class="panel empty">Publique o quiz para que os alunos possam treinar.</section>`;
  const rows = studs.map(e => { const r = R[e.id] || {}; const t = r.tentatives || []; const acq = notions.filter(n => r.notions?.[n]?.acquis).length;
    return {e, r, t:t.length, vues:r.vues || 0, taux:r.vues ? (r.ok || 0) / r.vues : null, acq, temps:t.reduce((s, x) => s + (x.dureeS || 0), 0), der:r.derniere}; });
  const sel = rows.find(x => x.e.id === S.qz.el);
  const qStats = (q.questions || []).map(x => { let v = 0, ok = 0; Object.values(R).forEach(r => { const s = r.q?.[x.id]; if (s){ v += s.v; ok += s.ok; } }); return {x, v, rate:v ? ok / v : null}; }).filter(s => s.v >= 2 && s.x.type !== "redige").sort((a, b) => a.rate - b.rate).slice(0, 6);
  const red = []; Object.values(R).forEach(r => (r.redigees || []).forEach((a, i) => { if (a.note == null){ const x = (q.questions || []).find(y => y.id === a.qid); if (x) red.push({r, a, i, x, e:studs.find(s => s.id === r.eleveId)}); } }));
  const tone = v => v == null ? "none" : v >= .7 ? "ok" : v >= .5 ? "warn" : "bad";
  return `<section class="panel"><div class="tbl-wrap"><table><thead><tr><th>Aluno</th><th class="c">Tentativas</th><th class="c">Questões vistas</th><th class="c">Acertos</th><th class="c">Conteúdos dominados</th><th class="c">Tempo</th><th>Última atividade</th></tr></thead><tbody>
    ${rows.map(x => `<tr class="clickable" data-qzel="${x.e.id}"${S.qz.el === x.e.id ? ' style="background:var(--surface-2)"' : ""}><td><b>${esc(x.e.prenom)} ${esc(x.e.nom)}</b></td><td class="c num">${x.t}</td><td class="c num">${x.vues}</td>
      <td class="c"><span class="cell ${tone(x.taux)}">${x.taux == null ? "—" : Math.round(x.taux * 100) + " %"}</span></td><td class="c num">${x.acq}/${notions.length}</td><td class="c num">${x.t ? dur(x.temps) : "—"}</td><td class="small muted">${x.der ? esc(new Date(x.der).toLocaleString("pt-BR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})) : "ainda não começou"}</td></tr>`).join("")}
    </tbody></table></div></section>
  ${sel ? `<section class="panel grid"><div class="row between"><h3>${esc(sel.e.prenom)} ${esc(sel.e.nom)}</h3><span class="small muted">${sel.t} tentativa(s) · ${sel.vues} questão(ões) · ${sel.t ? dur(sel.temps) : ""}</span></div>
    <div class="row">${notions.map(n => { const s = sel.r.notions?.[n]; const st = !s ? ["Não vista", ""] : s.acquis ? ["Dominado", "ok"] : s.ok ? ["Em andamento", "warn"] : ["A revisar", "bad"]; return `<span class="chip ${st[1]}" title="${s ? s.ok + " certa(s) de " + s.vus : ""}">${esc(n)} · ${st[0]}</span>`; }).join("")}</div>
    ${(sel.r.tentatives || []).length ? `<div class="small muted">${sel.r.tentatives.slice(-8).map(t => `${esc(new Date(t.at).toLocaleDateString("pt-BR"))} : ${t.ok}/${t.auto}${t.n > t.auto ? " + " + (t.n - t.auto) + " dissertativa(s)" : ""} en ${dur(t.dureeS)}`).join(" · ")}</div>` : ""}</section>` : ""}
  ${qStats.length ? `<section class="panel"><h3>Questões mais erradas</h3><div style="margin-top:6px">${qStats.map(s => `<div class="item"><div><div class="t small">${esc(s.x.enonce.slice(0, 140))}</div><div class="s">${esc(s.x.notion || "")} · vista ${s.v} fois</div></div><span class="cell ${tone(s.rate)}">${Math.round(s.rate * 100)} %</span></div>`).join("")}</div></section>` : ""}
  ${red.length ? `<section class="panel grid"><div class="row between"><h3>Respostas dissertativas a corrigir (${red.length})</h3><button class="btn sm primary" id="qz-redai">Corrigir com a IA</button></div><div class="status" id="qz-redst"></div>
    ${red.slice(0, 40).map(o => `<div class="item" style="align-items:start"><div style="display:grid;gap:4px"><div class="small muted">${esc(o.e ? o.e.prenom + " " + o.e.nom : "?")} · ${esc(o.x.notion || "")}</div><div class="t small">${esc(o.x.enonce)}</div>
      <div class="answer">${esc(o.a.rep)}</div>${o.x.corrige ? `<div class="small muted">Gabarito: ${esc(o.x.corrige)}</div>` : ""}</div>
      <div class="row" style="flex:none"><button class="btn sm" data-rednote="${o.r.eleveId}|${o.i}|1">✓ Certo</button><button class="btn sm" data-rednote="${o.r.eleveId}|${o.i}|0">✗ Revisar</button></div></div>`).join("")}</section>` : ""}`;
}

}

function cerOf(a, b){ a = [...String(a).normalize("NFC").replace(/\s+/g, " ").trim()]; b = [...String(b).normalize("NFC").replace(/\s+/g, " ").trim()]; if (!b.length) return a.length ? 1 : 0;
  let prev = Array.from({length:b.length + 1}, (_, j) => j); for (let i = 1; i <= a.length; i++){ const cur = [i]; for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return Math.min(1, prev[b.length] / b.length); }

S.dev = {list:null, ssid:"", pass:"", busy:false};
S.inboxSeen = new Set(); const INBOX_ITEMS = {};
async function pollInbox(){
  if (!window.TIKOUN_CONFIG?.accounts || !S.me || typeof SERVERSTORE === "undefined" || !SERVERSTORE || !DATA_READY || S.inboxBusy) return;
  S.inboxBusy = true;
  try {
    const r = await fetch("/api/scan/inbox", {credentials:"same-origin"}); if (!r.ok) return;
    const items = ((await r.json()).items || []).filter(x => !S.inboxSeen.has(x.id)); if (!items.length) return;
    let pages = 0;
    for (const x of items){
      S.inboxSeen.add(x.id);
      try { const blob = await getBlob(x.asset); const f = new File([blob], x.mime === "application/pdf" ? "scanner.pdf" : "scanner.jpg", {type:x.mime});
        const pgs = await lazyPages(f); INBOX_ITEMS[x.id] = {left:pgs.length, mine:0, groupe:x.groupe};
        const h = new Date(x.at).toLocaleTimeString(document.documentElement.lang === "en" ? "en-US" : "pt-BR", {hour:"2-digit", minute:"2-digit"});
        pgs.forEach(pg => S.queue.push({id:uid(), name:`Scanner · ${h}` + (pg.n > 1 ? " · p." + pg.i : ""), load:pg.load, thumb:pg.thumb, status:"attente", msg:"", inbox:x.id}));
        pages += pgs.length; }
      catch(e){ console.warn("inbox", e); inboxMark(x.id, "manuel"); }
    }
    if (pages){ toast(`${pages} página(s) recebida(s) do scanner: correção em andamento.`, 5000); scheduleRender(); runQueue(); }
  } catch(e){} finally { S.inboxBusy = false; }
}

function inboxPage(it, mine){
  const m = INBOX_ITEMS[it.inbox]; if (!m) return; m.left--; if (mine) m.mine++;
  if (m.left <= 0){ inboxMark(it.inbox, m.mine ? (m.manuel ? "manuel" : "fait") : (m.groupe ? "autre" : "manuel")); delete INBOX_ITEMS[it.inbox]; }
}

}
async function uploadLot(file){
  const it = {id:uid(), name:file.name, thumb:"", status:"envoi", pct:0, msg:"Enviando o arquivo…"}; S.queue.push(it); scheduleRender();
  try {
    const j = await api("/api/lots", {method:"POST", body:JSON.stringify({name:file.name, mime:file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : "image/jpeg"), kit:buildKit()})});
    it.lot = j.id;
    await new Promise((ok, ko) => { const x = new XMLHttpRequest(); x.open("PUT", "/api/lots/" + j.id + "/file"); x.withCredentials = true;
      x.upload.onprogress = e => { if (e.lengthComputable){ it.pct = Math.round(100 * e.loaded / e.total); it.msg = `Enviando o arquivo: ${it.pct} %`; jobsPill(); scheduleRender(); } };
      x.onload = () => x.status < 300 ? ok() : ko(new Error("HTTP " + x.status)); x.onerror = () => ko(new Error("rede")); x.send(file); });
    it.status = "lot"; it.msg = "Arquivo recebido: análise e correção no servidor. Você pode fechar o aplicativo."; it.pct = 100;
    toast("Arquivo enviado: o resto acontece no servidor, você pode fechar o aplicativo.", 6000);
  } catch(e){ it.status = "erreur"; it.msg = "Envio impossível (" + (e.message || "erreur") + "): tente novamente."; }
  scheduleRender(); watchJobs(); pollJobs();
}
const LOT_MSG = {qr:"QR e rodapé ilegíveis", inconnu:"prova de outro teste ou excluída", page:"página da prova não reconhecida", kit:"prova não preparada para este envio", ecriture:"ficha de escrita"};
function lotItems(){
  for (const l of S.lots || []){ let it = S.queue.find(x => x.lot === l.id);
    if (!it){ if (Date.parse(l.createdAt) <= S.jobsHide || S.lotGone.has(l.id)) continue; it = {id:uid(), name:l.name, lot:l.id, thumb:"", status:"lot", msg:""}; S.queue.push(it); }
    const js = S.jobs.filter(j => l.jobs.includes(j.id)), d = js.filter(j => j.status === "fait").length;
    const bad = l.pages.filter(p => p.status !== "fait"), nb = S.lotFixed[l.id] ? 0 : bad.length;
    it.status = l.status === "erreur" ? "erreur" : (l.status === "fini" && d === js.length) ? (nb ? "manuel" : "ok") : "lot";
    it.msg = l.status === "erreur" ? "Análise impossível: " + l.msg : `Páginas analisadas: ${l.done} / ${l.total || "…"} · corrigidas: ${d} / ${js.length}` + (nb ? ` · ${nb} página(s) a refazer (${[...new Set(bad.map(p => LOT_MSG[String(p.msg).split(":")[0]] || p.msg))].join(", ")})` : "");
    it.lotFix = nb ? l.id : null; }
}
async function lotFix(lid){
  const l = (S.lots || []).find(x => x.id === lid); if (!l) return; S.lotFixed[lid] = true; toast("Recuperando o arquivo…");
  try { const r = await fetch("/api/lots/" + lid + "/file", {credentials:"same-origin"}); if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob(), f = new File([blob], l.name, {type:blob.type}); const pages = await lazyPages(f), want = new Set(l.pages.filter(p => p.status !== "fait").map(p => p.i));
    for (const pg of pages) if (want.has(pg.i)) S.queue.push({id:uid(), name:l.name + " · p." + pg.i, load:pg.load, src:pg.src, thumb:pg.thumb, status:"attente", msg:""});
    lotItems(); render(); runQueue(); } catch(e){ S.lotFixed[lid] = false; toast("Recuperação impossível: " + e.message); }
}

/* ================= Boot ================= */
applyRoute(); render();
(async () => {
  if (!window.claude?.use){
    STANDALONE = true; $("#tabReglages").hidden = false;
    AI = apiSample(); DL = localDownloads; LIM = await AI.limits();
    if (cloudOn()){
      const c = cloudCfg(); SB = supabase.createClient(c.url, c.anon);
      const {data} = await SB.auth.getSession(); SB_USER = data?.session?.user || null;
      SB.auth.onAuthStateChange((ev, sess) => { if (!SB_USER && sess?.user){ SB_USER = sess.user; startCloud(); } });
      if (SB_USER) await startCloud(); else { refreshCaps(); render(); }
      return;
    }
    if (window.TIKOUN_CONFIG?.accounts){ await bootAccounts(); return; }
    if (window.TIKOUN_CONFIG?.storage === "server"){
      const ok = await fetch("/api/check", {credentials:"same-origin", headers:{"x-tikoun-code":accessCode()}}).then(r => r.ok).catch(() => false);
      if (ok) await startServer(); else { NEED_CODE = true; refreshCaps(); render(); }
      return;
    }
    try { DB = await localDB(); ASSETS = await localAssets(); } catch(e){ console.warn(e); DB = memDB(); LOCAL = true; }
    NEED_CODE = !!(window.TIKOUN_CONFIG?.codeRequired && !accessCode());
    refreshCaps(); render();
  } else {
    const use = n => window.claude.use(n).catch(() => null);
    [DB, AI, ASSETS, DL] = await Promise.all([use("db"), use("sample"), use("assets"), use("downloads")]);
    if (AI) LIM = await AI.limits().catch(() => null);
    if (!DB){ DB = memDB(); LOCAL = true; }
    $("#caps").textContent = "Menu"; $("#upst").innerHTML = [["IA", AI], ["Fotos IA", LIM?.images], ["Backup", !LOCAL], ["Digitalizações armazenadas", ASSETS], ["PDF", DL]].map(([l, v]) => `${l} ${v ? "✓" : "✗"}`).join(" · ");
  }
  for (const col of ["classes","cours","controles"]){
    DB.collection(col).onSnapshot(s => { store[col] = s.docs.map(x => ({id:x.id, ...structuredClone(x.data())})); scheduleRender(); }, e => toast("Leitura impossível: " + (e?.code || "")));
  }
  for (const col of ["ecritures","bilans"]) DB.collection(col).onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store[col] = m; scheduleRender(); }, e => console.warn(e));
  DB.collection("feuilles").onSnapshot(s => { const m = {}; s.docs.forEach(x => m[x.id] = structuredClone(x.data())); store.feuilles = m; scheduleRender(); }, e => console.warn(e));
})();
